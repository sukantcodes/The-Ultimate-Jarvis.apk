<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JARVIS Elliptical Orb</title>
<style>
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: transparent !important;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
#c {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  display: block; touch-action: none; outline: none;
}
/* ---- CSS-only fallback, used only if WebGL is missing or a shader fails ---- */
#fb { display: none; position: absolute; left: 50%; top: 50%; width: 70%; height: 46%;
  margin: 0; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(ellipse at 50% 45%, var(--fa, #8fb2ff) 0%, var(--fb, #5b6cff) 45%, transparent 72%);
  filter: blur(6px); opacity: .85; animation: fbpulse 3.2s ease-in-out infinite; }
body.fb #fb { display: block; }
body.fb #c { display: none; }
body.fb.listening #fb { animation-duration: 1.4s; }
body.fb.thinking #fb { animation-duration: .9s; }
body.fb.speaking #fb { animation-duration: .6s; }
@keyframes fbpulse { 50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } }
#dbg { display: none; position: absolute; left: 6px; top: 6px; font: 11px/1.3 monospace; color: #0f0;
  background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 4px; pointer-events: none; white-space: pre; }
body.debug #dbg { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="fb"></div>
</div>
<div id="dbg"></div>

<script src="three.min.js"></script>
<script>
(function () {
"use strict";

/* =====================================================================
   JARVIS Elliptical Orb  -  premium reactive particle orb (three.js r128)
   Public API: window.JarvisOrb  (see bottom of file)
   ===================================================================== */

const Q = new URLSearchParams(location.search);
const DEBUG = Q.get("debug") === "1";
if (DEBUG) document.body.classList.add("debug");

const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const dbg = document.getElementById("dbg");

/* ---------- geometry / tuning constants ---------- */
const RX = 1.34, RY = 0.92, RZ = 0.92;           // ellipsoid radii (horizontal ellipse)
const FOV = 40, TAN = Math.tan(FOV * Math.PI / 360);
const MAX_P = 24000;                              // particle budget at full quality
const N_SPORE = 150;
const HALO_W = 2.15, HALO_H = 1.62;               // half-size of the halo quad (world units)

/* quality ladder: device-pixel-ratio cap + fraction of particles drawn */
const LEVELS = [
  { dpr: 2.00, frac: 1.00 },
  { dpr: 1.75, frac: 0.80 },
  { dpr: 1.50, frac: 0.62 },
  { dpr: 1.25, frac: 0.46 },
  { dpr: 1.00, frac: 0.34 }
];

/* ---------- voice / AI state targets ---------- */
const STATES = {
  idle:      { scale: 1.00, speed: 0.45, wob: 0.34, bright: 1.00, glow: 0.62, ring: 0.30, spore: 0.55, listen: 0, think: 0, speak: 0 },
  listening: { scale: 1.035, speed: 0.90, wob: 0.50, bright: 1.12, glow: 0.88, ring: 0.60, spore: 1.00, listen: 1, think: 0, speak: 0 },
  thinking:  { scale: 1.015, speed: 1.65, wob: 0.85, bright: 1.10, glow: 0.92, ring: 1.00, spore: 1.90, listen: 0, think: 1, speak: 0 },
  speaking:  { scale: 1.05, speed: 1.15, wob: 0.58, bright: 1.18, glow: 1.00, ring: 0.80, spore: 1.30, listen: 0, think: 0, speak: 1 }
};

let state = "idle", working = false, glowMul = 1.0;
const cur = Object.assign({}, STATES.idle);
const tgt = Object.assign({}, STATES.idle);

function effectiveState() { return (working && state === "idle") ? "thinking" : state; }
function refreshTarget() {
  const s = effectiveState();
  Object.assign(tgt, STATES[s]);
  document.body.classList.remove("idle", "listening", "thinking", "speaking");
  document.body.classList.add(s);
}

/* ---------- fallback (no WebGL / shader failure) ---------- */
let dead = false;
function useFallback(why) {
  dead = true;
  document.body.classList.add("fb");
  try { console.warn("JarvisOrb fallback: " + why); } catch (e) {}
}

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas: canvas, alpha: true, antialias: false, depth: false, stencil: false,
    premultipliedAlpha: true, powerPreference: "high-performance", preserveDrawingBuffer: false
  });
  if (!renderer.getContext()) throw new Error("no context");
} catch (e) {
  renderer = null;
  useFallback("WebGL unavailable");
}

/* Pre-seed the palette so the fallback gradient matches the theme too */
const PRESETS = {
  dark:   { light: false, a: "#5B8CFF", b: "#A78BFA" },
  red:    { light: false, a: "#FF4D5E", b: "#FB7185" },
  bio:    { light: false, a: "#00E5A0", b: "#00B4FF" },
  sunset: { light: true,  a: "#FF6A3D", b: "#E879A8" },
  light:  { light: true,  a: "#2F6BFF", b: "#8B5CF6" }
};

function derivePalette(isLight, hexA, hexB) {
  const ca = new THREE.Color(hexA), cb = new THREE.Color(hexB || hexA);
  const ha = { h: 0, s: 0, l: 0 }, hb = { h: 0, s: 0, l: 0 };
  ca.getHSL(ha); cb.getHSL(hb);
  let h1 = ha.h, h2 = hb.h, sat = 1;
  if (ha.s < 0.08) { h1 = 0.60; }                                   // neutral swatch -> cool blue
  if (hb.s < 0.08 || Math.abs(h1 - h2) < 0.02) h2 = (h1 + 0.09) % 1; // single colour -> analogous partner
  const w = x => ((x % 1) + 1) % 1;
  const mk = (h, s, l) => new THREE.Color().setHSL(w(h), s * sat, l);
  return isLight
    ? { deep: mk(h1, 0.80, 0.34), main: mk(h1, 0.86, 0.50), hi1: mk(h2, 0.84, 0.57), hi2: mk(h1 - 0.07, 0.84, 0.63) }
    : { deep: mk(h1, 0.80, 0.27), main: mk(h1, 0.92, 0.58), hi1: mk(h2, 0.95, 0.68), hi2: mk(h1 + 0.08, 0.95, 0.75) };
}

let isLightUI = true;
let palTarget = derivePalette(true, PRESETS.light.a, PRESETS.light.b);

/* =====================================================================
   Shared uniforms
   ===================================================================== */
const U = {
  uTime: { value: 0 }, uRaw: { value: 0 }, uSpore: { value: 0 },
  uLevel: { value: 0 }, uBass: { value: 0 }, uHigh: { value: 0 },
  uBurst: { value: 0 }, uPress: { value: 0 }, uHold: { value: 0 },
  uThink: { value: 0 }, uListen: { value: 0 }, uSpeak: { value: 0 },
  uWob: { value: 0.34 }, uBright: { value: 1 }, uStrength: { value: 0.6 },
  uPx: { value: 600 }, uCamZ: { value: 6 }, uLight: { value: 1 },
  uAlphaMul: { value: 1 }, uScale: { value: 1 },
  uRadii: { value: new THREE.Vector3(RX, RY, RZ) },
  uRot: { value: new THREE.Matrix3() },
  uTouch: { value: new THREE.Vector3() }, uTouchS: { value: 0 },
  uSwipe: { value: new THREE.Vector3() },
  uShockO: { value: new THREE.Vector4(0, 0, 0, -1) }, uShockS: { value: 0 },
  uRip: { value: [new THREE.Vector4(-1, 0, 0, 0), new THREE.Vector4(-1, 0, 0, 0), new THREE.Vector4(-1, 0, 0, 0), new THREE.Vector4(-1, 0, 0, 0)] },
  uRipP: { value: [new THREE.Vector2(0.9, 0.7), new THREE.Vector2(0.9, 0.7), new THREE.Vector2(0.9, 0.7), new THREE.Vector2(0.9, 0.7)] },
  uHalf: { value: new THREE.Vector2(HALO_W, HALO_H) },
  cDeep: { value: palTarget.deep.clone() }, cMain: { value: palTarget.main.clone() },
  cHi1: { value: palTarget.hi1.clone() }, cHi2: { value: palTarget.hi2.clone() }
};

/* =====================================================================
   Shaders
   ===================================================================== */
const NOISE_GLSL = `
float wave(vec3 p, float t) {
  float a = sin(p.x * 2.1 + t * 0.90) * cos(p.y * 2.6 - t * 0.70) * sin(p.z * 2.3 + t * 0.80);
  float b = sin(p.y * 4.7 - t * 1.40 + p.x * 2.0) * cos(p.z * 4.2 + t * 1.10);
  float c = cos((p.x - p.y + p.z) * 3.4 + t * 1.60);
  return a * 0.50 + b * 0.30 + c * 0.20;
}`;

const partV = `
uniform float uRaw, uTime, uLevel, uBass, uHigh, uBurst, uPress, uHold, uThink, uListen, uWob;
uniform float uBright, uPx, uCamZ, uLight, uAlphaMul, uTouchS, uShockS;
uniform vec3 uRadii, uTouch, uSwipe, cDeep, cMain, cHi1, cHi2;
uniform mat3 uRot;
uniform vec4 uShockO;
attribute vec4 aSeed;
varying vec3 vCol;
varying float vA;
varying float vRim;
varying float vSpark;
${NOISE_GLSL}
void main() {
  vec3 d = uRot * position;                 /* spin the globe, silhouette stays a perfect ellipse */
  float shell = aSeed.y;
  float t = uTime;

  /* thinking: latitude-dependent twist */
  float tw = uThink * 0.85 * sin(d.y * 2.4 + uRaw * 1.1);
  float cs = cos(tw), sn = sin(tw);
  vec3 dd = vec3(d.x * cs - d.z * sn, d.y, d.x * sn + d.z * cs);
  float lat = dd.y;
  float lon = atan(dd.z, dd.x);

  float w1 = wave(dd * 1.35, t);
  float w2 = wave(dd * 2.5 + vec3(3.1, 1.7, 2.3), t * 1.35);

  float disp = (w1 * 0.055 + w2 * 0.026) * uWob * (0.55 + 0.45 * shell);
  float belt = 1.0 - 0.55 * lat * lat;                    /* keep the elliptical silhouette clean at the poles/tips */
  disp += uBass * (0.070 + 0.035 * sin(lat * 4.0 + uRaw * 4.0)) * belt;
  disp += uLevel * 0.038 * sin(lat * 9.0 - uRaw * 7.0) * belt;
  disp += uHigh * 0.04 * sin(lon * 9.0 - uRaw * 9.0 + lat * 6.0) * (0.5 + 0.5 * aSeed.x);
  disp += uListen * 0.022 * sin(lat * 8.0 + uRaw * 5.0);
  disp += uBurst * (0.22 * (0.4 + aSeed.z) + 0.08 * w2);
  disp -= uPress * 0.05 + uHold * 0.09;

  vec3 pos = dd * uRadii * shell * (1.0 + disp);

  /* inner cytoplasm drift */
  float inner = 1.0 - smoothstep(0.55, 0.95, shell);
  pos += vec3(sin(dd.y * 3.0 + t * 1.3 + aSeed.x * 6.28),
              cos(dd.z * 3.2 - t * 1.1 + aSeed.z * 6.28),
              sin(dd.x * 3.1 + t * 1.2)) * 0.05 * inner;

  /* expanding shockwave (tap / state change / voice peak) */
  if (uShockO.w >= 0.0) {
    vec3 so = pos - uShockO.xyz;
    float dist = length(so);
    float rr = uShockO.w * 2.6;
    float ring = exp(-(dist - rr) * (dist - rr) * 10.0) * sin((dist - rr) * 14.0) * (1.0 - uShockO.w) * uShockS;
    pos += normalize(so + vec3(0.0001)) * ring * 0.16;
  }

  /* touch: liquid push + swirl + swipe wake */
  float zone = 0.0;
  if (uTouchS > 0.001) {
    vec3 tp = pos - uTouch;
    float dist = length(tp);
    zone = exp(-dist * dist * 2.2) * uTouchS;
    vec3 pd = normalize(tp + vec3(0.0001, 0.0002, 0.0001));
    pos += (pd * 0.30 + cross(pd, vec3(0.0, 0.0, 1.0)) * 0.13 + uSwipe * 0.45) * zone * (0.6 + 0.7 * aSeed.x);
  }

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  float depth = smoothstep(-1.3, 1.3, mv.z + uCamZ);

  vec3 n = normalize(dd / uRadii);
  vec3 vn = normalize(normalMatrix * n);
  vRim = pow(1.0 - abs(vn.z), 2.0) * smoothstep(0.55, 0.95, shell);
  vSpark = 0.5 + 0.5 * sin(uRaw * (3.5 + aSeed.x * 5.0) + aSeed.x * 62.83);

  /* colour: flowing multi-stop gradient + fresnel rim + nucleus tint */
  float g1 = smoothstep(-0.8, 0.9, d.y + w1 * 0.6);
  float g2 = 0.5 + 0.5 * sin(lon + uRaw * 0.35 + w2 * 2.0);
  vec3 c = mix(cDeep, cMain, smoothstep(0.0, 1.0, shell * 0.55 + g1 * 0.55));
  c = mix(c, cHi1, g2 * 0.55 * smoothstep(0.1, 1.0, g1 + 0.25));
  c = mix(c, cHi2, smoothstep(0.55, 1.0, 0.5 + 0.5 * sin(lon * 3.0 - uRaw * 0.5 + lat * 2.0 + aSeed.x * 1.4)) * 0.5);
  c = mix(c, mix(cHi1, cHi2, 0.5 + 0.5 * sin(uRaw * 1.2 + lat * 3.0)), vRim * 0.55);
  c = mix(c, mix(cMain, cHi1, 0.5), (1.0 - shell) * 0.55);
  float scan = exp(-pow((d.y - sin(uRaw * 1.4) * 0.9) * 6.0, 2.0)) * uThink;
  c += cHi1 * scan * 0.55;
  c = mix(c, mix(cHi1, cHi2, 0.5), clamp(zone * 0.6 + uBurst * 0.4, 0.0, 0.7));

  vCol = c * uBright * mix(0.70, 1.10, depth);
  /* back hemisphere falls away, the silhouette rim lights up: reads as a glass sphere, not a flat disc */
  vA = (0.12 + 0.80 * depth * depth) * mix(0.55, 1.0, shell) * (0.72 + 0.28 * aSeed.x) * (1.0 + vRim * 1.1) * uAlphaMul;

  float sz = (0.0090 + 0.0150 * aSeed.x * aSeed.x)
           * (1.0 + uLevel * 0.50 + uBurst * 0.40 + vSpark * 0.18 + zone * 0.40)
           * mix(0.85, 1.20, depth);
  gl_PointSize = max(sz * uPx / (-mv.z), 1.5);
  gl_Position = projectionMatrix * mv;
}`;

const partF = `
uniform float uLight;
varying vec3 vCol;
varying float vA;
varying float vRim;
varying float vSpark;
void main() {
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;
  float body = smoothstep(0.5, 0.02, d);
  float core = exp(-d * d * 26.0);
  float a = clamp(body * 0.70 + core * 0.45, 0.0, 1.0) * vA;
  vec3 col = vCol * (0.92 + (core * 0.70 * (0.8 + 0.2 * vSpark) + vRim * 0.35) * (1.0 - 0.8 * uLight));
  gl_FragColor = vec4(col, a);
}`;

const sporeV = `
uniform float uRaw, uSpore, uLevel, uBurst, uPx, uCamZ, uStrength;
uniform vec3 cMain, cHi1, cHi2;
attribute vec4 aOrb;
attribute vec4 aOrb2;
varying vec3 vCol;
varying float vA;
void main() {
  float ang = aOrb.x + uSpore * aOrb.z;
  float r = aOrb.y * (1.0 + 0.05 * sin(uRaw * 0.9 + aOrb.w)) + uLevel * 0.10 + uBurst * 0.25;
  vec3 p = vec3(cos(ang) * r * 1.34, aOrb2.y * 0.8 + sin(ang * 1.7 + aOrb.w) * 0.10, sin(ang) * r * 0.74);
  float c = cos(aOrb2.x), s = sin(aOrb2.x);
  p.xy = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float depth = smoothstep(-1.2, 1.2, mv.z + uCamZ);
  float tw = 0.5 + 0.5 * sin(uRaw * (1.5 + abs(aOrb.z) * 2.0) + aOrb.w * 6.28);
  vA = pow(tw, 1.3) * mix(0.25, 1.0, depth) * uStrength;
  vCol = mix(mix(cMain, cHi1, aOrb2.w), cHi2, step(0.8, aOrb2.w));
  gl_PointSize = max(aOrb2.z * uPx / (-mv.z) * (1.0 + uLevel * 0.5), 1.5);
  gl_Position = projectionMatrix * mv;
}`;

const sporeF = `
uniform float uLight;
varying vec3 vCol;
varying float vA;
void main() {
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;
  float core = exp(-d * d * 22.0);
  float a = clamp(smoothstep(0.5, 0.0, d) * 0.7 + core * 0.5, 0.0, 1.0) * vA;
  gl_FragColor = vec4(vCol * (0.95 + core * 0.5 * (1.0 - uLight)), a);
}`;

const quadV = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

const haloF = `
varying vec2 vUv;
uniform float uRaw, uScale, uStrength, uLevel, uPress, uLight;
uniform vec3 cMain, cHi1, cHi2;
uniform vec4 uRip[4];
uniform vec2 uRipP[4];
uniform vec2 uHalf;
void main() {
  vec2 p = (vUv - 0.5) * 2.0 * uHalf;
  vec2 q = p / (vec2(${RX.toFixed(2)}, ${RY.toFixed(2)}) * uScale);
  float e = length(q);
  float ang = atan(q.y, q.x);
  float outside = max(e - 1.0, 0.0);
  float halo = exp(-outside * 3.6) * smoothstep(1.62, 1.05, e);
  /* soft glass body: brighter toward the rim, with a faint centre */
  float fill = smoothstep(0.30, 1.0, e) * (1.0 - smoothstep(0.92, 1.16, e));
  float inner = fill * 0.20 * (1.0 + 0.9 * uLight) + smoothstep(1.0, 0.0, e) * 0.05;
  float edgeFade = smoothstep(1.0, 0.80, max(abs(vUv.x - 0.5), abs(vUv.y - 0.5)) * 2.0);
  vec3 col = mix(cMain, cHi1, 0.5 + 0.5 * sin(ang + uRaw * 0.45));
  col = mix(col, cHi2, 0.35 * (0.5 + 0.5 * cos(ang * 2.0 - uRaw * 0.6)));
  float rimLine = exp(-pow((e - 1.0) * 16.0, 2.0)) * (0.40 + 0.40 * uLevel + 0.30 * uPress) * (0.62 + 0.38 * sin(ang * 3.0 + uRaw * 0.8));
  float rip = 0.0;
  for (int i = 0; i < 4; i++) {
    float age = uRip[i].x;
    if (age >= 0.0) {
      float dd = length(q - uRip[i].zw) - (uRipP[i].x + age * uRipP[i].y);
      rip += exp(-dd * dd * 70.0) * (1.0 - age) * uRip[i].y;
    }
  }
  float a = (halo * uStrength * 0.55 + inner * uStrength + rimLine * 0.55 + rip * 0.55) * edgeFade;
  a *= mix(1.0, 0.62, uLight);
  gl_FragColor = vec4(col, clamp(a, 0.0, 0.85));
}`;

const nucF = `
varying vec2 vUv;
uniform vec3 cMain, cHi1;
uniform float uStrength, uRaw, uLevel, uLight, uPress;
void main() {
  vec2 c = (vUv - 0.5) * 2.0;
  float d = length(c);
  float g = exp(-d * d * 5.5);
  float g2 = exp(-d * d * 16.0);
  vec3 col = mix(cMain, cHi1, 0.35 + 0.35 * sin(uRaw * 0.8));
  col = mix(col, vec3(1.0), g2 * 0.22 * (1.0 - uLight));
  float a = (g * 0.30 + g2 * 0.35) * uStrength * (0.70 + 0.60 * uLevel + 0.30 * uPress) * smoothstep(1.0, 0.7, d);
  gl_FragColor = vec4(col, a * mix(1.0, 0.7, uLight));
}`;

const ringV = `
varying vec2 vP; varying float vZ;
void main() {
  vP = position.xy;
  vZ = (modelMatrix * vec4(position, 1.0)).z;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const ringF = `
varying vec2 vP; varying float vZ;
uniform float uAlpha, uPhase, uTail, uWidth, uLight;
uniform vec3 cA, cB;
void main() {
  float r = length(vP);
  float d = abs(r - 0.86);
  float line = smoothstep(uWidth, 0.0, d);
  float glow = exp(-d * 30.0) * 0.30 * smoothstep(1.0, 0.9, r);
  float ang = atan(vP.y, vP.x);
  float t = mod(uPhase - ang, 6.2831853);
  float comet = exp(-t * uTail) * smoothstep(0.0, 0.35, t);   /* soft leading edge, long fading tail */
  float depthCue = mix(0.30, 1.0, smoothstep(-0.35, 0.45, vZ));
  vec3 col = mix(cA, cB, 0.5 + 0.5 * sin(ang + uPhase));
  col = mix(col, vec3(1.0), comet * 0.35 * (1.0 - uLight));
  float a = (line * (0.20 + comet * 1.10) + glow * (0.25 + comet)) * uAlpha * depthCue;
  gl_FragColor = vec4(col, clamp(a, 0.0, 0.9));
}`;

/* =====================================================================
   Scene
   ===================================================================== */
let scene, camera, rig, partMat, sporeMat, haloMat, nucMat, ringMats = [], rings = [], partGeo, halo, nucleus;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Surface-area weight of the ellipsoid per unit solid angle, for even particle density */
function areaWeight(x, y, z) {
  const px = x * RX, py = y * RY, pz = z * RZ;
  const p2 = px * px + py * py + pz * pz;
  const nx = x / RX, ny = y / RY, nz = z / RZ;
  const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
  const cosPsi = (px * nx + py * ny + pz * nz) / (Math.sqrt(p2) * nl);
  return p2 / cosPsi;
}

function buildParticles() {
  const rand = mulberry32(1337);
  const g = 1.32471795724474602596, a1 = 1 / g, a2 = 1 / (g * g);   // R2 low-discrepancy: any prefix is evenly spread
  let maxA = 0;
  for (let i = 0; i < 4000; i++) {
    const u = (0.5 + a1 * i) % 1, v = (0.5 + a2 * i) % 1;
    const cy = 1 - 2 * u, sy = Math.sqrt(1 - cy * cy), ph = 6.2831853 * v;
    maxA = Math.max(maxA, areaWeight(sy * Math.cos(ph), cy, sy * Math.sin(ph)));
  }
  maxA *= 1.02;

  const dir = new Float32Array(MAX_P * 3), seed = new Float32Array(MAX_P * 4);
  let k = 0, i = 0;
  while (k < MAX_P && i < MAX_P * 6) {
    const u = (0.5 + a1 * i) % 1, v = (0.5 + a2 * i) % 1; i++;
    const cy = 1 - 2 * u, sy = Math.sqrt(1 - cy * cy), ph = 6.2831853 * v;
    const x = sy * Math.cos(ph), y = cy, z = sy * Math.sin(ph);
    if (rand() * maxA > areaWeight(x, y, z)) continue;
    dir[k * 3] = x; dir[k * 3 + 1] = y; dir[k * 3 + 2] = z;
    const h = rand();
    const shell = h < 0.58 ? 0.965 + 0.045 * rand()
                : h < 0.84 ? 0.80 + 0.15 * rand()
                :            0.32 + 0.46 * Math.sqrt(rand());
    seed[k * 4] = rand(); seed[k * 4 + 1] = shell; seed[k * 4 + 2] = rand(); seed[k * 4 + 3] = rand();

  geo.setAttribute("position", new THREE.BufferAttribute(dir, 3));
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 4));
  geo.setDrawRange(0, k);
  geo.userData.count = k;

}

function buildSpores() {
  const rand = mulberry32(4242);
  const pos = new Float32Array(N_SPORE * 3), o1 = new Float32Array(N_SPORE * 4), o2 = new Float32Array(N_SPORE * 4);
  for (let i = 0; i < N_SPORE; i++) {
    const sp = (0.12 + rand() * 0.30) * (rand() < 0.5 ? -1 : 1);
    o1[i * 4] = rand() * 6.2831853; o1[i * 4 + 1] = 1.14 + rand() * 0.46; o1[i * 4 + 2] = sp; o1[i * 4 + 3] = rand() * 6.2831853;
    o2[i * 4] = (rand() - 0.5) * 1.1; o2[i * 4 + 1] = (rand() - 0.5) * 1.0; o2[i * 4 + 2] = 0.020 + rand() * 0.036; o2[i * 4 + 3] = rand();
  }

  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aOrb", new THREE.BufferAttribute(o1, 4));
  geo.setAttribute("aOrb2", new THREE.BufferAttribute(o2, 4));

}

function mat(vs, fs, uniforms, extra) {

    vertexShader: vs, fragmentShader: fs, uniforms: uniforms,
    transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide

}

function buildScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 40);
  camera.position.set(0, 0, 6);

  /* halo (outside the rig so it never rotates) */
  haloMat = mat(quadV, haloF, {
    uRaw: U.uRaw, uScale: U.uScale, uStrength: U.uStrength, uLevel: U.uLevel, uPress: U.uPress, uLight: U.uLight,
    cMain: U.cMain, cHi1: U.cHi1, cHi2: U.cHi2, uRip: U.uRip, uRipP: U.uRipP, uHalf: U.uHalf
  });
  halo = new THREE.Mesh(new THREE.PlaneGeometry(HALO_W * 2, HALO_H * 2), haloMat);
  halo.position.z = -0.4; halo.renderOrder = 0; halo.frustumCulled = false;
  scene.add(halo);

  rig = new THREE.Group();
  scene.add(rig);

  nucMat = mat(quadV, nucF, {
    cMain: U.cMain, cHi1: U.cHi1, uStrength: U.uStrength, uRaw: U.uRaw, uLevel: U.uLevel, uLight: U.uLight, uPress: U.uPress
  });
  nucleus = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.45), nucMat);
  nucleus.renderOrder = 1; nucleus.frustumCulled = false;
  rig.add(nucleus);

  partGeo = buildParticles();
  partMat = mat(partV, partF, {
    uRaw: U.uRaw, uTime: U.uTime, uLevel: U.uLevel, uBass: U.uBass, uHigh: U.uHigh, uBurst: U.uBurst,
    uPress: U.uPress, uHold: U.uHold, uThink: U.uThink, uListen: U.uListen, uWob: U.uWob,
    uBright: U.uBright, uPx: U.uPx, uCamZ: U.uCamZ, uLight: U.uLight, uAlphaMul: U.uAlphaMul,
    uTouchS: U.uTouchS, uShockS: U.uShockS, uRadii: U.uRadii, uTouch: U.uTouch, uSwipe: U.uSwipe,
    cDeep: U.cDeep, cMain: U.cMain, cHi1: U.cHi1, cHi2: U.cHi2, uRot: U.uRot, uShockO: U.uShockO
  });
  const pts = new THREE.Points(partGeo, partMat);
  pts.renderOrder = 2; pts.frustumCulled = false;
  rig.add(pts);

  /* three gyroscopic elliptical rings with travelling comets */
  const ringDefs = [
    { sx: 1.22, sy: 1.30, seed: 0.0, w: 0.012, tail: 1.7 },
    { sx: 1.36, sy: 1.48, seed: 2.1, w: 0.010, tail: 2.2 },
    { sx: 1.10, sy: 1.16, seed: 4.2, w: 0.011, tail: 2.8 }

  ringDefs.forEach(function (d) {
    const m = mat(ringV, ringF, {
      uAlpha: { value: 0.4 }, uPhase: { value: d.seed }, uTail: { value: d.tail }, uWidth: { value: d.w },
      uLight: U.uLight, cA: U.cMain, cB: U.cHi2

    mesh.scale.set(RX * d.sx, RY * d.sy, 1);
    mesh.renderOrder = 3; mesh.frustumCulled = false;

    uRaw: U.uRaw, uSpore: U.uSpore, uLevel: U.uLevel, uBurst: U.uBurst, uPx: U.uPx, uCamZ: U.uCamZ,
    uStrength: { value: 0.8 }, cMain: U.cMain, cHi1: U.cHi1, cHi2: U.cHi2, uLight: U.uLight
  });

function setBlendMode(light) {
  const mode = light ? THREE.NormalBlending : THREE.AdditiveBlending;
  [partMat, sporeMat, haloMat, nucMat].concat(ringMats).forEach(function (m) { m.blending = mode; m.needsUpdate = true; });
  U.uLight.value = light ? 1 : 0;
  U.uAlphaMul.value = light ? 1.05 : 0.62;
}

/* =====================================================================
   Theme
   ===================================================================== */
function setAppTheme(isLight, hexA, hexB) {
  isLightUI = !!isLight;
  palTarget = derivePalette(isLightUI, hexA || PRESETS.light.a, hexB || hexA || PRESETS.light.b);
  document.documentElement.style.setProperty("--fa", "#" + palTarget.hi1.getHexString());
  document.documentElement.style.setProperty("--fb", "#" + palTarget.main.getHexString());
  if (renderer) setBlendMode(isLightUI);
}
function setThemeByName(name) {
  const p = PRESETS[name] || PRESETS.light;
  setAppTheme(p.light, p.a, p.b);
}
function luminance(hex) { const c = new THREE.Color(hex); return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b; }

/* =====================================================================
   Audio (native bridge first, simulated only when no native audio ever arrives)
   ===================================================================== */
const audio = { level: 0, bass: 0, high: 0 };
const ext = { level: 0, bass: 0, high: 0, t: -1e9, ever: false };

function setExternalAudio(level, bass, high) {
  const c = v => Math.max(0, Math.min(1, Number(v) || 0));
  const l = c(level);
  ext.level = l;
  ext.bass = (bass === undefined || bass === null) ? l : c(bass);
  ext.high = (high === undefined || high === null) ? l : c(high);
  ext.t = performance.now();
  ext.ever = true;
}
function simAudio(t) {
  let l, b, h;
  if (state === "speaking") {
    const syl = Math.pow(Math.abs(Math.sin(t * 7.5) * Math.sin(t * 2.3 + 1)), 0.75);
    const gate = Math.sin(t * 0.95) > -0.68 ? 1 : 0.16;
    l = (0.30 + 0.50 * syl) * gate; b = l * (0.68 + 0.32 * Math.sin(t * 5.2)); h = l * (0.52 + 0.48 * Math.sin(t * 11.5));
  } else if (state === "listening") {
    l = 0.16 + 0.16 * Math.abs(Math.sin(t * 3.3) * Math.sin(t * 1.4)); b = l * 0.85; h = l * 0.55;
  } else if (state === "thinking") {
    l = 0.12 + 0.07 * Math.sin(t * 2.8); b = l * 0.75; h = l * 0.72;
  } else {
    l = 0.05 + 0.03 * Math.sin(t * 1.35); b = l * 0.9; h = l * 0.55;
  }
  return [l, b, h];
}

/* =====================================================================
   Interaction state
   ===================================================================== */
let time = 0, flow = 0, sporePhase = 0, yaw = 0, pitch = 0, yawVel = 0;
let burst = 0, press = 0, pressTarget = 0, hold = 0, touchS = 0;
let dragging = false, downT = 0, moved = false, px = 0, py = 0;
let tiltX = 0, tiltY = 0, ptrX = 0, ptrY = 0, gBase = null;
let lastRipple = -1, prevLevel = 0, ripIdx = 0;
const ripLife = [0, 0, 0, 0];
const touchLocal = new THREE.Vector3(), prevLocal = new THREE.Vector3();
const swipe = new THREE.Vector3();
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();

function emitRipple(strength, ox, oy) {
  const i = ripIdx; ripIdx = (ripIdx + 1) % 4;
  const fromCenter = (ox === undefined);
  U.uRip.value[i].set(0, Math.max(0.15, Math.min(1, strength)), fromCenter ? 0 : ox, fromCenter ? 0 : oy);
  U.uRipP.value[i].set(fromCenter ? 0.92 : 0.0, fromCenter ? 0.75 : 1.2);
  ripLife[i] = fromCenter ? 1.7 : 1.3;
}

function emitShock(x, y, z, strength) {
  U.uShockO.value.set(x, y, z, 0);
  U.uShockS.value = strength;
}

function toLocal(cx, cy, out) {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((cx - r.left) / Math.max(r.width, 1)) * 2 - 1;
  ndc.y = -((cy - r.top) / Math.max(r.height, 1)) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  if (!raycaster.ray.intersectPlane(hitPlane, hit)) return out.set(0, 0, 0);
  const s = Math.max(rig.scale.x, 0.01);
  const x = hit.x / s, y = hit.y / s;
  const f = 1 - (x / RX) * (x / RX) - (y / RY) * (y / RY);
  return out.set(x, y, f > 0 ? RZ * Math.sqrt(f) : 0);
}

function onDown(e) {
  if (dead) return;
  dragging = true; moved = false; downT = performance.now(); px = e.clientX; py = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  toLocal(e.clientX, e.clientY, touchLocal); prevLocal.copy(touchLocal);
  touchS = 1.0; pressTarget = 1;
  emitRipple(0.55, touchLocal.x / RX, touchLocal.y / RY);
  emitShock(touchLocal.x, touchLocal.y, touchLocal.z, 0.8);
  burst = Math.max(burst, 0.10);
}
function onMove(e) {
  if (dead) return;
  toLocal(e.clientX, e.clientY, touchLocal);
  swipe.subVectors(touchLocal, prevLocal).multiplyScalar(10);
  swipe.clampLength(0, 2.0);
  prevLocal.copy(touchLocal);
  ptrX = Math.max(-1, Math.min(1, (e.clientX / Math.max(window.innerWidth, 1)) * 2 - 1));
  ptrY = Math.max(-1, Math.min(1, (e.clientY / Math.max(window.innerHeight, 1)) * 2 - 1));
  if (!dragging) {
    if (e.pointerType === "mouse") touchS = Math.max(touchS, 0.35);
    return;
  }
  const dx = e.clientX - px, dy = e.clientY - py;
  if (Math.abs(e.clientX - px) + Math.abs(e.clientY - py) > 0) {
    yawVel += dx * 0.010;
    pitch = Math.max(-0.9, Math.min(0.9, pitch + dy * 0.0045));
  }
  px = e.clientX; py = e.clientY;
  moved = true; touchS = 1.2;
}
function onUp() {
  dragging = false; pressTarget = 0;
}
canvas.addEventListener("pointerdown", onDown);
canvas.addEventListener("pointermove", onMove);
canvas.addEventListener("pointerup", onUp);
canvas.addEventListener("pointercancel", onUp);
canvas.addEventListener("pointerleave", function () { if (!dragging) touchS = 0; });

window.addEventListener("deviceorientation", function (e) {
  if (e.gamma === null || e.beta === null) return;
  if (!gBase) gBase = { g: e.gamma, b: e.beta };
  tiltX = Math.max(-1, Math.min(1, (e.gamma - gBase.g) / 30));
  tiltY = Math.max(-1, Math.min(1, (e.beta - gBase.b) / 30));
}, { passive: true });

/* =====================================================================
   Frame update
   ===================================================================== */
function update(dt) {
  const k = 1 - Math.exp(-dt * 3.6);
  for (const key in cur) cur[key] += (tgt[key] - cur[key]) * k;

  time += dt;
  flow += dt * (cur.speed + audio.level * 0.4);

  /* audio smoothing: fast attack, slower release */
  let l, b, h;
  const live = (performance.now() - ext.t) < 260;
  if (live) { l = ext.level; b = ext.bass; h = ext.high; }
  else if (ext.ever) { l = b = h = 0; }
  else { const s = simAudio(time); l = s[0]; b = s[1]; h = s[2]; }
  /* soft presence so the orb never looks frozen while Jarvis is talking */
  if (!live && effectiveState() === "speaking") { const pr = 0.10 + 0.05 * Math.sin(time * 5.1); l = Math.max(l, pr); b = Math.max(b, pr * 0.8); }
  const ak = 1 - Math.exp(-dt * (l > audio.level ? 22 : 7));
  audio.level += (l - audio.level) * ak; audio.bass += (b - audio.bass) * ak; audio.high += (h - audio.high) * ak;

  /* voice peaks emit ripples */
  if (audio.level > 0.22 && audio.level - prevLevel > 0.035 && time - lastRipple > 0.24) {
    lastRipple = time; emitRipple(Math.min(1, audio.level * 1.3));
    emitShock(0, 0, 0, Math.min(1, audio.level));
  }
  prevLevel += (audio.level - prevLevel) * Math.min(1, dt * 12);

  /* ripples + shockwave ageing */
  for (let i = 0; i < 4; i++) {
    const r = U.uRip.value[i];
    if (r.x >= 0) { r.x += dt / ripLife[i]; if (r.x >= 1) r.x = -1; }
  }
  const so = U.uShockO.value;
  if (so.w >= 0) { so.w += dt * 0.85; if (so.w >= 1) so.w = -1; }

  /* touch / press / hold */
  press += (pressTarget - press) * (1 - Math.exp(-dt * 12));
  if (dragging && !moved && performance.now() - downT > 450) hold += (1 - hold) * (1 - Math.exp(-dt * 4));
  else hold += (0 - hold) * (1 - Math.exp(-dt * 8));
  touchS *= Math.exp(-dt * (dragging ? 1.2 : 4.5));
  swipe.multiplyScalar(Math.exp(-dt * 8));
  burst *= Math.exp(-dt * 3.2);

  /* globe spin: auto-rotate + drag inertia, pitch recentres */
  yaw += dt * (0.13 + 0.11 * cur.speed) + yawVel * Math.min(dt * 20, 1) * 0.5;
  yawVel *= Math.exp(-dt * 4.2);
  if (!dragging) pitch += (ptrY * 0.10 - pitch) * Math.min(1, dt * 1.6);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch);
  /* R = Rx(pitch) * Ry(yaw), row-major */
  U.uRot.value.set(
    cy, 0, sy,
    sx * sy, cx, -sx * cy,
    -cx * sy, sx, cx * cy
  );

  /* scale / breathing */
  const idlePulse = Math.pow(Math.max(0, Math.sin(time * 0.6)), 8) * 0.10 * (1 - cur.wob);
  const s = cur.scale * (1 + 0.022 * Math.sin(time * 1.5) + audio.level * 0.07 + audio.bass * 0.05
            + burst * 0.05 - press * 0.035 - hold * 0.06 + cur.wob * 0.012 * Math.sin(time * 3.8));
  rig.scale.set(s, s, s);
  rig.rotation.y += ((tiltX * 0.08 + ptrX * 0.05) - rig.rotation.y) * Math.min(1, dt * 3);
  rig.rotation.x += ((tiltY * 0.06 - ptrY * 0.04) - rig.rotation.x) * Math.min(1, dt * 3);
  U.uScale.value = s;

  /* touch uniforms */
  U.uTouch.value.copy(touchLocal); U.uTouchS.value = touchS; U.uSwipe.value.copy(swipe);

  /* shader drivers */
  sporePhase += dt * (0.55 + cur.spore * 0.9 + audio.high * 0.7);
  U.uTime.value = flow; U.uRaw.value = time; U.uSpore.value = sporePhase;
  U.uLevel.value = audio.level; U.uBass.value = audio.bass; U.uHigh.value = audio.high;
  U.uBurst.value = burst; U.uPress.value = press; U.uHold.value = hold;
  U.uThink.value = cur.think; U.uListen.value = cur.listen; U.uSpeak.value = cur.speak;
  U.uWob.value = cur.wob + audio.level * 0.20;
  U.uBright.value = cur.bright + idlePulse;
  U.uStrength.value = (cur.glow + audio.level * 0.55 + idlePulse * 1.5 + burst * 0.25) * glowMul;
  sporeMat.uniforms.uStrength.value = (0.55 + cur.glow * 0.35) * Math.min(glowMul, 1.4);

  /* rings: slow gyroscopic tilt + comet speed from state/audio */
  const ringA = Math.min(glowMul, 1.4);
  for (let i = 0; i < 3; i++) {
    const r = rings[i], m = ringMats[i], sg = i === 1 ? -1 : 1;
    r.phase += dt * sg * (0.5 + cur.ring * 1.9 + audio.bass * 1.2 + i * 0.12);
    m.uniforms.uPhase.value = r.phase;
    m.uniforms.uAlpha.value = (0.34 + cur.ring * 0.30 + audio.level * 0.35 + (i === 2 ? audio.high * 0.30 : 0)) * ringA;
    const a = time * (0.45 + i * 0.11);
    r.mesh.rotation.set(Math.sin(a) * (0.30 + i * 0.06) + ptrY * 0.10,
                        Math.cos(a * 0.9 + i) * (0.26 + i * 0.05) + ptrX * 0.10,
                        sg * time * (0.10 + i * 0.05));
    const pulse = 1 + (cur.ring * 0.5 * (0.5 + 0.5 * Math.sin(time * 4.2)) + audio.bass * 0.85) * 0.04;
    r.mesh.scale.set(RX * r.def.sx * pulse, RY * r.def.sy * pulse, 1);
  }

  /* palette blend towards target (smooth theme changes) */
  const pk = 1 - Math.exp(-dt * 6);
  U.cDeep.value.lerp(palTarget.deep, pk); U.cMain.value.lerp(palTarget.main, pk);
  U.cHi1.value.lerp(palTarget.hi1, pk); U.cHi2.value.lerp(palTarget.hi2, pk);
}

/* =====================================================================
   Resize + adaptive quality governor
   ===================================================================== */
let level = 0, cw = 0, ch = 0;
const gov = { ema: 16.7, minEma: 1e9, frames: 0, bad: 0, good: 0, sinceChange: 0, sinceReset: 0 };

function applyQuality() {
  if (!renderer) return;
  const L = LEVELS[level];
  partGeo.setDrawRange(0, Math.floor(partGeo.userData.count * L.frac));
  resize(true);
}
function resize(force) {
  if (!renderer) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w < 2 || h < 2) return;
  if (!force && w === cw && h === ch) return;
  cw = w; ch = h;
  const dpr = Math.min(window.devicePixelRatio || 1, LEVELS[level].dpr);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  /* make the whole orb + rings + halo fit both width and height */
  const halfH = Math.max(HALO_H, HALO_W / aspect);
  camera.position.z = halfH / TAN;
  camera.updateProjectionMatrix();
  U.uCamZ.value = camera.position.z;
  U.uPx.value = h * dpr / (2 * TAN);
  /* halo quad is sized in world units, so scale it to cover exactly the visible region it was designed for */
}

function govern(ms) {
  if (ms > 250 || ms <= 0) return;                 // ignore hitches (tab switch, WebView pause)
  gov.frames++; gov.sinceChange += ms; gov.sinceReset += ms;
  gov.ema += (ms - gov.ema) * 0.06;
  if (gov.frames < 90) return;                      // warm-up (shader compile, first layout)
  if (gov.sinceReset > 10000) { gov.minEma = gov.ema; gov.sinceReset = 0; }
  gov.minEma = Math.min(gov.minEma, gov.ema);
  const base = Math.max(8, Math.min(17, gov.minEma));
  const slow = gov.ema > base * 1.5 || gov.ema > 33;
  const fast = gov.ema < base * 1.12;
  gov.bad = slow ? gov.bad + ms : 0;
  gov.good = fast ? gov.good + ms : 0;
  if (gov.bad > 1500 && level < LEVELS.length - 1) {
    level++; gov.bad = 0; gov.good = 0; gov.sinceChange = 0; gov.minEma = 1e9; applyQuality();
  } else if (gov.good > 7000 && level > startLevel && gov.sinceChange > 9000) {
    level--; gov.bad = 0; gov.good = 0; gov.sinceChange = 0; gov.minEma = 1e9; applyQuality();
  }
}

/* =====================================================================
   Boot + loop
   ===================================================================== */
let startLevel = 0, last = 0, frame = 0;

function boot() {
  if (!renderer) return;
  renderer.setClearColor(0x000000, 0);
  buildScene();
  const mem = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
  startLevel = mem >= 6 && cores >= 8 ? 0 : 1;
  const qp = parseInt(Q.get("q"), 10);
  if (!isNaN(qp)) startLevel = Math.max(0, Math.min(LEVELS.length - 1, qp));
  level = startLevel;
  setBlendMode(isLightUI);
  setAppTheme(isLightUI, PRESETS.light.a, PRESETS.light.b);
  /* start with the palette already at target so nothing flashes */
  U.cDeep.value.copy(palTarget.deep); U.cMain.value.copy(palTarget.main); U.cHi1.value.copy(palTarget.hi1); U.cHi2.value.copy(palTarget.hi2);
  applyQuality();

  canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); dead = true; }, false);
  canvas.addEventListener("webglcontextrestored", function () { location.reload(); }, false);
  window.addEventListener("resize", function () { resize(false); });
  window.addEventListener("orientationchange", function () { setTimeout(function () { resize(true); }, 200); });
  if (window.ResizeObserver) new ResizeObserver(function () { resize(false); }).observe(stage);
  document.addEventListener("visibilitychange", function () { last = 0; });
}

function checkShaders() {
  try {
    const progs = renderer.info.programs || [];
    for (let i = 0; i < progs.length; i++) {
      const d = progs[i].diagnostics;
      if (d && d.runnable === false) { useFallback("shader failed: " + (d.fragmentShader && d.fragmentShader.log || d.vertexShader && d.vertexShader.log || "unknown")); return; }
    }
  } catch (e) {}
}

function animate(now) {
  requestAnimationFrame(animate);
  if (dead || !renderer) return;
  if (!last) { last = now; return; }
  const raw = now - last; last = now;
  const dt = Math.min(raw / 1000, 0.05);
  resize(false);
  if (cw < 2) return;
  update(dt);
  renderer.render(scene, camera);
  frame++;
  if (frame === 3) checkShaders();
  govern(raw);
  if (DEBUG && frame % 20 === 0) {
    dbg.textContent = "fps " + (1000 / gov.ema).toFixed(0) + "  q" + level + "  n " + Math.floor(partGeo.userData.count * LEVELS[level].frac) +
      "  dpr " + renderer.getPixelRatio().toFixed(2) + "\nstate " + effectiveState() + "  audio " + audio.level.toFixed(2) + (ext.ever ? " (native)" : " (sim)");
  }
}

/* =====================================================================
   Public API (called from Kotlin / HomeFragment)
   ===================================================================== */
function setState(s) {
  if (!STATES[s]) return;
  const changed = s !== state;
  state = s; refreshTarget();
  if (changed && renderer && !dead) { emitRipple(0.75); emitShock(0, 0, 0, 0.7); burst = Math.max(burst, 0.30); }
}

window.JarvisOrb = {
  setState: setState,
  setWorking: function (b) { working = !!b; refreshTarget(); },
  setGlow: function (v) { const n = parseFloat(v); if (!isNaN(n)) glowMul = Math.max(0, Math.min(2, n)); },
  setExternalAudio: setExternalAudio,
  /* Preferred: exact light/dark flag + the two theme accent colours from the app */
  setAppTheme: setAppTheme,
  setTheme: setThemeByName,
  /* kept for older callers: custom colours, light/dark guessed from the first colour */
  setBackground: function (hexA, hexB) { setAppTheme(luminance(hexA) > 0.72, hexA, hexB || hexA); },
  triggerSplit: function () { burst = 1; emitRipple(1); emitShock(0, 0, 0, 1); },
  pulse: function (v) { const n = Math.max(0.1, Math.min(1, parseFloat(v) || 0.6)); burst = Math.max(burst, n * 0.4); emitRipple(n); },
  startListening: function () { setState("listening"); },
  startThinking: function () { setState("thinking"); },
  startSpeaking: function () { setState("speaking"); },
  stopSpeaking: function () { setState("idle"); },
  setQuality: function (q) { const n = parseInt(q, 10); if (!isNaN(n)) { level = startLevel = Math.max(0, Math.min(LEVELS.length - 1, n)); applyQuality(); } },
  getStats: function () { return { fps: 1000 / gov.ema, quality: level, dead: dead, state: effectiveState(), nativeAudio: ext.ever }; },
  /* the old demo morph / HUD API is intentionally inert: the orb stays an ellipse */
  setStyle: function () {}, setShape: function () {}, morphToCustom: function () {}, setAutoMorph: function () {},
  setEmbedded: function () {}, startAudioReactive: function () { return false; }, stopAudioReactive: function () {}
};

/* optional URL presets (handy for previews): ?state=listening&theme=dark */
refreshTarget();
boot();
if (Q.get("theme")) setThemeByName(Q.get("theme"));
if (Q.get("state") && STATES[Q.get("state")]) { state = Q.get("state"); refreshTarget(); Object.assign(cur, STATES[state]); }
if (Q.get("glow")) window.JarvisOrb.setGlow(Q.get("glow"));
requestAnimationFrame(animate);
})();
</script>
</body>
