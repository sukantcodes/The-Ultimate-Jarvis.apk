<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Ultra-Premium Elliptical Amoeba Particle Orb</title>
<style>
:root {
  --bg: radial-gradient(125% 90% at 50% 38%, #0d1229 0%, #060919 58%, #02030a 100%);
  --fg: #eef2ff;
  --sub: #8f9bc9;
  --glass: rgba(15, 22, 48, 0.62);
  --gb: rgba(120, 160, 255, 0.22);
  --chip: #b4c2f0;
  --t1: #00f2fe;
  --t2: #6366f1;
  --t3: #d946ef;
  --sh: rgba(0, 210, 255, 0.26);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  text-rendering: geometricPrecision;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body {
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent !important;
  color: var(--fg);
}
/* Hide all HTML panels & controls immediately so only the orb is on screen */
#hudToggle,
.hud-ui,
.hud-bottom,
#shapePanel,
#panel,
#status,
#toast,
#err,
header {
  display: none !important;
}
body.embedded {
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  justify-content: center;
}
body.embedded .hud-ui {
  display: none !important;
}
#touchParticles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}
header {
  text-align: center;
  padding-top: clamp(10px, 2.2vh, 24px);
  flex: none;
  z-index: 10;
  pointer-events: none;
}
h1 {
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 800;
  letter-spacing: 0.28em;
  padding-left: 0.28em;
  background: linear-gradient(90deg, var(--t1), var(--t2) 55%, var(--t3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-transform: uppercase;
}
header p {
  margin-top: 4px;
  font-size: clamp(11px, 1.5vh, 13.5px);
  color: var(--sub);
  letter-spacing: 0.06em;
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  height: 100%;
}
#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
#shadow {
  position: absolute;
  left: 50%;
  height: 26px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--sh), transparent);
  filter: blur(6px);
  animation: floatShadow 5s ease-in-out infinite;
  pointer-events: none;
  transition: width 0.3s ease, opacity 0.3s ease;
}
@keyframes floatShadow {
  50% { opacity: 0.55; transform: translateX(-50%) scaleX(0.88); }
}
.hud-bottom {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 820px;
  padding-bottom: clamp(10px, 2vh, 20px);
  z-index: 10;
}
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 18px;
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 0 0 1px var(--gb);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--fg);
}
#dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--t1);
  box-shadow: 0 0 10px var(--t1);
  animation: ping 1.6s infinite;
}
@keyframes ping {
  70% { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.panel {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 6px 8px;
  border-radius: 18px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28), inset 0 0 0 1px var(--gb);
  max-width: 100%;
}
.panel-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--sub);
  padding: 0 6px;
  text-transform: uppercase;
}
button {
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  border: 0;
  border-radius: 11px;
  padding: 7px 11px;
  color: var(--chip);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  white-space: nowrap;
}
button:hover {
  color: var(--fg);
  background: rgba(255, 255, 255, 0.08);
}
button.on {
  color: #fff;
  background: linear-gradient(135deg, var(--t1), var(--t2));
  box-shadow: 0 4px 14px rgba(0, 210, 255, 0.32);
}
button.action-btn {
  border: 1px solid var(--gb);
  background: rgba(255, 255, 255, 0.05);
}
#bgc {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: none;
  cursor: pointer;
  overflow: hidden;
}
#bgc::-webkit-color-swatch-wrapper { padding: 0; }
#bgc::-webkit-color-swatch { border: 2px solid var(--gb); border-radius: 50%; }
#hudToggle {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 20;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 0 0 1px var(--gb);
  color: var(--chip);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
#toast {
  position: fixed;
  left: 50%;
  top: 72px;
  transform: translate(-50%, -12px);
  opacity: 0;
  background: rgba(12, 18, 42, 0.9);
  border: 1px solid var(--gb);
  color: #fff;
  font-size: 12.5px;
  padding: 9px 16px;
  border-radius: 12px;
  transition: all 0.3s;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
  z-index: 100;
  backdrop-filter: blur(10px);
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
#err {
  display: none;
  padding: 20px;
  color: #ff6b8b;
  text-align: center;
}
</style>
</head>
<body class="embedded">
<canvas id="touchParticles" aria-hidden="true"></canvas>
<button id="hudToggle" title="Toggle Clean Embedded View">HUD: ON</button>

<header class="hud-ui">
  <h1>JARVIS AMOEBA ORB</h1>
  <p>Touch or slice the elliptical orb to split it into living lobes &bull; Morphs into any 3D shape</p>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="shadow"></div>
</div>

<div class="hud-bottom hud-ui">
  <div id="status" class="status-bar">
    <span id="dot"></span>
    <span id="stext">AMOEBA READY</span>
    <span style="opacity:0.45">|</span>
    <span id="shapeLabel" style="color:var(--t1)">ELLIPTICAL AMOEBA</span>

  <!-- Shape Morphing Controls -->
  <div class="panel" id="shapePanel">
    <span class="panel-label">Morph</span>
    <button data-shape="amoeba" class="on">Elliptical Amoeba</button>
    <button data-shape="helix">DNA Helix</button>
    <button data-shape="torus">Plasma Torus</button>
    <button data-shape="hypercube">Hypercube</button>
    <button data-shape="infinity">Infinity</button>
    <button data-shape="galaxy">Spiral Galaxy</button>

  <!-- State, Split & Theme Controls -->

    <span class="panel-label">State</span>

    <button data-t="bio">Bio-Lum</button>

    <button data-t="sunset">Solar</button>
    <button data-t="light">Light</button>

  </div>
</div>

<div id="toast"></div>
<div id="err">WebGL is required to view the JARVIS Particle Orb.</div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";

const isEmbedded = true;
if (isEmbedded) {
  document.body.classList.add("embedded");
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
}

/* ============================================================================
   JARVIS NANOTECH PARTICLE ENGINE (REALISTIC 3D MORPHING + WELCOME / DONE TEXT)
   - Startup Sequence: All 45,000 particles assemble into a 3D volumetric
     "WELCOME" hologram on first open, then flow into the Elliptical Amoeba.
   - Task / Speech Completion: Automatically forms "DONE" in 3D volumetric
     particles whenever work finishes (setWorking(false)) or Jarvis finishes
     answering (stopSpeaking() / speaking -> idle), or via JarvisOrb.showDone().
   - Realistic 3D Shape Transformations: True triangle-surface & volume sampling
     with 3D surface normals for realistic directional & rim lighting across:
     1) Elliptical Living Amoeba
     2) 3D Jarvis AI Cyber-Face Bust
     3) 3D Saturn & Cassini Rings
     4) 3D Beating Cyber-Heart
     5) 3D Arc Reactor Core
     6) 3D Molecular DNA Helix
     7) 3D Temporal Hourglass
     8) 3D Sacred Star-Octahedron
   - Touch Fission: Touching/dragging splits the amoeba into 5 living sub-orbs
     that orbit and later coalesce back together.
   ============================================================================ */
const FOV = 45, VIS = 3.55, COUNT = 45000, MAX_BLOBS = 5;
const ARC_CHAINS = 16, ARC_SEGS = 20;

const STATES = {
  idle:      { scale: 1.00, speed: 0.52, cyan: 0.76, purple: 0.72, bright: 1.10, glow: 0.62, ring: 0.38, wob: 0.20, amoebaAmp: 1.15 },
  listening: { scale: 1.07, speed: 1.18, cyan: 1.00, purple: 0.52, bright: 1.22, glow: 0.92, ring: 0.78, wob: 0.45, amoebaAmp: 1.48 },
  thinking:  { scale: 1.03, speed: 1.95, cyan: 0.58, purple: 1.00, bright: 1.18, glow: 0.88, ring: 1.15, wob: 1.05, amoebaAmp: 1.78 },
  speaking:  { scale: 1.09, speed: 1.50, cyan: 0.96, purple: 0.96, bright: 1.28, glow: 1.02, ring: 0.90, wob: 0.58, amoebaAmp: 1.62 }
};

const LABELS = {
  idle: "AMOEBA READY",
  listening: "LISTENING...",
  thinking: "SYNTHESIZING...",
  speaking: "SPEAKING"
};

const SHAPE_NAMES = [
  "amoeba", "helix", "torus", "hypercube",
  "infinity", "galaxy", "merkaba", "vortex"
];

const SHAPE_LABELS = {
  amoeba: "ELLIPTICAL AMOEBA",
  vortex: "3D JARVIS AI BUST",
  galaxy: "3D SATURN PLANET",
  infinity: "3D BEATING HEART",
  torus: "3D ARC REACTOR",
  helix: "3D DNA MOLECULE",
  hypercube: "3D HOURGLASS",
  merkaba: "3D STAR CORE",
  welcome: "WELCOME",
  done: "DONE",
  custom: "CUSTOM 3D SHAPE"
};

const $ = s => document.querySelector(s);
const stage = $("#stage"), canvas = $("#c"), shadowEl = $("#shadow");

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
  });
} catch (e) {
  $("#err").style.display = "block";
  stage.style.display = "none";
  return;
}
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 60);
camera.position.set(0, 0, 6.4);

/* ---------- 5-Node Amoeba Fission & Recombination Physics ---------- */
const blobCenters = [];
for (let i = 0; i < MAX_BLOBS; i++) blobCenters.push(new THREE.Vector3(0, 0, 0));

const blobs = [];
for (let i = 0; i < MAX_BLOBS; i++) {
  blobs.push({
    pos: new THREE.Vector3(0, 0, 0),
    vel: new THREE.Vector3(0, 0, 0),
    targetOffset: new THREE.Vector3(0, 0, 0),
    orbitAngle: (i * Math.PI * 2) / MAX_BLOBS,
    phase: i * 1.2566
  });
}

let splitAmount = 0;
let splitTimer = 0;
let activeLobes = 5;
let touchWorld = new THREE.Vector3(0, 0, 0);
let swipeVelWorld = new THREE.Vector3(0, 0, 0);
let touchStrength = 0;
let shockOrigin = new THREE.Vector3(0, 0, 0);
let shockWave = 10.0;
let fusionFlash = 0.0;
let wasSplit = false;

/* ---------- Shared Shader Uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uRawTime: { value: 0 },
  uAmp: { value: 0 },
  uBass: { value: 0 },
  uHigh: { value: 0 },
  uCyan: { value: 0.76 },
  uPurple: { value: 0.72 },
  uBright: { value: 1.10 },
  uPx: { value: 300 },
  uCamZ: { value: 6.4 },
  uAmoeba: { value: 0.05 }, /* Starts low during WELCOME message, then ramps up for Amoeba */
  uIsText: { value: 1.0 },  /* 1.0 when showing WELCOME / DONE so letters are razor-sharp */
  uHeartBeat: { value: 0.0 },
  uMorph: { value: 0.0 },
  uSplit: { value: 0.0 },
  uTouchPos: { value: new THREE.Vector3(0, 0, 0) },
  uSwipeVel: { value: new THREE.Vector3(0, 0, 0) },
  uTouchStrength: { value: 0.0 },
  uShockOrigin: { value: new THREE.Vector3(0, 0, 0) },
  uShockWave: { value: 10.0 },
  uFusionFlash: { value: 0.0 },
  uBlobs: { value: blobCenters },
  DEEP: { value: new THREE.Color() },
  BLUE: { value: new THREE.Color() },
  CYAN: { value: new THREE.Color() },
  PURP: { value: new THREE.Color() }
};

const orb = new THREE.Group();
scene.add(orb);

/* ---------- 1. Realistic 3D Surface & Volume Sampler + 3D Text Rasterizer ----------
   Generates both 3D positions AND 3D surface normals (`normals`) so every 3D object
   (Bust, Saturn, Heart, Arc Reactor, DNA, Hourglass, Amoeba, WELCOME, DONE) has
   realistic 3D directional lighting, specular highlights, and volumetric depth! */

function computeNormal(x, y, z) {
  const l = Math.sqrt(x * x + y * y + z * z) || 1;
  return [x / l, y / l, z / l];
}

/* Rasterizes any text string (+ optional subtitle/icon) onto a high-res canvas and
   extrudes it into a realistic 3D volumetric particle sculpture with bevel normals! */
function generate3DTextSculpture(mainText, subText, withCheckmark) {
  const pos = new Float32Array(COUNT * 3);
  const norm = new Float32Array(COUNT * 3);

  const cw = 720, ch = 320;
  const offCanvas = document.createElement("canvas");
  offCanvas.width = cw;
  offCanvas.height = ch;
  const ctx = offCanvas.getContext("2d");

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (withCheckmark) {
    /* Draw a bold 3D checkmark emblem above "DONE" */
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cw * 0.43, 72);
    ctx.lineTo(cw * 0.485, 114);
    ctx.lineTo(cw * 0.58, 42);
    ctx.stroke();

    ctx.font = "900 108px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, 205);
  } else if (subText) {
    ctx.font = "900 96px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, 132);
    ctx.font = "700 34px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(subText, cw / 2, 232);
  } else {
    const fontSize = mainText.length > 8 ? 82 : 112;
    ctx.font = "900 " + fontSize + "px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, ch / 2);
  }

  const imgData = ctx.getImageData(0, 0, cw, ch).data;
  const pixels = [];
  /* Collect all active pixels along with edge gradient for 3D bevel normals */
  for (let y = 1; y < ch - 1; y += 1) {
    for (let x = 1; x < cw - 1; x += 1) {
      const idx = (y * cw + x) * 4 + 3;
      const a = imgData[idx];
      if (a > 90) {
        const ax1 = imgData[(y * cw + (x + 1)) * 4 + 3];
        const ax0 = imgData[(y * cw + (x - 1)) * 4 + 3];
        const ay1 = imgData[((y + 1) * cw + x) * 4 + 3];
        const ay0 = imgData[((y - 1) * cw + x) * 4 + 3];
        const gx = (ax0 - ax1) / 255;
        const gy = (ay1 - ay0) / 255;
        const isEdge = Math.abs(gx) + Math.abs(gy) > 0.1;
        pixels.push({ x, y, gx, gy, isEdge });
      }
    }
  }

  const pLen = pixels.length || 1;
  const textParticles = Math.floor(COUNT * 0.88); /* 88% in crisp 3D letters, 12% in holographic frame/aura */

  for (let i = 0; i < COUNT; i++) {
    if (i < textParticles && pixels.length > 0) {
      /* Deterministic stratified sampling across all letter pixels */
      const pIdx = Math.floor((i / textParticles) * pLen + ((i * 0.6180339) % 1) * 3) % pLen;
      const px = pixels[pIdx];
      const wx = ((px.x - cw / 2) / (cw * 0.5)) * 1.92 + (Math.random() - 0.5) * 0.008;
      const wy = -((px.y - ch / 2) / (cw * 0.5)) * 1.92 + (Math.random() - 0.5) * 0.008;
      /* 3D Extruded letter thickness with dense front/back faces and beveled side walls */
      const depthLayer = ((i * 0.381966) % 1) * 2 - 1;
      const wz = depthLayer * (px.isEdge ? 0.14 : 0.09);

      pos[i * 3]     = wx;
      pos[i * 3 + 1] = wy;
      pos[i * 3 + 2] = wz;

      const nz = depthLayer >= 0 ? 0.85 : -0.85;
      const n = computeNormal(px.gx * 1.8, px.gy * 1.8, nz);
      norm[i * 3]     = n[0];
      norm[i * 3 + 1] = n[1];
      norm[i * 3 + 2] = n[2];
    } else {
      /* Sleek elliptical holographic frame ring surrounding the 3D message */
      const ang = (i / (COUNT - textParticles)) * Math.PI * 2;
      const rRing = 1.0 + ((i % 7) - 3) * 0.012;
      const rx = Math.cos(ang) * 1.98 * rRing;
      const ry = Math.sin(ang) * 0.92 * rRing;
      const rz = Math.sin(ang * 4.0) * 0.08;
      pos[i * 3]     = rx;
      pos[i * 3 + 1] = ry;
      pos[i * 3 + 2] = rz;
      const n = computeNormal(rx, ry, 0.5);
      norm[i * 3]     = n[0];
      norm[i * 3 + 1] = n[1];
      norm[i * 3 + 2] = n[2];
    }
  }
  return { pos, norm };
}

/* Generates realistic 3D geometries with accurate 3D surface normals */
function generateRealistic3DShape(shapeName, customFn) {
  if (shapeName === "welcome") {
    return generate3DTextSculpture("WELCOME", "J . A . R . V . I . S", false);
  }
  if (shapeName === "done") {
    return generate3DTextSculpture("DONE", null, true);
  }

  const pos = new Float32Array(COUNT * 3);
  const norm = new Float32Array(COUNT * 3);
  const golden = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < COUNT; i++) {
    const frac = (i + 0.5) / COUNT;
    const yNorm = 1 - 2 * frac;
    const rSphere = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
    const theta = i * golden;

    const layerSeed = (i * 0.6180339887) % 1;
    const shell = layerSeed < 0.15
      ? 0.25 + 0.40 * (layerSeed / 0.15)
      : layerSeed < 0.45
        ? 0.68 + 0.22 * ((layerSeed - 0.15) / 0.30)
        : 0.91 + 0.09 * ((layerSeed - 0.45) / 0.55);

    const ux = Math.cos(theta) * rSphere;
    const uy = yNorm;
    const uz = Math.sin(theta) * rSphere;

    let x = 0, y = 0, z = 0, nx = ux, ny = uy, nz = uz;

    if (typeof customFn === "function") {
      const res = customFn(frac, (theta % (Math.PI * 2)) / (Math.PI * 2), i, COUNT, shell);
      if (res && res.length >= 3) {
        x = res[0]; y = res[1]; z = res[2];
        const n = computeNormal(x, y, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "amoeba") {
      /* 1. Realistic Tri-Axial Elliptical Amoeba with Organic Pseudopod Arms & Nucleus */
      const lobe = 1.0
        + 0.18 * Math.sin(ux * 3.0 + uy * 2.2) * Math.cos(uz * 2.5)
        + 0.12 * Math.cos(uy * 4.2 - uz * 3.2 + ux * 1.6);
      x = ux * 1.44 * shell * lobe;
      y = uy * 0.92 * shell * lobe;
      z = uz * 1.08 * shell * lobe;
      const n = computeNormal(ux / 1.44, uy / 0.92, uz / 1.08);
      nx = n[0]; ny = n[1]; nz = n[2];
    } else if (shapeName === "vortex") {
      /* 2. Realistic 3D Sculpted Humanoid AI Cyber-Bust (Head, Facial Contours, Neck & Shoulders) */
      if (frac < 0.68) {
        /* Sculpted 3D Head & Face */
        const fFrac = frac / 0.68;
        const fy = 1 - 2 * fFrac;
        const fr = Math.sqrt(Math.max(0, 1 - fy * fy));
        const fTheta = i * golden;
        let hx = Math.cos(fTheta) * fr;
        let hy = fy;
        let hz = Math.sin(fTheta) * fr;

        /* Cranium & Jawline taper */
        const jawTaper = hy < 0 ? (1.0 + hy * 0.28) : (1.0 - hy * 0.06);
        hx *= 0.66 * jawTaper;
        hy *= 0.86;
        hz *= 0.74;

        /* Sculpt 3D facial features on the front face (hz > 0) */
        if (hz > 0.15) {
          /* Brow ridge */
          const brow = Math.exp(-Math.pow((hy - 0.18) * 6.5, 2.0)) * Math.exp(-Math.pow(hx * 2.2, 2.0)) * 0.11;
          /* Eye sockets */
          const eyeL = Math.exp(-Math.pow((hx + 0.22) * 7.5, 2.0) - Math.pow((hy - 0.08) * 9.0, 2.0)) * 0.12;
          const eyeR = Math.exp(-Math.pow((hx - 0.22) * 7.5, 2.0) - Math.pow((hy - 0.08) * 9.0, 2.0)) * 0.12;
          /* Nose bridge & tip */
          const nose = Math.exp(-Math.pow(hx * 9.5, 2.0)) * Math.exp(-Math.pow((hy + 0.06) * 4.2, 2.0)) * (0.18 - hy * 0.08);
          /* Cheekbones & Lips */
          const cheeks = Math.exp(-Math.pow((Math.abs(hx) - 0.30) * 5.0, 2.0) - Math.pow((hy + 0.10) * 5.0, 2.0)) * 0.08;
          const lips = Math.exp(-Math.pow(hx * 5.5, 2.0) - Math.pow((hy + 0.34) * 11.0, 2.0)) * 0.09;
          /* Chin */
          const chin = Math.exp(-Math.pow(hx * 4.5, 2.0) - Math.pow((hy + 0.62) * 6.0, 2.0)) * 0.10;

          hz += brow - eyeL - eyeR + nose + cheeks + lips + chin;
        }
        const sHead = 0.92 + 0.08 * shell;
        x = hx * sHead;
        y = hy * sHead + 0.26;
        z = hz * sHead;
        const n = computeNormal(hx, hy, hz);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else if (frac < 0.80) {
        /* Anatomical Neck Cylinder */
        const nFrac = (frac - 0.68) / 0.12;
        const ang = i * golden;
        const rad = (0.31 + 0.04 * (1 - nFrac)) * (0.85 + 0.15 * shell);
        x = Math.cos(ang) * rad;
        y = -0.45 - nFrac * 0.32;
        z = Math.sin(ang) * rad * 0.88 - 0.04;
        const n = computeNormal(x, 0.1, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        /* Sculpted Collarbone & Upper Shoulders Bust */
        const sFrac = (frac - 0.80) / 0.20;
        const uS = (sFrac - 0.5) * 2.0;
        const vS = ((i * 0.6180339) % 1) * Math.PI * 2;
        const width = 1.38;
        const depth = 0.42 * (1 - Math.abs(uS) * 0.45);
        x = uS * width;
        y = -0.78 - Math.pow(uS, 2.0) * 0.22 + Math.sin(vS) * 0.16 * shell;
        z = Math.cos(vS) * depth * shell;
        const n = computeNormal(uS * 0.3, Math.sin(vS), Math.cos(vS));
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "galaxy") {
      /* 3. Realistic 3D Saturn Planet with Tilted Cassini Rings & Orbiting Moons */
      const tiltX = 0.42, tiltZ = 0.22;
      const cx = Math.cos(tiltX), sx = Math.sin(tiltX);
      const cz = Math.cos(tiltZ), sz = Math.sin(tiltZ);
      let px = 0, py = 0, pz = 0, pnx = 0, pny = 1, pnz = 0;

      if (frac < 0.42) {
        /* Oblate banded gas-giant globe */
        const pFrac = frac / 0.42;
        const lat = 1 - 2 * pFrac;
        const rLat = Math.sqrt(Math.max(0, 1 - lat * lat));
        const lon = i * golden;
        const band = 1.0 + 0.025 * Math.cos(lat * 18.0);
        const rad = 0.64 * (0.82 + 0.18 * shell) * band;
        px = Math.cos(lon) * rLat * rad;
        py = lat * rad * 0.88;
        pz = Math.sin(lon) * rLat * rad;
        const n = computeNormal(px, py / 0.88, pz);
        pnx = n[0]; pny = n[1]; pnz = n[2];
      } else {
        /* Multi-band planetary rings with authentic Cassini gap */
        const rFrac = (frac - 0.42) / 0.58;
        const ang = i * golden;
        let ringR = 0.84 + rFrac * 0.96;
        /* Carve out the Cassini Division gap between r=1.32 and r=1.40 */
        if (ringR > 1.31 && ringR < 1.39) {
          ringR = ringR < 1.35 ? 1.29 : 1.41;
        }
        px = Math.cos(ang) * ringR;
        py = ((i % 9) - 4) * 0.0045 * shell;
        pz = Math.sin(ang) * ringR;
        pnx = Math.cos(ang) * 0.2; pny = py >= 0 ? 0.98 : -0.98; pnz = Math.sin(ang) * 0.2;
      }
      /* Apply 3D planetary axial tilt */
      const y1 = py * cx - pz * sx;
      const z1 = py * sx + pz * cx;
      x = px * cz - y1 * sz;
      y = px * sz + y1 * cz;
      z = z1;

      const ny1 = pny * cx - pnz * sx;
      const nz1 = pny * sx + pnz * cx;
      nx = pnx * cz - ny1 * sz;
      ny = pnx * sz + ny1 * cz;
      nz = nz1;
    } else if (shapeName === "infinity") {
      /* 4. Realistic 3D Volumetric Beating Heart Sculpture */
      const u = frac * Math.PI;
      const v = i * golden;
      const sinU = Math.sin(u), cosU = Math.cos(u);
      const sinV = Math.sin(v), cosV = Math.cos(v);
      const sH = 0.078 * (0.72 + 0.28 * shell);
      /* 3D Parametric Anatomical Heart Surface */
      const hx = 16.0 * Math.pow(sinU, 3.0) * cosV;
      const hy = 13.0 * cosU - 5.0 * Math.cos(2.0 * u) - 2.0 * Math.cos(3.0 * u) - Math.cos(4.0 * u);
      const hz = 10.0 * Math.pow(sinU, 3.0) * sinV;
      x = hx * sH * 1.08;
      y = (hy * sH) + 0.12;
      z = hz * sH * 0.95;
      const n = computeNormal(x, y - 0.12, z * 1.4);
      nx = n[0]; ny = n[1]; nz = n[2];
    } else if (shapeName === "torus") {
      /* 5. Realistic 3D Mechanical Arc Reactor Mark-X (Core + 10 Segmented Coils + Outer Chassis) */
      if (frac < 0.20) {
        /* Central glowing emitter lens */
        const rFrac = Math.sqrt(frac / 0.20) * 0.42;
        const ang = i * golden;
        x = Math.cos(ang) * rFrac;
        y = Math.sin(ang) * rFrac;
        z = (shell - 0.5) * 0.22 + 0.08 * Math.cos(rFrac * 6.0);
        const n = computeNormal(x * 0.4, y * 0.4, 1.0);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        const u = ((i * 0.6180339) % 1) * Math.PI * 2;
        const v = frac * Math.PI * 2;
        /* 10 distinct palladium coil housings around the torus ring */
        const isCoilGap = Math.sin(v * 10.0) > 0.72;
        const R = 1.02;
        const r = (isCoilGap ? 0.24 : 0.34) * (0.75 + 0.25 * shell);
        x = (R + r * Math.cos(u)) * Math.cos(v);
        y = (R + r * Math.cos(u)) * Math.sin(v);
        z = r * Math.sin(u) * 0.85;
        const n = computeNormal(Math.cos(u) * Math.cos(v), Math.cos(u) * Math.sin(v), Math.sin(u));
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "helix") {
      /* 6. Realistic 3D Molecular DNA Double Helix (2 Sugar-Phosphate Tubes + Base-Pair Spheres) */
      const mode = i % 3;
      const t = (frac - 0.5) * 3.1;
      const ang = frac * Math.PI * 6.5;
      const tubeR = 0.13 * shell;
      if (mode < 2) {
        const phase = mode * Math.PI;
        const bx = Math.cos(ang + phase) * 0.82;
        const by = t * 0.94;
        const bz = Math.sin(ang + phase) * 0.82;
        x = bx + ux * tubeR;
        y = by + uy * tubeR;
        z = bz + uz * tubeR;
        const n = computeNormal(ux, uy, uz);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        /* 22 Discrete Base-Pair Rungs with central hydrogen-bond nodes */
        const rungIdx = (Math.floor(frac * 22) + 0.5) / 22;
        const rAng = rungIdx * Math.PI * 6.5;
        const rT = (rungIdx - 0.5) * 3.1;
        const bridge = ((i * 0.37) % 1) * 2 - 1;
        const atomBulge = 0.055 * (1 + 0.6 * Math.cos(bridge * Math.PI * 3));
        x = Math.cos(rAng) * 0.80 * bridge + ux * atomBulge;
        y = rT * 0.94 + uy * atomBulge;
        z = Math.sin(rAng) * 0.80 * bridge + uz * atomBulge;
        const n = computeNormal(ux, uy, uz);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "hypercube") {
      /* 7. Realistic 3D Temporal Hourglass (Upper/Lower Glass Bulbs + End Caps + Falling Sand Stream) */
      if (frac < 0.72) {
        /* Hyperbolic Hourglass Glass Bulbs */
        const hFrac = (frac / 0.72) * 2 - 1; /* -1 to +1 */
        const ang = i * golden;
        const profileR = (0.12 + 0.78 * Math.pow(Math.abs(hFrac), 0.85)) * (1.0 - 0.18 * Math.pow(hFrac, 4.0));
        const r = profileR * (0.92 + 0.08 * shell);
        x = Math.cos(ang) * r;
        y = hFrac * 1.12;
        z = Math.sin(ang) * r;
        const n = computeNormal(Math.cos(ang), -hFrac * 0.5, Math.sin(ang));
        nx = n[0]; ny = n[1]; nz = n[2];
      } else if (frac < 0.88) {
        /* Top & Bottom Hexagonal Pedestal Caps */
        const capSide = (i % 2 === 0) ? 1 : -1;
        const cFrac = (frac - 0.72) / 0.16;
        const ang = i * golden;
        const r = Math.sqrt(cFrac) * 0.88;
        x = Math.cos(ang) * r;
        y = capSide * (1.12 + (shell - 0.5) * 0.06);
        z = Math.sin(ang) * r;
        nx = 0; ny = capSide; nz = 0;
      } else {
        /* Central Falling Sand Stream & Bottom Sand Cone */
        const sFrac = (frac - 0.88) / 0.12;
        const ang = i * golden;
        if (sFrac < 0.45) {
          /* Narrow falling sand stream through the neck */
          const fallY = 0.25 - (sFrac / 0.45) * 1.25;
          const r = 0.045 * shell;
          x = Math.cos(ang) * r;
          y = fallY;
          z = Math.sin(ang) * r;
        } else {
          /* Accumulated sand mound at bottom */
          const mFrac = (sFrac - 0.45) / 0.55;
          const r = mFrac * 0.68 * shell;
          x = Math.cos(ang) * r;
          y = -1.08 + (1 - mFrac) * 0.34 * shell;
          z = Math.sin(ang) * r;
        }
        const n = computeNormal(x, 0.5, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "merkaba") {
      /* 8. Realistic 3D Sacred Star-Octahedron with Sharp Facet Normals */
      const tet = i % 2 === 0 ? 1 : -1;
      const p1 = Math.abs(ux + uy + uz);
      const p2 = Math.abs(-ux - uy + uz);
      const p3 = Math.abs(-ux + uy - uz);
      const p4 = Math.abs(ux - uy - uz);
      const d = Math.max(p1, p2, p3, p4, 0.001);
      const r = (1.32 / Math.pow(d, 0.75)) * (0.85 + 0.15 * shell);
      x = ux * r * 1.12;
      y = uy * r * tet * 0.96;
      z = uz * r;
      const n = computeNormal(ux, uy * tet, uz);
      nx = n[0]; ny = n[1]; nz = n[2];
    }

    pos[i * 3]     = x;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = z;
    norm[i * 3]     = nx;
    norm[i * 3 + 1] = ny;
    norm[i * 3 + 2] = nz;
  }
  return { pos, norm };
}

/* Precompute all 3D shapes + WELCOME + DONE for instant zero-lag transformations */
const shapeCache = {};
[...SHAPE_NAMES, "welcome", "done"].forEach(name => {
  shapeCache[name] = generateRealistic3DShape(name);
});

let currentShape = "welcome";
let morphActive = false;
let morphProgress = 0;
let autoMorph = true;
let autoMorphTimer = 0;
let messageHoldTimer = 3.6; /* Hold initial WELCOME message for 3.6s on first open! */

/* ---------- 2. Realistic 3D Lit & Shaded Particle Shader ---------- */
const partV = `
uniform float uTime, uRawTime, uAmp, uBass, uHigh, uCyan, uPurple, uBright, uPx, uCamZ;
uniform float uAmoeba, uIsText, uHeartBeat, uMorph, uSplit, uTouchStrength, uShockWave, uFusionFlash;
uniform vec3 uTouchPos, uSwipeVel, uShockOrigin;
uniform vec3 uBlobs[5];
uniform vec3 DEEP, BLUE, CYAN, PURP;

attribute vec3 aTarget;
attribute vec3 aNormal;
attribute vec3 aTargetNormal;
attribute float aRnd;
attribute float aLayer;
attribute float aCluster;

varying vec3 vC;
varying vec3 vDeep;
varying float vA;
varying float vSpec;

float gyroidWave(vec3 p, float t) {
  vec3 q = p * 2.5 + vec3(t * 1.15, -t * 0.9, t * 0.75);
  float g1 = dot(sin(q), cos(q.yzx));
  float g2 = sin(p.x * 6.0 + t * 2.0) * cos(p.y * 6.0 - t * 1.6) * sin(p.z * 6.0 + t * 1.4);
  return g1 * 0.35 + g2 * 0.15;
}

vec3 fluidCurl(vec3 p, float t, float seed) {
  float sx = sin(p.y * 3.8 + t * 1.5 + seed * 6.28) * cos(p.z * 3.3 - t * 1.1);
  float sy = sin(p.z * 4.0 - t * 1.3 + seed * 6.28) * cos(p.x * 3.6 + t * 1.2);
  float sz = sin(p.x * 3.5 + t * 1.6 + seed * 6.28) * cos(p.y * 4.1 - t * 1.4);
  return vec3(sx, sy, sz);
}

void main() {
  /* Realistic Nanotech Swarm Assembly Morph:
     Particles sweep along a 3D turbulent arc from bottom-to-top / core-to-shell
     and snap crisply into the target 3D sculpture! */
  float arrivalOrder = clamp(0.5 + 0.35 * aTarget.y + 0.15 * aRnd, 0.0, 1.0);
  float stagger = clamp((uMorph * 1.42) - arrivalOrder * 0.42, 0.0, 1.0);
  float m = stagger * stagger * (3.0 - 2.0 * stagger);

  vec3 basePos = mix(position, aTarget, m);
  vec3 baseNorm = normalize(mix(aNormal, aTargetNormal, m) + vec3(0.0001));

  /* Mid-flight nanotech swarm dispersion & spiral arc */
  float flightArc = sin(m * 3.14159265);
  vec3 swarmOffset = fluidCurl(basePos * 1.4, uRawTime * 2.2, aRnd) * (flightArc * 0.38);
  float swirlAng = flightArc * (0.95 + aRnd * 0.85);
  float ca = cos(swirlAng), sa = sin(swirlAng);
  basePos.xz = mat2(ca, -sa, sa, ca) * basePos.xz;
  basePos += swarmOffset;

  float len = max(length(basePos), 0.0001);
  vec3 dir = basePos / len;
  float t = uTime;

  /* Organic Amoeba Undulation (automatically suppressed when displaying 3D WELCOME / DONE text
     or crisp 3D sculptures so the 3D shapes and letters remain 100% sharp and legible!) */
  float wave = gyroidWave(dir * 1.3 + basePos * 0.3, t);
  float pseudopod = gyroidWave(dir * 0.85, t * 0.75 + aRnd * 1.8);
  vec3 curl = fluidCurl(dir * 1.2, t, aRnd);

  /* Realistic Lub-Dub Heartbeat when in 3D Heart mode, or gentle breathing otherwise */
  float beat = 1.0
    + uHeartBeat * 0.11 * (pow(max(0.0, sin(uRawTime * 5.5)), 6.0) + 0.45 * pow(max(0.0, sin(uRawTime * 5.5 - 0.65)), 8.0))
    + (1.0 - uIsText) * 0.045 * sin(uRawTime * 1.8 + dir.x * 1.6)
    + uFusionFlash * 0.18 * cos(dir.x * 5.0 + dir.y * 5.0);

  float shellDisplace = (wave * 0.26 + pseudopod * 0.18) * uAmoeba * (0.38 + 0.72 * aLayer);
  float audioDisplace = (1.0 - uIsText * 0.72) * (
    uAmp * (0.16 + 0.20 * aRnd)
    + uBass * 0.14 * sin(dir.y * 5.5 + t * 3.8)
    + uHigh * 0.08 * cos(dir.x * 10.0 - uRawTime * 7.0)
  );

  /* Subtle living shimmer on 3D Text ("WELCOME" / "DONE") so letters sparkle without blurring */
  vec3 textShimmer = vec3(
    sin(uRawTime * 3.0 + aRnd * 12.0) * 0.008,
    cos(uRawTime * 2.6 + aTarget.x * 4.0) * 0.010,
    sin(uRawTime * 3.5 + aTarget.x * 3.0) * 0.018
  ) * uIsText;

  vec3 pos = basePos * (beat + shellDisplace + audioDisplace)
    + curl * (0.06 * uAmoeba + 0.04 * uHigh * (1.0 - uIsText))
    + textShimmer;

  /* 5-Node Amoeba Fission (Touching splits the orb into 5 living sub-orbs & later joins) */
  int cIdx = int(clamp(aCluster, 0.0, 4.0));
  vec3 blobOffset = vec3(0.0);
  if (cIdx == 0) blobOffset = uBlobs[0];
  else if (cIdx == 1) blobOffset = uBlobs[1];
  else if (cIdx == 2) blobOffset = uBlobs[2];
  else if (cIdx == 3) blobOffset = uBlobs[3];
  else blobOffset = uBlobs[4];

  if (uSplit > 0.001) {
    float isStreamBridge = step(0.84, aRnd);
    float subScale = mix(1.0, 0.45, uSplit * (1.0 - isStreamBridge * 0.65));
    vec3 localSpin = fluidCurl(dir * 2.0, uRawTime * 3.5 + aCluster * 2.4, aRnd) * (0.14 * uSplit);

    float packetT = fract(uRawTime * (0.8 + aRnd * 0.85) + aRnd * 11.0);
    int nextIdx = int(mod(aCluster + 1.0, 5.0));
    vec3 nextBlob = uBlobs[0];
    if (nextIdx == 1) nextBlob = uBlobs[1];
    else if (nextIdx == 2) nextBlob = uBlobs[2];
    else if (nextIdx == 3) nextBlob = uBlobs[3];
    else if (nextIdx == 4) nextBlob = uBlobs[4];

    vec3 bridgePos = mix(blobOffset, nextBlob, packetT)
      + vec3(0.0, sin(packetT * 3.14159) * 0.20 * sin(uRawTime * 4.0 + aRnd * 10.0), 0.0);

    vec3 finalOffset = mix(blobOffset, bridgePos, isStreamBridge);
    pos = pos * subScale + finalOffset + localSpin;
  }

  /* 3D Shockwave Ripple on Touch / Voice Peak */
  float shockHighlight = 0.0;
  if (uShockWave < 4.2) {
    float distShock = length(pos - uShockOrigin);
    float ringDist = distShock - uShockWave;
    float waveEnv = exp(-ringDist * ringDist * 16.0) * (1.0 - uShockWave / 4.2);
    shockHighlight = waveEnv;
    pos += normalize(pos - uShockOrigin + vec3(0.0001)) * (waveEnv * sin(ringDist * 20.0) * 0.28);
  }

  /* Touch Cleavage, Vortex Swirl & Finger Drag */
  float touchEnergy = 0.0;
  if (uTouchStrength > 0.001) {
    vec3 toP = pos - uTouchPos;
    float dist = length(toP);
    float field = exp(-dist * dist * 1.35) * uTouchStrength;
    touchEnergy = field;
    vec3 radDir = normalize(toP + vec3(0.0001, 0.0002, 0.0001));
    vec3 orbitSwirl = cross(radDir, vec3(0.0, 0.0, 1.0));
    pos += (radDir * 0.82 + orbitSwirl * 0.65 + uSwipeVel * 0.75) * field * (0.65 + 0.75 * aRnd);
  }

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  float depth = smoothstep(-1.6, 1.6, mv.z + uCamZ);

  /* Realistic 3D Directional & Rim Lighting using the 3D Shape's Surface Normals! */
  vec3 worldNorm = normalize(normalMatrix * baseNorm);
  vec3 keyLight = normalize(vec3(-0.45, 0.65, 0.85));
  vec3 fillLight = normalize(vec3(0.60, -0.35, 0.50));
  float diffKey = max(0.0, dot(worldNorm, keyLight));
  float diffFill = max(0.0, dot(worldNorm, fillLight));
  float rimLight = pow(1.0 - min(1.0, abs(worldNorm.z)), 2.2);
  vSpec = pow(diffKey, 12.0) * 0.65 + rimLight * 0.45;
  vDeep = DEEP;

  vA = mix(0.36, 0.98, depth) * mix(0.78, 1.0, aLayer);

  /* App-Theme-Driven Multicolour Palette + 3D Normal Shading */
  vec3 accentRose = mix(PURP, vec3(min(1.0, PURP.b + 0.30), BLUE.r * 0.35, CYAN.g * 0.85), 0.58);
  vec3 accentAqua = mix(CYAN, vec3(BLUE.g * 0.25, min(1.0, CYAN.b + 0.25), min(1.0, BLUE.r + 0.42)), 0.54);
  vec3 accentGold = mix(PURP, vec3(min(1.0, PURP.r + 0.45), min(1.0, CYAN.g * 0.88), BLUE.b * 0.25), 0.50);

  float huePhase = atan(dir.y, dir.x) + uRawTime * 0.65 + wave * 2.2 + aRnd * 1.2;
  float b1 = smoothstep(-0.55, 0.85, dir.y + wave * 1.1);
  float b2 = smoothstep(-0.25, 0.85, dir.x * 0.65 - dir.y * 0.35 + pseudopod * 0.8 + aRnd * 0.35);
  float b3 = 0.5 + 0.5 * sin(huePhase * 1.8 - dir.z * 2.4);

  vec3 c = mix(BLUE, CYAN, b1 * uCyan);
  c = mix(c, PURP, b2 * uPurple);
  c = mix(c, accentRose, smoothstep(0.36, 0.88, b3) * (0.55 + 0.28 * uHigh));
  c = mix(c, accentAqua, smoothstep(0.45, 0.92, diffKey) * 0.48);
  c = mix(c, accentGold, smoothstep(0.55, 0.94, diffFill + uIsText * 0.35) * 0.44);

  /* Apply 3D surface shading so 3D sculptures (Bust, Saturn, Heart, WELCOME, DONE) have true 3D relief */
  float lighting = 0.58 + 0.42 * diffKey + 0.22 * diffFill + 0.35 * rimLight;
  c *= lighting;
  c = mix(c, mix(CYAN, accentGold, 0.5), clamp(shockHighlight * 0.8 + touchEnergy * 0.7 + uFusionFlash * 0.6, 0.0, 0.88));

  /* Anchor with DEEP theme color so particles always stay visible on light or dark backgrounds */
  c = mix(DEEP, c, 0.48 + 0.52 * aRnd);

  vC = c * uBright * mix(0.70, 1.15, depth);

  /* Slightly tighter, crisper particles during WELCOME / DONE text so letters look razor-sharp */
  float sizeMode = mix(0.0085 + aRnd * 0.0155, 0.0072 + aRnd * 0.0095, uIsText);
  float ptSize = sizeMode
    * mix(1.18, 0.96, aLayer)
    * (1.0 + uAmp * 0.55 + uBass * 0.28 + uSplit * 0.20 + touchEnergy * 0.42);
  gl_PointSize = max(ptSize * uPx / (-mv.z) * mix(0.86, 1.28, depth), 1.75);
  gl_Position = projectionMatrix * mv;
}
`;

const dotF = `
precision highp float;
varying vec3 vC;
varying vec3 vDeep;
varying float vA;
varying float vSpec;

void main() {
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;

  float body = smoothstep(0.5, 0.06, d);
  float core = exp(-d * d * 20.0) * (0.24 + 0.25 * vSpec);
  float alpha = clamp((body * 0.90 + core) * vA, 0.0, 0.97);
  vec3 col = mix(vDeep * 0.68, vC * (1.02 + core * 0.72), smoothstep(0.47, 0.14, d));
  gl_FragColor = vec4(col, alpha);
}
`;

function buildParticles() {
  /* Start on first open directly in the 3D "WELCOME" particle sculpture! */
  const welcomeData = shapeCache.welcome;
  const initialPos = new Float32Array(welcomeData.pos);
  const targetPos = new Float32Array(welcomeData.pos);
  const initialNorm = new Float32Array(welcomeData.norm);
  const targetNorm = new Float32Array(welcomeData.norm);

  const rnd = new Float32Array(COUNT);
  const layer = new Float32Array(COUNT);
  const cluster = new Float32Array(COUNT);

  const amoebaPos = shapeCache.amoeba.pos;
  for (let i = 0; i < COUNT; i++) {
    rnd[i] = Math.random();
    const layerSeed = (i * 0.6180339887) % 1;
    layer[i] = layerSeed < 0.16 ? 0.15 : layerSeed < 0.48 ? 0.55 : 0.95;

    const px = amoebaPos[i * 3], py = amoebaPos[i * 3 + 1], pz = amoebaPos[i * 3 + 2];
    const ang = Math.atan2(py, px) + (pz * 0.35);
    const bucket = Math.floor(((ang + Math.PI) / (Math.PI * 2)) * MAX_BLOBS) % MAX_BLOBS;
    cluster[i] = (bucket + MAX_BLOBS) % MAX_BLOBS;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(initialPos, 3));
  g.setAttribute("aTarget", new THREE.BufferAttribute(targetPos, 3));
  g.setAttribute("aNormal", new THREE.BufferAttribute(initialNorm, 3));
  g.setAttribute("aTargetNormal", new THREE.BufferAttribute(targetNorm, 3));
  g.setAttribute("aRnd", new THREE.BufferAttribute(rnd, 1));
  g.setAttribute("aLayer", new THREE.BufferAttribute(layer, 1));
  g.setAttribute("aCluster", new THREE.BufferAttribute(cluster, 1));

  const mat = new THREE.ShaderMaterial({
    vertexShader: partV,
    fragmentShader: dotF,
    uniforms: U,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  const p = new THREE.Points(g, mat);
  p.frustumCulled = false;
  p.renderOrder = 3;
  return p;
}

const pointsMesh = buildParticles();

      offA: new THREE.Vector3(Math.cos(a1) * 0.38, Math.sin(a1) * 0.28, Math.sin(a1 * 2) * 0.25),
      offB: new THREE.Vector3(Math.cos(a2) * 0.38, Math.sin(a2) * 0.28, Math.cos(a2 * 2) * 0.25),
      phase: s * 0.91,
      freq: 2.2 + (s % 5) * 0.65
    });
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));

let glowMat, glow, orbitPts, ptData = [];

function createGlow() {
  glowMat = new THREE.ShaderMaterial({
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `
      varying vec2 vUv;
      uniform float uTime, uStrength, uMix;
      uniform vec3 uA, uB, uC;
      void main() {
        vec2 c = (vUv - 0.5) * vec2(1.0, 1.32);
        float d = length(c) * 2.0;
        float a = atan(c.y, c.x);
        float g = (d > 0.56 ? exp(-(d - 0.56) * 5.6) * 0.70 : 0.0) * smoothstep(1.0, 0.70, d);

        vec3 accent = vec3(uB.b, uA.r * 0.5 + uC.g * 0.5, uC.b);
        vec3 col = mix(uA, uB, 0.5 + 0.5 * sin(a + uTime * 0.6));
        col = mix(col, uC, uMix * (0.5 + 0.5 * sin(a * 2.0 - uTime * 0.8)));
        col = mix(col, accent, 0.30 * (0.5 + 0.5 * cos(a * 3.0 + uTime * 0.7)));
        gl_FragColor = vec4(col, clamp(g * uStrength * 0.42, 0.0, 0.45));
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    uniforms: {
      uTime: { value: 0 },
      uStrength: { value: 0.58 },
      uMix: { value: 0.48 },
      uA: U.BLUE,
      uB: U.PURP,
      uC: U.CYAN
    }
  });
  glow = new THREE.Mesh(new THREE.PlaneGeometry(VIS * 1.30, VIS * 1.08), glowMat);
  glow.position.z = -0.15;
  glow.renderOrder = -2;
  scene.add(glow);
}

function createOrbitSpores() {
  const pos = new Float32Array(ORBIT_COUNT * 3);
  const size = new Float32Array(ORBIT_COUNT);
  const alpha = new Float32Array(ORBIT_COUNT);
  const color = new Float32Array(ORBIT_COUNT * 3);
  const pal = [
    [0.05, 0.88, 1.0],
    [0.25, 0.50, 1.0],
    [0.72, 0.30, 0.98],
    [0.95, 0.25, 0.68],
    [0.08, 0.90, 0.72]
  ];

  for (let i = 0; i < ORBIT_COUNT; i++) {
    color.set(pal[i % pal.length], i * 3);
    size[i] = 0.020 + Math.random() * 0.045;
    ptData.push({
      a: Math.random() * 6.283,
      r: 1.44 + Math.random() * 0.76,
      sp: (0.14 + Math.random() * 0.26) * (Math.random() < 0.5 ? -1 : 1),
      ph: Math.random() * 6.283,
      tilt: (Math.random() - 0.5) * 1.30,
      y: (Math.random() - 0.5) * 1.15,
      fs: 0.35 + Math.random() * 0.58
    });

  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
  g.setAttribute("aAlpha", new THREE.BufferAttribute(alpha, 1));
  g.setAttribute("aColor", new THREE.BufferAttribute(color, 3));

  orbitPts = new THREE.Points(
    g,
    new THREE.ShaderMaterial({
      vertexShader: "attribute float aSize, aAlpha; attribute vec3 aColor; uniform float uPx; uniform vec3 DEEP; varying float vA; varying vec3 vC; varying vec3 vDeep; varying float vSpec; void main(){ vA = aAlpha; vC = aColor; vDeep = DEEP; vSpec = 0.5; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = max(aSize * uPx / (-mv.z), 1.5); gl_Position = projectionMatrix * mv; }",
      fragmentShader: dotF,
      transparent: true,
      depthWrite: false,
      uniforms: { uPx: U.uPx, DEEP: U.DEEP }
    })
  );
  orbitPts.frustumCulled = false;
  orbitPts.renderOrder = 4;
  scene.add(orbitPts);
}

let targetAmoebaFactor = 0.04; /* Start sharp on WELCOME */

function morphToShapeData(shapeObj, labelText, shapeKey) {
  const posAttr = pointsMesh.geometry.attributes.position;
  const tgtAttr = pointsMesh.geometry.attributes.aTarget;
  const normAttr = pointsMesh.geometry.attributes.aNormal;
  const tgtNormAttr = pointsMesh.geometry.attributes.aTargetNormal;
  const curM = U.uMorph.value;

  if (curM > 0.001) {
    const smoothM = curM * curM * (3 - 2 * curM);
    const pArr = posAttr.array, tArr = tgtAttr.array;
    const nArr = normAttr.array, tnArr = tgtNormAttr.array;
    for (let i = 0; i < pArr.length; i++) {
      pArr[i] = pArr[i] + (tArr[i] - pArr[i]) * smoothM;
      nArr[i] = nArr[i] + (tnArr[i] - nArr[i]) * smoothM;
    }
    posAttr.needsUpdate = true;
    normAttr.needsUpdate = true;
  }

  tgtAttr.array.set(shapeObj.pos);
  tgtAttr.needsUpdate = true;
  tgtNormAttr.array.set(shapeObj.norm);
  tgtNormAttr.needsUpdate = true;

  U.uMorph.value = 0;
  morphProgress = 0;
  morphActive = true;

  const isTextShape = (shapeKey === "welcome" || shapeKey === "done" || shapeKey === "custom_text");
  targetIsText = isTextShape ? 1.0 : 0.0;
  targetAmoebaFactor = shapeKey === "amoeba" ? 1.0 : isTextShape ? 0.03 : 0.14;
  targetHeartBeat = shapeKey === "infinity" ? 1.0 : 0.0;

  const lbl = $("#shapeLabel");
  if (lbl && labelText) lbl.textContent = labelText;
}

/* ---------- Quantum Swarm Fission (Touch Separation) & Recombination ---------- */
function triggerAmoebaSplit(worldHitPoint, lobeCount) {
  /* If currently displaying WELCOME or DONE, morph into the Elliptical Amoeba as it splits! */
  if (currentShape === "welcome" || currentShape === "done" || currentShape === "custom_text") {
    messageHoldTimer = 0;
    setOrbShape("amoeba");
  }
  activeLobes = lobeCount || 5;
  splitTimer = 3.1;
  splitAmount = Math.max(splitAmount, 0.42);
  wasSplit = true;

  const hit = worldHitPoint || new THREE.Vector3(0, 0, 0);
  shockOrigin.copy(hit);
  shockWave = 0.0;

  const baseAngle = Math.random() * Math.PI * 2;
  for (let i = 0; i < MAX_BLOBS; i++) {
    const b = blobs[i];
    const ang = baseAngle + (i * Math.PI * 2) / MAX_BLOBS;
    b.orbitAngle = ang;
    const dist = 1.06 + (i % 2) * 0.24;
    const rx = Math.cos(ang) * dist * 1.30;
    const ry = Math.sin(ang) * dist * 0.94;
    const rz = ((i % 3) - 1) * 0.42;

    b.targetOffset.set(rx, ry, rz);
    const pushX = rx - hit.x * 0.6;
    const pushY = ry - hit.y * 0.6;
    b.vel.x += pushX * 3.6;
    b.vel.y += pushY * 3.6;
    b.vel.z += rz * 2.8;
  }
}

function applyTheme(name, custom, custom2) {

    if (c2 && hsl.s >= 0.06) {
      const deep = new THREE.Color().setHSL(hsl.h, Math.min(1, Math.max(0.6, hsl.s * 1.2)), Math.max(0.1, Math.min(0.35, hsl.l * 0.45)));
      const main = new THREE.Color().setHSL(hsl.h, Math.max(0.85, hsl.s), Math.max(0.45, Math.min(0.65, hsl.l)));
      const h2 = hsl2.s < 0.06 ? hsl.h : hsl2.h;
      const hi1 = new THREE.Color().setHSL(h2, Math.max(0.8, hsl2.s), Math.max(0.55, Math.min(0.72, hsl2.l + 0.1)));
      const hi2 = new THREE.Color().setHSL((h2 + 0.06) % 1.0, 0.95, 0.68);

  const l = Math.max(0, Math.min(1, Number(level) || 0));
  extAudio.level = l;
  extAudio.bass = Math.max(0, Math.min(1, bass !== undefined && bass !== null ? Number(bass) : l));
  extAudio.high = Math.max(0, Math.min(1, high !== undefined && high !== null ? Number(high) : l));
  externalAudioTime = performance.now();
}

function toast(m) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("show"), 2600);
}

function updateMicUI() {
  const b = $("#mic");
  if (b) {
    b.classList.toggle("on", micOn);
    b.textContent = micOn ? "MIC ON" : "MIC TEST";
  }
}

async function startAudioReactive() {
  if (micOn) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    actx = new AC();
    if (actx.state === "suspended") await actx.resume();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.76;
    actx.createMediaStreamSource(micStream).connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    micOn = true;
    updateMicUI();
    return true;
  } catch (e) {
    micOn = false;
    updateMicUI();
    toast("Microphone unavailable — using simulated voice harmonics");
    return false;
  }
}

function stopAudioReactive() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (actx && actx.close) actx.close().catch(() => {});
  micStream = null;
  actx = null;
  analyser = null;
  micOn = false;
  updateMicUI();
}

function simulateAudio(t) {
  let l, b, h;
  if (state === "speaking") {
    const syl = Math.pow(Math.abs(Math.sin(t * 7.5) * Math.sin(t * 2.3 + 1)), 0.75);
    const gate = Math.sin(t * 0.95) > -0.68 ? 1 : 0.16;
    l = (0.34 + 0.52 * syl) * gate;
    b = l * (0.68 + 0.32 * Math.sin(t * 5.2));
    h = l * (0.52 + 0.48 * Math.sin(t * 11.5));
  } else if (state === "listening") {
    l = 0.24 + 0.22 * Math.abs(Math.sin(t * 3.3) * Math.sin(t * 1.4));
    b = l * 0.85;
    h = l * 0.55;
  } else if (state === "thinking") {
    l = 0.18 + 0.11 * Math.sin(t * 2.8);
    b = l * 0.75;
    h = l * 0.72;
  } else {
    l = 0.08 + 0.045 * Math.sin(t * 1.35);
    b = l * 0.9;
    h = l * 0.55;
  }
  return [l, b, h];
}

/* Also detect when external native voice audio finishes speaking so "DONE" triggers
   even if the host app only streams setExternalAudio(level) without calling stopSpeaking()! */
let wasReceivingVoiceAudio = false;
let silenceAfterVoiceTimer = 0;

function readAudio(t, dt) {
  let l, b, h;
  const hasExternal = (performance.now() - externalAudioTime < 220);
  if (hasExternal) {
    l = extAudio.level;
    b = extAudio.bass;
    h = extAudio.high;
    if (l > 0.22) {
      wasReceivingVoiceAudio = true;
      silenceAfterVoiceTimer = 0;
    } else if (wasReceivingVoiceAudio) {
      silenceAfterVoiceTimer += dt;
      if (silenceAfterVoiceTimer > 0.85) {
        wasReceivingVoiceAudio = false;
        silenceAfterVoiceTimer = 0;
        showDoneMessage(2.6);
      }
    }
  } else if (micOn && analyser) {
    analyser.getByteFrequencyData(freq);
    const avg = (a, z) => {
      let s = 0;
      for (let i = a; i < z; i++) s += freq[i];
      return s / ((z - a) * 255);
    };
    l = Math.min(avg(0, freq.length) * 2.8, 1);
    b = Math.min(avg(0, 6) * 2.4, 1);
    h = Math.min(avg(48, 110) * 3.2, 1);
  } else {
    [l, b, h] = simulateAudio(t);
  }
  const k = 1 - Math.exp(-dt * (l > audio.level ? 22 : 7));
  audio.level += (l - audio.level) * k;
  audio.bass += (b - audio.bass) * k;
  audio.high += (h - audio.high) * k;
}

/* ---------- Touch, Swipe Cleavage & Double-Tap Instant 3D Shape Morph ---------- */
let dragging = false, px = 0, py = 0, velX = 0, velY = 0, lastTapTime = 0;
let pointerNormX = 0, pointerNormY = 0;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hitPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const intersectPt = new THREE.Vector3();
const invOrbMatrix = new THREE.Matrix4();
const prevTouchWorld = new THREE.Vector3();

function screenToOrbLocal(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / Math.max(rect.width, 1)) * 2 - 1;
  ndc.y = -((clientY - rect.top) / Math.max(rect.height, 1)) * 2 + 1;
  pointerNormX = ndc.x;
  pointerNormY = ndc.y;
  raycaster.setFromCamera(ndc, camera);
  raycaster.ray.intersectPlane(hitPlane, intersectPt);
  invOrbMatrix.copy(orb.matrixWorld).invert();
  return intersectPt.clone().applyMatrix4(invOrbMatrix);
}

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  px = e.clientX;
  py = e.clientY;
  canvas.setPointerCapture(e.pointerId);

  const now = performance.now();
  const localHit = screenToOrbLocal(e.clientX, e.clientY);
  prevTouchWorld.copy(localHit);
  touchWorld.copy(localHit);
  touchStrength = 1.55;

  /* Double-tap cycles through realistic 3D shapes AND "DONE" preview */
  if (now - lastTapTime < 340) {
    splitTimer = 0;
    const cycleList = [...SHAPE_NAMES, "done"];
    const idx = (cycleList.indexOf(currentShape) + 1) % cycleList.length;
    if (cycleList[idx] === "done") showDoneMessage(2.8);
    else setOrbShape(cycleList[idx]);
    autoMorphTimer = 0;
    lastTapTime = 0;
    return;
  }
  lastTapTime = now;

  if (localHit.length() < 2.5) {
    triggerAmoebaSplit(localHit, 5);
  }
});

canvas.addEventListener("pointermove", e => {
  const localHit = screenToOrbLocal(e.clientX, e.clientY);
  swipeVelWorld.subVectors(localHit, prevTouchWorld).multiplyScalar(14.0);
  swipeVelWorld.clampLength(0, 2.5);
  prevTouchWorld.copy(localHit);
  touchWorld.lerp(localHit, 0.60);

  if (!dragging) {
    if (localHit.length() < 1.9) {
      touchStrength = Math.max(touchStrength, 0.55);
    }
    return;
  }

  const dx = e.clientX - px;
  const dy = e.clientY - py;
  velY += dx * 0.0095;
  velX += dy * 0.0095;
  px = e.clientX;
  py = e.clientY;

  touchStrength = 1.65;
  if (localHit.length() < 2.75) {
    splitTimer = Math.max(splitTimer, 2.4);
    splitAmount = Math.max(splitAmount, 0.85);
    wasSplit = true;
    blobs[0].targetOffset.set(
      Math.max(-1.6, Math.min(1.6, localHit.x * 0.92)),
      Math.max(-1.3, Math.min(1.3, localHit.y * 0.92)),
      0.20
    );
  }
});

const endDrag = () => {
  dragging = false;
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

window.addEventListener("deviceorientation", e => {
  if (e.gamma !== null && e.beta !== null) {
    pointerNormX = Math.max(-1, Math.min(1, e.gamma / 35));
    pointerNormY = Math.max(-1, Math.min(1, (e.beta - 45) / 35));
  }
}, { passive: true });

/* ---------- Main Animation Loop ---------- */
let time = 0, flow = 0, pxPerUnit = 300;
let glowMul = 0.95;

function updatePlasmaArcs() {
  /* Hide arcs while showing crisp 3D WELCOME or DONE text so letters are 100% clean */
  if (U.uIsText.value > 0.4 && splitAmount < 0.05) {
    arcMesh.visible = false;
    return;
  }
  arcMesh.visible = true;

  const posAttr = arcMesh.geometry.attributes.position;
  const colAttr = arcMesh.geometry.attributes.color;
  const cCyan = U.CYAN.value, cPurp = U.PURP.value, cBlue = U.BLUE.value, cDeep = U.DEEP.value;

  let vIdx = 0;
  for (let s = 0; s < ARC_CHAINS; s++) {
    const meta = arcMeta[s];
    const pA = blobs[meta.bA].pos;
    const pB = (touchStrength > 0.35 && s % 2 === 0) ? touchWorld : blobs[meta.bB].pos;
    const oScale = 0.36 + 0.30 * (1 - splitAmount);

    const ax = pA.x + meta.offA.x * oScale;
    const ay = pA.y + meta.offA.y * oScale;
    const az = pA.z + meta.offA.z * oScale;

    const bx = pB.x + meta.offB.x * oScale;
    const by = pB.y + meta.offB.y * oScale;
    const bz = pB.z + meta.offB.z * oScale;

    const mx = (ax + bx) * 0.5 + Math.sin(time * meta.freq + meta.phase) * (0.24 + splitAmount * 0.24);
    const my = (ay + by) * 0.5 + Math.cos(time * meta.freq * 0.9 - meta.phase) * (0.22 + splitAmount * 0.20);
    const mz = (az + bz) * 0.5 + Math.sin(time * meta.freq * 1.1 + meta.phase) * 0.22;

    let prevX = ax, prevY = ay, prevZ = az;
    for (let k = 1; k <= ARC_SEGS; k++) {
      const t = k / ARC_SEGS;
      const inv = 1 - t;
      const envelope = Math.sin(t * Math.PI);
      const jitter = (0.028 + 0.06 * splitAmount + 0.04 * touchStrength) * envelope;
      const jx = Math.sin(t * 26.0 + time * 22.0 + s * 3.1) * jitter;
      const jy = Math.cos(t * 29.0 - time * 20.0 + s * 2.3) * jitter;
      const jz = Math.sin(t * 23.0 + time * 18.0 - s * 1.7) * jitter;

      const curX = inv * inv * ax + 2 * inv * t * mx + t * t * bx + jx;
      const curY = inv * inv * ay + 2 * inv * t * my + t * t * by + jy;
      const curZ = inv * inv * az + 2 * inv * t * mz + t * t * bz + jz;

      posAttr.setXYZ(vIdx, prevX, prevY, prevZ);
      posAttr.setXYZ(vIdx + 1, curX, curY, curZ);

      const waveCol = 0.5 + 0.5 * Math.sin(t * 8.0 - time * 6.0 + meta.phase);
      colAttr.setXYZ(
        vIdx,
        cDeep.r * 0.35 + (cCyan.r * waveCol + cBlue.r * (1 - waveCol)) * 0.65,
        cDeep.g * 0.35 + (cCyan.g * waveCol + cBlue.g * (1 - waveCol)) * 0.65,
        cDeep.b * 0.35 + (cCyan.b * waveCol + cBlue.b * (1 - waveCol)) * 0.65
      );
      colAttr.setXYZ(
        vIdx + 1,
        cDeep.r * 0.35 + (cPurp.r * waveCol + cCyan.r * (1 - waveCol)) * 0.65,
        cDeep.g * 0.35 + (cPurp.g * waveCol + cCyan.g * (1 - waveCol)) * 0.65,
        cDeep.b * 0.35 + (cPurp.b * waveCol + cCyan.b * (1 - waveCol)) * 0.65
      );

      prevX = curX; prevY = curY; prevZ = curZ;
      vIdx += 2;
    }
  }
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
  arcMesh.material.opacity = Math.min(0.78, 0.18 + splitAmount * 0.52 + audio.level * 0.25 + touchStrength * 0.22);
}

function updateOrb(dt) {
  const k = 1 - Math.exp(-dt * 4.5);
  for (const key in cur) cur[key] += (tgt[key] - cur[key]) * k;

  time += dt;
  flow += dt * (cur.speed + audio.level * 0.50);

  readAudio(time, dt);

  if (shockWave < 4.4) {
    shockWave += dt * 3.1;
  }
  U.uShockWave.value = shockWave;
  U.uShockOrigin.value.copy(shockOrigin);

  /* Hold WELCOME (on first open) or DONE (after work/speech completes), then transition to Amoeba */
  if (messageHoldTimer > 0) {
    messageHoldTimer -= dt;
    if (messageHoldTimer <= 0) {
      messageHoldTimer = 0;
      setOrbShape("amoeba");
      autoMorphTimer = 0;
    }
  } else if (autoMorph && splitTimer <= 0) {
    autoMorphTimer += dt;
    if (autoMorphTimer > 5.8) {
      autoMorphTimer = 0;
      const idx = (SHAPE_NAMES.indexOf(currentShape) + 1) % SHAPE_NAMES.length;
      setOrbShape(SHAPE_NAMES[idx]);
    }
  }

  if (morphActive) {
    morphProgress = Math.min(1, morphProgress + dt * 0.88);
    U.uMorph.value = morphProgress;
    if (morphProgress >= 1) {
      const posAttr = pointsMesh.geometry.attributes.position;
      const tgtAttr = pointsMesh.geometry.attributes.aTarget;
      const normAttr = pointsMesh.geometry.attributes.aNormal;
      const tgtNormAttr = pointsMesh.geometry.attributes.aTargetNormal;
      posAttr.array.set(tgtAttr.array);
      posAttr.needsUpdate = true;
      normAttr.array.set(tgtNormAttr.array);
      normAttr.needsUpdate = true;
      U.uMorph.value = 0;
      morphActive = false;
    }
  }

  /* Quantum Swarm Fission & Spiral Implosion Recombination */
  if (splitTimer > 0) {
    splitTimer -= dt;
    splitAmount += (1.0 - splitAmount) * (1 - Math.exp(-dt * 7.8));
  } else {
    if (wasSplit && splitAmount < 0.38 && splitAmount > 0.08) {
      fusionFlash = 1.0;
      shockOrigin.set(0, 0, 0);
      shockWave = 0.0;
      wasSplit = false;
    }
    splitAmount += (0.0 - splitAmount) * (1 - Math.exp(-dt * 3.0));
  }

  fusionFlash *= Math.exp(-dt * 3.8);
  U.uFusionFlash.value = fusionFlash;

  touchStrength *= Math.exp(-dt * (dragging ? 1.3 : 3.8));
  swipeVelWorld.multiplyScalar(Math.exp(-dt * 8.0));

  for (let i = 0; i < MAX_BLOBS; i++) {
    const b = blobs[i];
    if (splitTimer > 0) {
      if (!(dragging && i === 0)) {
        b.orbitAngle += dt * 0.38 * (i % 2 === 0 ? 1 : -1);
        const dist = 1.06 + (i % 2) * 0.24;
        b.targetOffset.x = Math.cos(b.orbitAngle) * dist * 1.30;
        b.targetOffset.y = Math.sin(b.orbitAngle) * dist * 0.94;
      }
      const wobbleX = Math.cos(time * 2.2 + b.phase) * 0.15;
      const wobbleY = Math.sin(time * 2.6 + b.phase) * 0.14;
      const desiredX = b.targetOffset.x + wobbleX;
      const desiredY = b.targetOffset.y + wobbleY;
      const desiredZ = b.targetOffset.z + Math.sin(time * 1.8 + b.phase) * 0.14;

      b.vel.x += (desiredX - b.pos.x) * 18 * dt;
      b.vel.y += (desiredY - b.pos.y) * 18 * dt;
      b.vel.z += (desiredZ - b.pos.z) * 18 * dt;
    } else {
      const tangX = -b.pos.y * 5.5;
      const tangY = b.pos.x * 5.5;
      b.vel.x += ((0 - b.pos.x) * 26 + tangX) * dt;
      b.vel.y += ((0 - b.pos.y) * 26 + tangY) * dt;
      b.vel.z += (0 - b.pos.z) * 26 * dt;
    }
    const damping = Math.exp(-dt * 5.2);
    b.vel.multiplyScalar(damping);
    b.pos.addScaledVector(b.vel, dt);
    blobCenters[i].copy(b.pos);
  }

  updatePlasmaArcs();

  const idlePulse = Math.pow(Math.max(0, Math.sin(time * 0.65)), 8) * 0.14 * (1 - cur.wob);
  const s = cur.scale * (1 + 0.022 * Math.sin(time * 1.5) + audio.level * 0.10 + audio.bass * 0.05 + cur.wob * 0.028 * Math.sin(time * 4.0));
  orb.scale.setScalar(s);

  /* When showing 3D Text ("WELCOME" or "DONE") or 3D Jarvis Face Bust, smoothly align
     rotation toward the camera so the 3D text/face is always upright and readable! */
  const alignFront = (targetIsText > 0.5 || currentShape === "vortex" || currentShape === "infinity");
  if (alignFront && !dragging) {
    /* Wrap rotation.y to nearest multiple of 2*PI so it smoothly faces forward */
    const twoPi = Math.PI * 2;
    orb.rotation.y = orb.rotation.y - Math.round(orb.rotation.y / twoPi) * twoPi;
    const targetY = Math.sin(time * 0.9) * (targetIsText > 0.5 ? 0.14 : 0.28) + pointerNormX * 0.18;
    const targetX = Math.cos(time * 0.7) * 0.06 + pointerNormY * 0.12;
    orb.rotation.y += (targetY - orb.rotation.y) * (1 - Math.exp(-dt * 5.5));
    orb.rotation.x += (targetX - orb.rotation.x) * (1 - Math.exp(-dt * 5.5));
    orb.rotation.z += (0 - orb.rotation.z) * (1 - Math.exp(-dt * 5.5));
  } else {
    orb.rotation.y += dt * 0.22 * (0.45 + cur.speed) + velY * Math.min(dt * 20, 1) * 0.55;
    orb.rotation.x = Math.max(-1.15, Math.min(1.15, orb.rotation.x + velX * Math.min(dt * 20, 1) * 0.55));
    orb.rotation.z = Math.sin(time * 0.5) * 0.06 + pointerNormX * 0.05;
    if (!dragging && Math.abs(orb.rotation.x) > 0.001) {
      orb.rotation.x += (pointerNormY * 0.16 - orb.rotation.x) * Math.min(1, dt * 2.2);
    }
  }
  velX *= Math.exp(-dt * 5.2);
  velY *= Math.exp(-dt * 5.2);

  U.uAmoeba.value += (targetAmoebaFactor * cur.amoebaAmp - U.uAmoeba.value) * k;
  U.uIsText.value += (targetIsText - U.uIsText.value) * k;
  U.uHeartBeat.value += (targetHeartBeat - U.uHeartBeat.value) * k;
  U.uTime.value = flow;
  U.uRawTime.value = time;
  U.uAmp.value = audio.level + cur.wob * 0.24;
  U.uBass.value = audio.bass;
  U.uHigh.value = audio.high;
  U.uCyan.value = cur.cyan;
  U.uPurple.value = cur.purple;
  U.uBright.value = cur.bright + idlePulse + fusionFlash * 0.18;
  U.uSplit.value = splitAmount;
  U.uTouchPos.value.copy(touchWorld);
  U.uSwipeVel.value.copy(swipeVelWorld);
  U.uTouchStrength.value = touchStrength;

  glowMat.uniforms.uTime.value = time;
  glowMat.uniforms.uMix.value = cur.cyan;
  glowMat.uniforms.uStrength.value = (cur.glow + audio.level * 0.65 + idlePulse * 1.8 + splitAmount * 0.25 + fusionFlash * 0.35) * glowMul;

  shadowEl.style.width = Math.round(pxPerUnit * 1.90 * s * (1 + splitAmount * 0.40)) + "px";
}

function updateOrbitSpores(dt) {
  const P = orbitPts.geometry.attributes;
  const boost = 0.72 + cur.speed * 0.95 + (state === "thinking" ? 1.35 : 0) + splitAmount * 1.0 + audio.high * 0.8;
  for (let i = 0; i < ORBIT_COUNT; i++) {
    const d = ptData[i];
    d.a += d.sp * dt * boost;
    const r = d.r + Math.sin(time * d.fs + d.ph) * 0.16 - (state === "thinking" ? 0.12 : 0) + audio.level * 0.15 + splitAmount * 0.30;
    let x = Math.cos(d.a) * r * 1.30;
    let z = Math.sin(d.a) * r * 0.70;
    let y = d.y * 0.84 + Math.sin(d.a * 1.3 + d.ph) * 0.20 + x * d.tilt * 0.22;

    if (touchStrength > 0.05) {
      const pull = Math.min(0.55, touchStrength * 0.32);
      x += (touchWorld.x - x) * pull;
      y += (touchWorld.y - y) * pull;
    }

    P.position.setXYZ(i, x, y, z);
    P.aAlpha.setX(i, Math.pow(0.5 + 0.5 * Math.sin(time * d.fs * 1.8 + d.ph), 1.4) * (0.62 + cur.glow * 0.32));
  }
  P.position.needsUpdate = true;
  P.aAlpha.needsUpdate = true;
}

/* ---------- Responsive Resize & Render Loop ---------- */
function handleResize() {
  const deviceMemory = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
  const qualityCap = deviceMemory >= 6 && cores >= 8 ? 3 : 2;
  const w = Math.max(stage.clientWidth, 1), h = Math.max(stage.clientHeight, 1);
  const pr = Math.min(window.devicePixelRatio || 1, qualityCap);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const visH = VIS / Math.min(1, (w / h) * 0.90);
  const tan = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camera.position.z = visH / (2 * tan);
  U.uCamZ.value = camera.position.z;
  camera.updateProjectionMatrix();
  pxPerUnit = h / visH;
  U.uPx.value = h * pr / (2 * tan);
  shadowEl.style.top = Math.round(h / 2 + pxPerUnit * 1.05) + "px";
}

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  updateOrb(dt);
  updateOrbitSpores(dt);
  renderer.render(scene, camera);
}

  showMessage: showCustomTextMessage,
  morphToCustom: morphToCustomShape,
  triggerSplit: (lobes) => triggerAmoebaSplit(new THREE.Vector3(0, 0, 0), lobes || 5),
  setAutoMorph: enabled => {
    autoMorph = !!enabled;
    if (autoMorphBtn) {
      autoMorphBtn.classList.toggle("on", autoMorph);
      autoMorphBtn.textContent = autoMorph ? "AUTO MORPH: ON" : "AUTO MORPH: OFF";
    }
  },
  setEmbedded: embedded => {
    document.body.classList.toggle("embedded", !!embedded);
    applyTheme(themeName);
    handleResize();
  },
  setTheme: n => applyTheme(n),
  setBackground: (hex, hex2) => {
    if (!isEmbedded) document.documentElement.style.setProperty("--bg", hex);
    applyTheme(null, hex, hex2);
  },
  setWorking: b => {
    const wasWorking = working;
    working = !!b;
    if (working) {
      setOrbState("thinking", true);
    } else if (wasWorking) {
      /* Work is Done! Form "DONE ✓" out of the particles! */
      setOrbState("idle", true);
      showDoneMessage(2.8);
    }
  },
  setGlow: v => { const n = parseFloat(v); if (!isNaN(n)) glowMul = Math.max(0, Math.min(2, n)); },
  setExternalAudio: setExternalAudio,
  startListening: () => setOrbState("listening", true),
  startThinking: () => setOrbState("thinking", true),
  startSpeaking: () => setOrbState("speaking", true),
  stopSpeaking: () => {
    /* Jarvis finished answering! Form "DONE ✓" out of the particles! */
    setOrbState("idle", true);
    showDoneMessage(2.8);
  },
  startAudioReactive: startAudioReactive,
  stopAudioReactive: stopAudioReactive
};

handleResize();
applyTheme("light");
setOrbState("idle", true);
/* First-open experience: start with all 45,000 particles forming the 3D "WELCOME" hologram,
   then smoothly morph into the living Elliptical Amoeba! */
showWelcomeMessage(3.5);
requestAnimationFrame(animate);
})();
</script>
<script>
(() => {
  const c = document.getElementById("touchParticles"), x = c.getContext("2d");
  let w = 0, h = 0, sparks = [], rings = [], trail = [], raf = 0, down = false;

  function size() {
    const memory = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4, cap = memory >= 6 && cores >= 8 ? 3 : 2;
    let d = Math.min(devicePixelRatio || 1, cap);
    w = innerWidth; h = innerHeight;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    c.style.width = w + "px"; c.style.height = h + "px";
    x.setTransform(d, 0, 0, d, 0, 0);
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = "high";
  }
  addEventListener("resize", size, { passive: true });
  size();

  function spawnBurst(cx, cy, count) {
    rings.push({ x: cx, y: cy, r: 8, maxR: 72, l: 1, rot: Math.random() * 6.28, h: 190 + Math.random() * 90 });
    for (let i = 0; i < count; i++) {
      let a = (2 * Math.PI * i) / count + (Math.random() - 0.5) * 0.25;
      let s = 1.6 + Math.random() * 3.4;
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        l: 1, r: 1.3 + Math.random() * 2.0,
        h: 185 + Math.random() * 110
      });
    }
    if (!raf) raf = requestAnimationFrame(draw);
  }

  document.addEventListener("pointerdown", e => {
    down = true;
    trail.push({ x: e.clientX, y: e.clientY, l: 1 });
    spawnBurst(e.clientX, e.clientY, 18);
  }, { passive: true });

  document.addEventListener("pointermove", e => {
    if (!down) return;
    trail.push({ x: e.clientX, y: e.clientY, l: 1 });
    if (trail.length > 24) trail.shift();
    for (let i = 0; i < 2; i++) {
      let a = Math.random() * Math.PI * 2, s = 0.8 + Math.random() * 1.8;
      sparks.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        l: 0.85, r: 1.1 + Math.random() * 1.5,
        h: 190 + Math.random() * 100
      });
    }
    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive: true });

  const endPtr = () => { down = false; };
  document.addEventListener("pointerup", endPtr, { passive: true });
  document.addEventListener("pointercancel", endPtr, { passive: true });

  function drawHex(cx, cy, r, rot) {
    x.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = rot + (i * Math.PI) / 3;
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      if (i === 0) x.moveTo(px, py);
      else x.lineTo(px, py);
    }
    x.closePath();
    x.stroke();
  }

  function draw() {
    raf = 0;
    x.clearRect(0, 0, w, h);

    if (trail.length > 1) {
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].l -= 0.048;
        if (trail[i].l <= 0) trail.splice(i, 1);
      }
      for (let i = 1; i < trail.length; i++) {
        const p0 = trail[i - 1], p1 = trail[i];
        x.globalAlpha = p1.l * 0.72;
        x.strokeStyle = "hsl(" + (195 + i * 3) + " 100% 60%)";
        x.lineWidth = p1.l * 4.0;
        x.lineCap = "round";
        x.beginPath();
        x.moveTo(p0.x, p0.y);
        x.lineTo(p1.x, p1.y);
        x.stroke();
      }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += (rg.maxR - rg.r) * 0.14;
      rg.rot += 0.04;
      rg.l -= 0.04;
      if (rg.l <= 0) { rings.splice(i, 1); continue; }
      x.globalAlpha = rg.l * 0.75;
      x.strokeStyle = "hsl(" + rg.h + " 95% 58%)";
      x.lineWidth = 1.5;
      drawHex(rg.x, rg.y, rg.r, rg.rot);
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      let q = sparks[i];
      const px = q.x, py = q.y;
      q.x += q.vx; q.y += q.vy;
      q.vx *= 0.96; q.vy *= 0.96;
      q.l -= 0.036;
      if (q.l <= 0) { sparks.splice(i, 1); continue; }
      x.globalAlpha = q.l;
      x.strokeStyle = "hsl(" + q.h + " 100% 62%)";
      x.lineWidth = q.r * q.l;
      x.lineCap = "round";
      x.beginPath();
      x.moveTo(px, py);
      x.lineTo(q.x - q.vx * 1.4, q.y - q.vy * 1.4);
      x.stroke();
    }

    x.globalAlpha = 1;
    if (sparks.length || rings.length || trail.length) raf = requestAnimationFrame(draw);
  }
})();
</script>
</body>
