<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Ultra-Premium Elliptical Amoeba Particle Orb</title>
<style>
:root {
  --bg: radial-gradient(125% 90% at 50% 38%, #0d1229 0%, #060919 58%, #02030a 100%);
  --fg: #eef2ff;
  --sub: #8f9bc9;
  --glass: rgba(15, 22, 48, 0.62);
  --gb: rgba(120, 160, 255, 0.22);
  --chip: #b4c2f0;
  --t1: #2f6bff;
  --t2: #2f6bff;
  --t3: #2f6bff;
  --sh: rgba(47, 107, 255, 0.24);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  text-rendering: geometricPrecision;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body {
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent !important;
  color: var(--fg);
}
/* Hide all HTML panels & controls immediately so only the orb is on screen */
#hudToggle,
.hud-ui,
.hud-bottom,
#shapePanel,
#panel,
#status,
#toast,
#err,
header {
  display: none !important;
}
body.embedded {
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  justify-content: center;
}
body.embedded .hud-ui {
  display: none !important;
}
#touchParticles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}
header {
  text-align: center;
  padding-top: clamp(10px, 2.2vh, 24px);
  flex: none;
  z-index: 10;
  pointer-events: none;
}
h1 {
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 800;
  letter-spacing: 0.28em;
  padding-left: 0.28em;
  background: linear-gradient(90deg, var(--t1), var(--t2) 55%, var(--t3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-transform: uppercase;
}
header p {
  margin-top: 4px;
  font-size: clamp(11px, 1.5vh, 13.5px);
  color: var(--sub);
  letter-spacing: 0.06em;
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  height: 100%;
}
#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
#shadow {
  position: absolute;
  left: 50%;
  height: 26px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--sh), transparent);
  filter: blur(6px);
  animation: floatShadow 5s ease-in-out infinite;
  pointer-events: none;
  transition: width 0.3s ease, opacity 0.3s ease;
}
@keyframes floatShadow {
  50% { opacity: 0.55; transform: translateX(-50%) scaleX(0.88); }
}
.hud-bottom {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 820px;
  padding-bottom: clamp(10px, 2vh, 20px);
  z-index: 10;
}
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 18px;
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 0 0 1px var(--gb);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--fg);
}
#dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--t1);
  box-shadow: 0 0 10px var(--t1);
  animation: ping 1.6s infinite;
}
@keyframes ping {
  70% { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.panel {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 6px 8px;
  border-radius: 18px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28), inset 0 0 0 1px var(--gb);
  max-width: 100%;
}
.panel-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--sub);
  padding: 0 6px;
  text-transform: uppercase;
}
button {
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  border: 0;
  border-radius: 11px;
  padding: 7px 11px;
  color: var(--chip);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  white-space: nowrap;
}
button:hover {
  color: var(--fg);
  background: rgba(255, 255, 255, 0.08);
}
button.on {
  color: #fff;
  background: linear-gradient(135deg, var(--t1), var(--t2));
  box-shadow: 0 4px 14px rgba(0, 210, 255, 0.32);
}
button.action-btn {
  border: 1px solid var(--gb);
  background: rgba(255, 255, 255, 0.05);
}
#bgc {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: none;
  cursor: pointer;
  overflow: hidden;
}
#bgc::-webkit-color-swatch-wrapper { padding: 0; }
#bgc::-webkit-color-swatch { border: 2px solid var(--gb); border-radius: 50%; }
#hudToggle {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 20;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 0 0 1px var(--gb);
  color: var(--chip);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
#toast {
  position: fixed;
  left: 50%;
  top: 72px;
  transform: translate(-50%, -12px);
  opacity: 0;
  background: rgba(12, 18, 42, 0.9);
  border: 1px solid var(--gb);
  color: #fff;
  font-size: 12.5px;
  padding: 9px 16px;
  border-radius: 12px;
  transition: all 0.3s;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
  z-index: 100;
  backdrop-filter: blur(10px);
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
#err {
  display: none;
  padding: 20px;
  color: #ff6b8b;
  text-align: center;
}
</style>
</head>
<body class="embedded">
<canvas id="touchParticles" aria-hidden="true"></canvas>
<button id="hudToggle" title="Toggle Clean Embedded View">HUD: ON</button>

<header class="hud-ui">
  <h1>JARVIS AMOEBA ORB</h1>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";

const isEmbedded = true;
if (isEmbedded) {
  document.body.classList.add("embedded");
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
}

/* ============================================================================
   JARVIS OPTICAL-FLOW PARTICLE ENGINE (v5)
   - Startup Welcome Structure (Exact 3.0s): Forms "WELCOME", "JARVIS", and
     smaller "by sukant" underneath in crisp 3D particles for 3.0 seconds,
     then glides via spatially-sorted optical flow into the Elliptical Amoeba.
   - Automatic "DONE" Structure: Forms "DONE" in 3D particles whenever work or
     speech finishes.
   - Pure App-Theme Colour Adaptation: Particles never invent foreign colours;
     100% of particle, spore, tendril, and touch-spark colours adapt strictly
     to the App Theme palette (DEEP, BLUE, CYAN, PURP) with their own clean
     self-luminous glow.
   - Ultra-Smooth Optical Flow (Zero Blur, Zero Jitter): Spatially-coherent
     particle indexing + C2-continuous laminar curl-flow advection + EMA-smoothed
     frame timing for 60/120fps liquid-silk movement everywhere, every time.
   ============================================================================ */
const FOV = 45, VIS = 3.55, COUNT = 45000, MAX_BLOBS = 5;
const ARC_CHAINS = 14, ARC_SEGS = 24;

const STATES = {
  idle:      { scale: 1.00, speed: 0.38, cyan: 0.75, purple: 0.65, bright: 1.12, glow: 0.65, ring: 0.35, wob: 0.14, amoebaAmp: 1.08 },
  listening: { scale: 1.06, speed: 0.78, cyan: 1.00, purple: 0.45, bright: 1.22, glow: 0.90, ring: 0.68, wob: 0.32, amoebaAmp: 1.32 },
  thinking:  { scale: 1.03, speed: 1.18, cyan: 0.55, purple: 1.00, bright: 1.18, glow: 0.85, ring: 1.00, wob: 0.65, amoebaAmp: 1.52 },
  speaking:  { scale: 1.08, speed: 0.95, cyan: 0.92, purple: 0.90, bright: 1.26, glow: 0.95, ring: 0.80, wob: 0.42, amoebaAmp: 1.42 },
  talking:   { scale: 1.10, speed: 1.12, cyan: 0.98, purple: 0.72, bright: 1.30, glow: 1.02, ring: 0.88, wob: 0.50, amoebaAmp: 1.48 },
  working:   { scale: 1.04, speed: 1.34, cyan: 0.70, purple: 0.82, bright: 1.20, glow: 0.90, ring: 1.08, wob: 0.72, amoebaAmp: 1.58 }
};

const LABELS = {
  idle: "AMOEBA READY",
  listening: "LISTENING...",
  thinking: "SYNTHESIZING...",
  speaking: "SPEAKING",
  talking: "TALKING...",
  working: "WORKING..."
};

const SHAPE_NAMES = [
  "amoeba", "helix", "torus", "hypercube",
  "infinity", "galaxy", "merkaba", "vortex"
];

const SHAPE_LABELS = {
  amoeba: "ELLIPTICAL AMOEBA",
  vortex: "3D JARVIS AI BUST",
  galaxy: "3D SATURN PLANET",
  infinity: "3D BEATING HEART",
  torus: "3D ARC REACTOR",
  helix: "3D DNA MOLECULE",
  hypercube: "3D HOURGLASS",
  merkaba: "3D STAR CORE",
  welcome: "WELCOME JARVIS",
  done: "DONE",
  custom: "CUSTOM 3D SHAPE"
};

const $ = s => document.querySelector(s);
const stage = $("#stage"), canvas = $("#c"), shadowEl = $("#shadow");

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
  });
} catch (e) {
  $("#err").style.display = "block";
  stage.style.display = "none";
  return;
}
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 60);
camera.position.set(0, 0, 6.4);

/* ---------- 5-Node Amoeba Fission & Smooth Optical Recombination Physics ---------- */
const blobCenters = [];
for (let i = 0; i < MAX_BLOBS; i++) blobCenters.push(new THREE.Vector3(0, 0, 0));

const blobs = [];
for (let i = 0; i < MAX_BLOBS; i++) {
  blobs.push({
    pos: new THREE.Vector3(0, 0, 0),
    vel: new THREE.Vector3(0, 0, 0),
    targetOffset: new THREE.Vector3(0, 0, 0),
    orbitAngle: (i * Math.PI * 2) / MAX_BLOBS,
    phase: i * 1.2566
  });
}

let splitAmount = 0;
let splitTimer = 0;
let activeLobes = 5;
let touchWorld = new THREE.Vector3(0, 0, 0);
let swipeVelWorld = new THREE.Vector3(0, 0, 0);
let touchStrength = 0;
let shockOrigin = new THREE.Vector3(0, 0, 0);
let shockWave = 10.0;
let fusionFlash = 0.0;
let wasSplit = false;

/* ---------- Shared Shader Uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uRawTime: { value: 0 },
  uAmp: { value: 0 },
  uBass: { value: 0 },
  uHigh: { value: 0 },
  uCyan: { value: 0.75 },
  uPurple: { value: 0.65 },
  uBright: { value: 1.12 },
  uPx: { value: 300 },
  uCamZ: { value: 6.4 },
  uAmoeba: { value: 0.02 },
  uIsText: { value: 1.0 },
  uHeartBeat: { value: 0.0 },
  uMorph: { value: 0.0 },
  uSplit: { value: 0.0 },
  uTouchPos: { value: new THREE.Vector3(0, 0, 0) },
  uSwipeVel: { value: new THREE.Vector3(0, 0, 0) },
  uTouchStrength: { value: 0.0 },
  uShockOrigin: { value: new THREE.Vector3(0, 0, 0) },
  uShockWave: { value: 10.0 },
  uFusionFlash: { value: 0.0 },
  uBlobs: { value: blobCenters },
  DEEP: { value: new THREE.Color() },
  BLUE: { value: new THREE.Color() },
  CYAN: { value: new THREE.Color() },
  PURP: { value: new THREE.Color() }
};

const orb = new THREE.Group();
scene.add(orb);

function computeNormal(x, y, z) {
  const l = Math.sqrt(x * x + y * y + z * z) || 1;
  return [x / l, y / l, z / l];
}

/* Spatial Optical-Flow Sorter:
   Sorts any generated 3D shape's particles by a smooth spatial key (angle + height)
   so when morphing from Shape A to Shape B, particles travel along coherent,
   parallel laminar optical-flow streamlines without chaotic crossing! */
const sortIndices = new Int32Array(COUNT);
const sortKeys = new Float32Array(COUNT);
function sortShapeForOpticalFlow(pos, norm) {
  for (let i = 0; i < COUNT; i++) {
    sortIndices[i] = i;
    const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
    /* Combine vertical band + azimuthal angle for coherent neighborhood mapping */
    const yBand = Math.floor((y + 2.0) * 4.5);
    const ang = Math.atan2(z, x);
    sortKeys[i] = yBand * 10.0 + ang + (x * 0.15);
  }
  sortIndices.sort((a, b) => sortKeys[a] - sortKeys[b]);

  const sortedPos = new Float32Array(COUNT * 3);
  const sortedNorm = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const src = sortIndices[i] * 3;
    const dst = i * 3;
    sortedPos[dst]     = pos[src];
    sortedPos[dst + 1] = pos[src + 1];
    sortedPos[dst + 2] = pos[src + 2];
    sortedNorm[dst]     = norm[src];
    sortedNorm[dst + 1] = norm[src + 1];
    sortedNorm[dst + 2] = norm[src + 2];
  }
  return { pos: sortedPos, norm: sortedNorm };
}

/* ---------- 1. 3D Volumetric Particle Text Rasterizer ----------
   Renders:
   - Welcome screen: "WELCOME" + "JARVIS" + smaller "by sukant" underneath
   - Done screen: Checkmark + "DONE"
   - Custom text: Any string + optional subtitle */
function generate3DTextSculpture(mainText, midText, subText, withCheckmark) {
  const pos = new Float32Array(COUNT * 3);
  const norm = new Float32Array(COUNT * 3);

  const cw = 820, ch = 420;
  const offCanvas = document.createElement("canvas");
  offCanvas.width = cw;
  offCanvas.height = ch;
  const ctx = offCanvas.getContext("2d");

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (withCheckmark) {
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 22;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cw * 0.43, 95);
    ctx.lineTo(cw * 0.485, 142);
    ctx.lineTo(cw * 0.58, 60);
    ctx.stroke();

    ctx.font = "900 124px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, 260);
  } else if (midText && subText) {
    /* 3-Tier Welcome Hierarchy:
       1) WELCOME
       2) JARVIS
       3) by sukant (smaller particle text underneath) */
    ctx.font = "900 92px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, 110);

    ctx.font = "800 84px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(midText, cw / 2, 222);

    ctx.font = "700 42px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(subText, cw / 2, 326);
  } else if (midText) {
    ctx.font = "900 100px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, 165);
    ctx.font = "700 48px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(midText, cw / 2, 285);
  } else {
    const fontSize = mainText.length > 8 ? 88 : 120;
    ctx.font = "900 " + fontSize + "px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
    ctx.fillText(mainText, cw / 2, ch / 2);
  }

  const imgData = ctx.getImageData(0, 0, cw, ch).data;
  const pixels = [];
  for (let y = 1; y < ch - 1; y += 1) {
    for (let x = 1; x < cw - 1; x += 1) {
      const idx = (y * cw + x) * 4 + 3;
      const a = imgData[idx];
      if (a > 85) {
        const ax1 = imgData[(y * cw + (x + 1)) * 4 + 3];
        const ax0 = imgData[(y * cw + (x - 1)) * 4 + 3];
        const ay1 = imgData[((y + 1) * cw + x) * 4 + 3];
        const ay0 = imgData[((y - 1) * cw + x) * 4 + 3];
        const gx = (ax0 - ax1) / 255;
        const gy = (ay1 - ay0) / 255;
        const isEdge = Math.abs(gx) + Math.abs(gy) > 0.1;
        /* Give smaller bottom text ("by sukant" at y > 280) higher sampling weight so its letters are super dense and clear! */
        const weight = y > 280 ? 2 : 1;
        for (let w = 0; w < weight; w++) {
          pixels.push({ x, y, gx, gy, isEdge });
        }
      }
    }
  }

  const pLen = pixels.length || 1;
  const textParticles = Math.floor(COUNT * 0.92); /* 92% in crisp 3D letters, 8% in sleek outer elliptical frame */

  for (let i = 0; i < COUNT; i++) {
    if (i < textParticles && pixels.length > 0) {
      const pIdx = Math.floor((i / textParticles) * pLen) % pLen;
      const px = pixels[pIdx];
      const wx = ((px.x - cw / 2) / (cw * 0.5)) * 2.02;
      const wy = -((px.y - ch / 2) / (cw * 0.5)) * 2.02;
      const depthLayer = ((i * 0.6180339) % 1) * 2 - 1;
      const wz = depthLayer * (px.isEdge ? 0.10 : 0.06);

      pos[i * 3]     = wx;
      pos[i * 3 + 1] = wy;
      pos[i * 3 + 2] = wz;

      const nz = depthLayer >= 0 ? 0.88 : -0.88;
      const n = computeNormal(px.gx * 1.6, px.gy * 1.6, nz);
      norm[i * 3]     = n[0];
      norm[i * 3 + 1] = n[1];
      norm[i * 3 + 2] = n[2];
    } else {
      const ang = ((i - textParticles) / (COUNT - textParticles)) * Math.PI * 2;
      const rRing = 1.0 + ((i % 5) - 2) * 0.008;
      const rx = Math.cos(ang) * 2.12 * rRing;
      const ry = Math.sin(ang) * 1.12 * rRing;
      const rz = Math.sin(ang * 2.0) * 0.06;
      pos[i * 3]     = rx;
      pos[i * 3 + 1] = ry;
      pos[i * 3 + 2] = rz;
      const n = computeNormal(rx, ry, 0.6);
      norm[i * 3]     = n[0];
      norm[i * 3 + 1] = n[1];
      norm[i * 3 + 2] = n[2];
    }
  }
  return sortShapeForOpticalFlow(pos, norm);
}

/* ---------- 2. Realistic 3D Shape Generator (With Optical-Flow Spatial Sorting) ---------- */
function generateRealistic3DShape(shapeName, customFn) {
  if (shapeName === "welcome") {
    return generate3DTextSculpture("WELCOME", "JARVIS", "by sukant", false);
  }
  if (shapeName === "done") {
    return generate3DTextSculpture("DONE", null, null, true);
  }

  const pos = new Float32Array(COUNT * 3);
  const norm = new Float32Array(COUNT * 3);
  const golden = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < COUNT; i++) {
    const frac = (i + 0.5) / COUNT;
    const yNorm = 1 - 2 * frac;
    const rSphere = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
    const theta = i * golden;

    const layerSeed = (i * 0.6180339887) % 1;
    const shell = layerSeed < 0.15
      ? 0.28 + 0.38 * (layerSeed / 0.15)
      : layerSeed < 0.45
        ? 0.68 + 0.22 * ((layerSeed - 0.15) / 0.30)
        : 0.92 + 0.08 * ((layerSeed - 0.45) / 0.55);

    const ux = Math.cos(theta) * rSphere;
    const uy = yNorm;
    const uz = Math.sin(theta) * rSphere;

    let x = 0, y = 0, z = 0, nx = ux, ny = uy, nz = uz;

    if (typeof customFn === "function") {
      const res = customFn(frac, (theta % (Math.PI * 2)) / (Math.PI * 2), i, COUNT, shell);
      if (res && res.length >= 3) {
        x = res[0]; y = res[1]; z = res[2];
        const n = computeNormal(x, y, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "amoeba") {
      const lobe = 1.0
        + 0.16 * Math.sin(ux * 3.0 + uy * 2.2) * Math.cos(uz * 2.5)
        + 0.11 * Math.cos(uy * 4.0 - uz * 3.0 + ux * 1.5);
      x = ux * 1.44 * shell * lobe;
      y = uy * 0.92 * shell * lobe;
      z = uz * 1.08 * shell * lobe;
      const n = computeNormal(ux / 1.44, uy / 0.92, uz / 1.08);
      nx = n[0]; ny = n[1]; nz = n[2];
    } else if (shapeName === "vortex") {
      /* 3D Sculpted Jarvis AI Bust */
      if (frac < 0.68) {
        const fFrac = frac / 0.68;
        const fy = 1 - 2 * fFrac;
        const fr = Math.sqrt(Math.max(0, 1 - fy * fy));
        const fTheta = i * golden;
        let hx = Math.cos(fTheta) * fr;
        let hy = fy;
        let hz = Math.sin(fTheta) * fr;

        const jawTaper = hy < 0 ? (1.0 + hy * 0.28) : (1.0 - hy * 0.06);
        hx *= 0.66 * jawTaper;
        hy *= 0.86;
        hz *= 0.74;

        if (hz > 0.15) {
          const brow = Math.exp(-Math.pow((hy - 0.18) * 6.5, 2.0)) * Math.exp(-Math.pow(hx * 2.2, 2.0)) * 0.11;
          const eyeL = Math.exp(-Math.pow((hx + 0.22) * 7.5, 2.0) - Math.pow((hy - 0.08) * 9.0, 2.0)) * 0.12;
          const eyeR = Math.exp(-Math.pow((hx - 0.22) * 7.5, 2.0) - Math.pow((hy - 0.08) * 9.0, 2.0)) * 0.12;
          const nose = Math.exp(-Math.pow(hx * 9.5, 2.0)) * Math.exp(-Math.pow((hy + 0.06) * 4.2, 2.0)) * (0.18 - hy * 0.08);
          const cheeks = Math.exp(-Math.pow((Math.abs(hx) - 0.30) * 5.0, 2.0) - Math.pow((hy + 0.10) * 5.0, 2.0)) * 0.08;
          const lips = Math.exp(-Math.pow(hx * 5.5, 2.0) - Math.pow((hy + 0.34) * 11.0, 2.0)) * 0.09;
          const chin = Math.exp(-Math.pow(hx * 4.5, 2.0) - Math.pow((hy + 0.62) * 6.0, 2.0)) * 0.10;
          hz += brow - eyeL - eyeR + nose + cheeks + lips + chin;
        }
        const sHead = 0.92 + 0.08 * shell;
        x = hx * sHead;
        y = hy * sHead + 0.26;
        z = hz * sHead;
        const n = computeNormal(hx, hy, hz);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else if (frac < 0.80) {
        const nFrac = (frac - 0.68) / 0.12;
        const ang = i * golden;
        const rad = (0.31 + 0.04 * (1 - nFrac)) * (0.85 + 0.15 * shell);
        x = Math.cos(ang) * rad;
        y = -0.45 - nFrac * 0.32;
        z = Math.sin(ang) * rad * 0.88 - 0.04;
        const n = computeNormal(x, 0.1, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        const sFrac = (frac - 0.80) / 0.20;
        const uS = (sFrac - 0.5) * 2.0;
        const vS = ((i * 0.6180339) % 1) * Math.PI * 2;
        const width = 1.38;
        const depth = 0.42 * (1 - Math.abs(uS) * 0.45);
        x = uS * width;
        y = -0.78 - Math.pow(uS, 2.0) * 0.22 + Math.sin(vS) * 0.16 * shell;
        z = Math.cos(vS) * depth * shell;
        const n = computeNormal(uS * 0.3, Math.sin(vS), Math.cos(vS));
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "galaxy") {
      /* 3D Saturn Planet with Tilted Rings */
      const tiltX = 0.42, tiltZ = 0.22;
      const cx = Math.cos(tiltX), sx = Math.sin(tiltX);
      const cz = Math.cos(tiltZ), sz = Math.sin(tiltZ);
      let px = 0, py = 0, pz = 0, pnx = 0, pny = 1, pnz = 0;

      if (frac < 0.42) {
        const pFrac = frac / 0.42;
        const lat = 1 - 2 * pFrac;
        const rLat = Math.sqrt(Math.max(0, 1 - lat * lat));
        const lon = i * golden;
        const band = 1.0 + 0.025 * Math.cos(lat * 18.0);
        const rad = 0.64 * (0.82 + 0.18 * shell) * band;
        px = Math.cos(lon) * rLat * rad;
        py = lat * rad * 0.88;
        pz = Math.sin(lon) * rLat * rad;
        const n = computeNormal(px, py / 0.88, pz);
        pnx = n[0]; pny = n[1]; pnz = n[2];
      } else {
        const rFrac = (frac - 0.42) / 0.58;
        const ang = i * golden;
        let ringR = 0.84 + rFrac * 0.96;
        if (ringR > 1.31 && ringR < 1.39) {
          ringR = ringR < 1.35 ? 1.29 : 1.41;
        }
        px = Math.cos(ang) * ringR;
        py = ((i % 9) - 4) * 0.004 * shell;
        pz = Math.sin(ang) * ringR;
        pnx = Math.cos(ang) * 0.2; pny = py >= 0 ? 0.98 : -0.98; pnz = Math.sin(ang) * 0.2;
      }
      const y1 = py * cx - pz * sx;
      const z1 = py * sx + pz * cx;
      x = px * cz - y1 * sz;
      y = px * sz + y1 * cz;
      z = z1;

      const ny1 = pny * cx - pnz * sx;
      const nz1 = pny * sx + pnz * cx;
      nx = pnx * cz - ny1 * sz;
      ny = pnx * sz + ny1 * cz;
      nz = nz1;
    } else if (shapeName === "infinity") {
      /* 3D Beating Heart */
      const u = frac * Math.PI;
      const v = i * golden;
      const sinU = Math.sin(u), cosU = Math.cos(u);
      const sinV = Math.sin(v), cosV = Math.cos(v);
      const sH = 0.078 * (0.74 + 0.26 * shell);
      const hx = 16.0 * Math.pow(sinU, 3.0) * cosV;
      const hy = 13.0 * cosU - 5.0 * Math.cos(2.0 * u) - 2.0 * Math.cos(3.0 * u) - Math.cos(4.0 * u);
      const hz = 10.0 * Math.pow(sinU, 3.0) * sinV;
      x = hx * sH * 1.08;
      y = (hy * sH) + 0.12;
      z = hz * sH * 0.95;
      const n = computeNormal(x, y - 0.12, z * 1.4);
      nx = n[0]; ny = n[1]; nz = n[2];
    } else if (shapeName === "torus") {
      /* 3D Arc Reactor */
      if (frac < 0.20) {
        const rFrac = Math.sqrt(frac / 0.20) * 0.42;
        const ang = i * golden;
        x = Math.cos(ang) * rFrac;
        y = Math.sin(ang) * rFrac;
        z = (shell - 0.5) * 0.20 + 0.08 * Math.cos(rFrac * 6.0);
        const n = computeNormal(x * 0.4, y * 0.4, 1.0);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        const u = ((i * 0.6180339) % 1) * Math.PI * 2;
        const v = frac * Math.PI * 2;
        const isCoilGap = Math.sin(v * 10.0) > 0.72;
        const R = 1.02;
        const r = (isCoilGap ? 0.24 : 0.34) * (0.76 + 0.24 * shell);
        x = (R + r * Math.cos(u)) * Math.cos(v);
        y = (R + r * Math.cos(u)) * Math.sin(v);
        z = r * Math.sin(u) * 0.85;
        const n = computeNormal(Math.cos(u) * Math.cos(v), Math.cos(u) * Math.sin(v), Math.sin(u));
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "helix") {
      /* 3D DNA Molecule */
      const mode = i % 3;
      const t = (frac - 0.5) * 3.1;
      const ang = frac * Math.PI * 6.5;
      const tubeR = 0.13 * shell;
      if (mode < 2) {
        const phase = mode * Math.PI;
        const bx = Math.cos(ang + phase) * 0.82;
        const by = t * 0.94;
        const bz = Math.sin(ang + phase) * 0.82;
        x = bx + ux * tubeR;
        y = by + uy * tubeR;
        z = bz + uz * tubeR;
        const n = computeNormal(ux, uy, uz);
        nx = n[0]; ny = n[1]; nz = n[2];
      } else {
        const rungIdx = (Math.floor(frac * 22) + 0.5) / 22;
        const rAng = rungIdx * Math.PI * 6.5;
        const rT = (rungIdx - 0.5) * 3.1;
        const bridge = ((i * 0.37) % 1) * 2 - 1;
        const atomBulge = 0.055 * (1 + 0.6 * Math.cos(bridge * Math.PI * 3));
        x = Math.cos(rAng) * 0.80 * bridge + ux * atomBulge;
        y = rT * 0.94 + uy * atomBulge;
        z = Math.sin(rAng) * 0.80 * bridge + uz * atomBulge;
        const n = computeNormal(ux, uy, uz);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "hypercube") {
      /* 3D Hourglass */
      if (frac < 0.72) {
        const hFrac = (frac / 0.72) * 2 - 1;
        const ang = i * golden;
        const profileR = (0.12 + 0.78 * Math.pow(Math.abs(hFrac), 0.85)) * (1.0 - 0.18 * Math.pow(hFrac, 4.0));
        const r = profileR * (0.92 + 0.08 * shell);
        x = Math.cos(ang) * r;
        y = hFrac * 1.12;
        z = Math.sin(ang) * r;
        const n = computeNormal(Math.cos(ang), -hFrac * 0.5, Math.sin(ang));
        nx = n[0]; ny = n[1]; nz = n[2];
      } else if (frac < 0.88) {
        const capSide = (i % 2 === 0) ? 1 : -1;
        const cFrac = (frac - 0.72) / 0.16;
        const ang = i * golden;
        const r = Math.sqrt(cFrac) * 0.88;
        x = Math.cos(ang) * r;
        y = capSide * (1.12 + (shell - 0.5) * 0.06);
        z = Math.sin(ang) * r;
        nx = 0; ny = capSide; nz = 0;
      } else {
        const sFrac = (frac - 0.88) / 0.12;
        const ang = i * golden;
        if (sFrac < 0.45) {
          const fallY = 0.25 - (sFrac / 0.45) * 1.25;
          const r = 0.042 * shell;
          x = Math.cos(ang) * r;
          y = fallY;
          z = Math.sin(ang) * r;
        } else {
          const mFrac = (sFrac - 0.45) / 0.55;
          const r = mFrac * 0.68 * shell;
          x = Math.cos(ang) * r;
          y = -1.08 + (1 - mFrac) * 0.34 * shell;
          z = Math.sin(ang) * r;
        }
        const n = computeNormal(x, 0.5, z);
        nx = n[0]; ny = n[1]; nz = n[2];
      }
    } else if (shapeName === "merkaba") {
      /* 3D Star Octahedron */
      const tet = i % 2 === 0 ? 1 : -1;
      const p1 = Math.abs(ux + uy + uz);
      const p2 = Math.abs(-ux - uy + uz);
      const p3 = Math.abs(-ux + uy - uz);
      const p4 = Math.abs(ux - uy - uz);
      const d = Math.max(p1, p2, p3, p4, 0.001);
      const r = (1.32 / Math.pow(d, 0.75)) * (0.86 + 0.14 * shell);
      x = ux * r * 1.12;
      y = uy * r * tet * 0.96;
      z = uz * r;
      const n = computeNormal(ux, uy * tet, uz);
      nx = n[0]; ny = n[1]; nz = n[2];
    }

    pos[i * 3]     = x;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = z;
    norm[i * 3]     = nx;
    norm[i * 3 + 1] = ny;
    norm[i * 3 + 2] = nz;
  }
  return sortShapeForOpticalFlow(pos, norm);
}

/* ---------- 3. Pure App-Theme Colour + Ultra-Smooth Optical-Flow Shader ----------
   - Zero foreign hardcoded hues: particles strictly adapt to DEEP, BLUE, CYAN, PURP
     from the active App Theme, emitting their own crisp self-luminous glow.
   - C2-continuous laminar optical flow: silky-smooth, non-blurry movement everywhere. */
const partV = `
uniform float uTime, uRawTime, uAmp, uBass, uHigh, uCyan, uPurple, uBright, uPx, uCamZ;
uniform float uAmoeba, uIsText, uHeartBeat, uMorph, uSplit, uTouchStrength, uShockWave, uFusionFlash;
uniform vec3 uTouchPos, uSwipeVel, uShockOrigin;
uniform vec3 uBlobs[5];
uniform vec3 DEEP, BLUE, CYAN, PURP;

attribute vec3 aTarget;
attribute vec3 aNormal;
attribute vec3 aTargetNormal;
attribute float aRnd;
attribute float aLayer;
attribute float aCluster;

varying vec3 vC;
varying vec3 vDeep;
varying float vA;
varying float vGlow;

/* Ultra-smooth C2-continuous laminar optical flow field (no high-frequency chatter) */
float laminarWave(vec3 p, float t) {
  vec3 q = p * 2.1 + vec3(t * 0.72, -t * 0.58, t * 0.48);
  float g1 = dot(sin(q), cos(q.yzx));
  vec3 q2 = p * 3.4 - vec3(t * 0.95, t * 0.78, -t * 0.65);
  float g2 = dot(sin(q2), cos(q2.zxy));
  return g1 * 0.36 + g2 * 0.14;
}

vec3 opticalFlowCurl(vec3 p, float t, float seed) {
  float phase = seed * 6.2831853;
  float sx = sin(p.y * 2.4 + t * 0.85 + phase * 0.25) * cos(p.z * 2.1 - t * 0.65);
  float sy = sin(p.z * 2.5 - t * 0.75 + phase * 0.25) * cos(p.x * 2.2 + t * 0.70);
  float sz = sin(p.x * 2.3 + t * 0.90 + phase * 0.25) * cos(p.y * 2.4 - t * 0.80);
  return vec3(sx, sy, sz);
}

void main() {
  /* Quintic C2-Continuous Smootherstep Optical-Flow Interpolation:
     6t^5 - 15t^4 + 10t^3 has zero 1st and 2nd derivatives at endpoints,
     giving ultra-smooth acceleration and deceleration with zero jerk! */
  float spatialWave = clamp(0.5 + 0.22 * (position.x + aTarget.x) + 0.18 * (position.y + aTarget.y), 0.0, 1.0);
  float u = clamp((uMorph * 1.28) - spatialWave * 0.28, 0.0, 1.0);
  float m = u * u * u * (u * (u * 6.0 - 15.0) + 10.0);

  vec3 basePos = mix(position, aTarget, m);
  vec3 baseNorm = normalize(mix(aNormal, aTargetNormal, m) + vec3(0.0001));

  /* Smooth laminar optical-flow streamline arc during shape transitions */
  float flowArc = sin(m * 3.14159265);
  vec3 flowStream = opticalFlowCurl(basePos * 0.95, uRawTime * 1.1, aRnd) * (flowArc * 0.24);
  float glideAngle = flowArc * 0.48;
  float ca = cos(glideAngle), sa = sin(glideAngle);
  basePos.xz = mat2(ca, -sa, sa, ca) * basePos.xz;
  basePos += flowStream;

  float len = max(length(basePos), 0.0001);
  vec3 dir = basePos / len;
  float t = uTime;

  /* Continuous Laminar Surface Optical Flow */
  float wave = laminarWave(dir * 1.2 + basePos * 0.25, t);
  float pseudopod = laminarWave(dir * 0.80, t * 0.65);
  vec3 curl = opticalFlowCurl(dir * 1.05, t, aRnd);

  /* Smooth Heartbeat (in Heart mode) or gentle organic breathing */
  float beat = 1.0
    + uHeartBeat * 0.10 * (pow(max(0.0, sin(uRawTime * 5.0)), 6.0) + 0.4 * pow(max(0.0, sin(uRawTime * 5.0 - 0.65)), 8.0))
    + (1.0 - uIsText) * 0.04 * sin(uRawTime * 1.35 + dir.x * 1.4)
    + uFusionFlash * 0.14 * cos(dir.x * 4.0 + dir.y * 4.0);

  float shellDisplace = (wave * 0.25 + pseudopod * 0.16) * uAmoeba * (0.40 + 0.68 * aLayer);
  float audioDisplace = (1.0 - uIsText * 0.78) * (
    uAmp * (0.14 + 0.16 * aLayer)
    + uBass * 0.12 * sin(dir.y * 4.5 + t * 2.8)
    + uHigh * 0.06 * cos(dir.x * 6.0 - uRawTime * 4.0)
  );

  /* Delicate, ultra-smooth breathing wave on 3D Text ("WELCOME / JARVIS / by sukant" & "DONE") */
  vec3 textFlow = vec3(
    sin(uRawTime * 1.8 + basePos.y * 2.2) * 0.005,
    cos(uRawTime * 1.6 + basePos.x * 2.0) * 0.006,
    sin(uRawTime * 2.0 + basePos.x * 1.8) * 0.012
  ) * uIsText;

  vec3 pos = basePos * (beat + shellDisplace + audioDisplace)
    + curl * (0.055 * uAmoeba + 0.035 * uHigh * (1.0 - uIsText))
    + textFlow;

  /* 5-Node Amoeba Fission & Smooth Re-Joining */
  int cIdx = int(clamp(aCluster, 0.0, 4.0));
  vec3 blobOffset = vec3(0.0);
  if (cIdx == 0) blobOffset = uBlobs[0];
  else if (cIdx == 1) blobOffset = uBlobs[1];
  else if (cIdx == 2) blobOffset = uBlobs[2];
  else if (cIdx == 3) blobOffset = uBlobs[3];
  else blobOffset = uBlobs[4];

  if (uSplit > 0.001) {
    float isStreamBridge = step(0.84, aRnd);
    float subScale = mix(1.0, 0.46, uSplit * (1.0 - isStreamBridge * 0.65));
    vec3 localGlide = opticalFlowCurl(dir * 1.5, uRawTime * 2.0 + aCluster * 1.8, aRnd) * (0.12 * uSplit);

    float packetT = 0.5 + 0.5 * sin(uRawTime * 1.6 + aRnd * 6.28318);
    int nextIdx = int(mod(aCluster + 1.0, 5.0));
    vec3 nextBlob = uBlobs[0];
    if (nextIdx == 1) nextBlob = uBlobs[1];
    else if (nextIdx == 2) nextBlob = uBlobs[2];
    else if (nextIdx == 3) nextBlob = uBlobs[3];
    else if (nextIdx == 4) nextBlob = uBlobs[4];

    vec3 bridgePos = mix(blobOffset, nextBlob, packetT)
      + vec3(0.0, sin(packetT * 3.14159) * 0.16 * sin(uRawTime * 2.4 + aCluster), 0.0);

    vec3 finalOffset = mix(blobOffset, bridgePos, isStreamBridge);
    pos = pos * subScale + finalOffset + localGlide;
  }

  /* Smooth 3D Ripple Wave on Touch */
  float shockHighlight = 0.0;
  if (uShockWave < 4.2) {
    float distShock = length(pos - uShockOrigin);
    float ringDist = distShock - uShockWave;
    float waveEnv = exp(-ringDist * ringDist * 12.0) * (1.0 - uShockWave / 4.2);
    shockHighlight = waveEnv;
    pos += normalize(pos - uShockOrigin + vec3(0.0001)) * (waveEnv * sin(ringDist * 14.0) * 0.22);
  }

  /* Silky Optical-Flow Touch Cleavage & Swirl */
  float touchEnergy = 0.0;
  if (uTouchStrength > 0.001) {
    vec3 toP = pos - uTouchPos;
    float dist = length(toP);
    float field = exp(-dist * dist * 1.35) * uTouchStrength;
    touchEnergy = field;
    vec3 radDir = normalize(toP + vec3(0.0001, 0.0002, 0.0001));
    vec3 orbitSwirl = cross(radDir, vec3(0.0, 0.0, 1.0));
    pos += (radDir * 0.78 + orbitSwirl * 0.58 + uSwipeVel * 0.68) * field * (0.75 + 0.5 * aLayer);
  }

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  float depth = smoothstep(-1.6, 1.6, mv.z + uCamZ);

  /* 3D Surface Normal Lighting & Self-Glow Factor */
  vec3 worldNorm = normalize(normalMatrix * baseNorm);
  vec3 keyLight = normalize(vec3(-0.4, 0.65, 0.85));
  vec3 fillLight = normalize(vec3(0.55, -0.35, 0.55));
  float diffKey = max(0.0, dot(worldNorm, keyLight));
  float diffFill = max(0.0, dot(worldNorm, fillLight));
  float rimLight = pow(1.0 - min(1.0, abs(worldNorm.z)), 2.0);

  /* vGlow controls the particle's own internal luminescence without altering the App Theme hue */
  vGlow = 0.38 + pow(diffKey, 7.0) * 0.52 + rimLight * 0.45 + touchEnergy * 0.55 + shockHighlight * 0.50 + uFusionFlash * 0.45;
  vDeep = DEEP;
  vA = mix(0.40, 0.98, depth) * mix(0.82, 1.0, aLayer);

  /* STRICT SINGLE APP-THEME COLOUR:
     Particles have NO independent colours of their own. Every particle uses ONLY
     the active App Theme Colour (BLUE) shaded by 3D depth (DEEP) and self-glow (CYAN, same hue). */
  float shade = clamp(0.36 + 0.46 * diffKey + 0.18 * diffFill, 0.0, 1.0);
  vec3 c = mix(DEEP, BLUE, shade);
  float glowHighlight = clamp(rimLight * 0.32 + touchEnergy * 0.42 + shockHighlight * 0.42 + uFusionFlash * 0.35, 0.0, 0.72);
  c = mix(c, CYAN, glowHighlight);
  vC = c * mix(0.84, 1.06, depth);

  /* Crisp, sharp particle sizing (never blurry) */
  float sizeMode = mix(0.0080 + aRnd * 0.0135, 0.0068 + aRnd * 0.0080, uIsText);
  float ptSize = sizeMode
    * mix(1.15, 0.96, aLayer)
    * (1.0 + uAmp * 0.48 + uBass * 0.24 + uSplit * 0.16 + touchEnergy * 0.35);
  gl_PointSize = max(ptSize * uPx / (-mv.z) * mix(0.88, 1.25, depth), 1.75);
  gl_Position = projectionMatrix * mv;
}
`;

const dotF = `
precision highp float;
uniform vec3 CYAN;
varying vec3 vC;
varying vec3 vDeep;

void main() {
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;

  /* Crisp, non-blurry particle core with its own tight self-luminous glow halo in the exact App Theme colour */
  float sharpCore = smoothstep(0.46, 0.14, d);
  float selfGlow = exp(-d * d * 15.0) * vGlow;
  float alpha = clamp((sharpCore * 0.90 + selfGlow * 0.46) * vA, 0.0, 0.96);

  /* Pure single App Theme colour with self-glow luminance — never clips to white or shifts hue */
  vec3 glowCol = mix(vC, CYAN, clamp(selfGlow * 0.58, 0.0, 0.78));
  vec3 col = mix(vDeep * 0.82, glowCol, smoothstep(0.48, 0.10, d));
  gl_FragColor = vec4(col, alpha);
}
`;

function buildParticles() {
  const welcomeData = shapeCache.welcome;
  const initialPos = new Float32Array(welcomeData.pos);
  const targetPos = new Float32Array(welcomeData.pos);
  const initialNorm = new Float32Array(welcomeData.norm);
  const targetNorm = new Float32Array(welcomeData.norm);

  const rnd = new Float32Array(COUNT);
  const layer = new Float32Array(COUNT);
  const cluster = new Float32Array(COUNT);

  const amoebaPos = shapeCache.amoeba.pos;
  for (let i = 0; i < COUNT; i++) {
    rnd[i] = (i * 0.6180339887) % 1;
    const layerSeed = (i * 0.381966011) % 1;
    layer[i] = layerSeed < 0.16 ? 0.20 : layerSeed < 0.48 ? 0.58 : 0.95;

    const px = amoebaPos[i * 3], py = amoebaPos[i * 3 + 1], pz = amoebaPos[i * 3 + 2];
    const ang = Math.atan2(py, px) + (pz * 0.35);
    const bucket = Math.floor(((ang + Math.PI) / (Math.PI * 2)) * MAX_BLOBS) % MAX_BLOBS;
    cluster[i] = (bucket + MAX_BLOBS) % MAX_BLOBS;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(initialPos, 3));
  g.setAttribute("aTarget", new THREE.BufferAttribute(targetPos, 3));
  g.setAttribute("aNormal", new THREE.BufferAttribute(initialNorm, 3));
  g.setAttribute("aTargetNormal", new THREE.BufferAttribute(targetNorm, 3));
  g.setAttribute("aRnd", new THREE.BufferAttribute(rnd, 1));
  g.setAttribute("aLayer", new THREE.BufferAttribute(layer, 1));
  g.setAttribute("aCluster", new THREE.BufferAttribute(cluster, 1));

  const mat = new THREE.ShaderMaterial({
    vertexShader: partV,
    fragmentShader: dotF,
    uniforms: U,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  const p = new THREE.Points(g, mat);
  p.frustumCulled = false;
  p.renderOrder = 3;
  return p;
}

const pointsMesh = buildParticles();
orb.add(pointsMesh);

let arcMesh, arcMeta = [];
function createPlasmaArcs() {
  const totalVerts = ARC_CHAINS * ARC_SEGS * 2;
  const pos = new Float32Array(totalVerts * 3);
  const col = new Float32Array(totalVerts * 3);

  for (let s = 0; s < ARC_CHAINS; s++) {
    const a1 = (s / ARC_CHAINS) * Math.PI * 2;
    const a2 = a1 + 0.9 + (s % 3) * 0.4;
    arcMeta.push({
      bA: s % MAX_BLOBS,
      bB: (s + 1 + (s % 2)) % MAX_BLOBS,
      offA: new THREE.Vector3(Math.cos(a1) * 0.36, Math.sin(a1) * 0.26, Math.sin(a1 * 2) * 0.22),
      offB: new THREE.Vector3(Math.cos(a2) * 0.36, Math.sin(a2) * 0.26, Math.cos(a2 * 2) * 0.22),
      phase: s * 0.91,
      freq: 1.4 + (s % 4) * 0.35
    });
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.42,
    depthWrite: false,
    blending: THREE.NormalBlending
  });
  arcMesh = new THREE.LineSegments(g, mat);
  arcMesh.frustumCulled = false;
  arcMesh.renderOrder = 2;
  orb.add(arcMesh);
}

function createGlow() {
  glowMat = new THREE.ShaderMaterial({
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `
      varying vec2 vUv;
      uniform float uTime, uStrength, uMix;
      uniform vec3 uA, uB, uC;
      void main() {
        vec2 c = (vUv - 0.5) * vec2(1.0, 1.32);
        float d = length(c) * 2.0;
        float a = atan(c.y, c.x);
        float g = (d > 0.56 ? exp(-(d - 0.56) * 5.8) * 0.68 : 0.0) * smoothstep(1.0, 0.72, d);

        /* Strictly uses App Theme uniforms uA (BLUE), uB (PURP), uC (CYAN) */
        vec3 col = mix(uA, uB, 0.5 + 0.5 * sin(a + uTime * 0.5));
        col = mix(col, uC, uMix * (0.5 + 0.5 * sin(a * 2.0 - uTime * 0.65)));
        gl_FragColor = vec4(col, clamp(g * uStrength * 0.42, 0.0, 0.45));
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    uniforms: {
      uTime: { value: 0 },
      uStrength: { value: 0.58 },
      uMix: { value: 0.50 },
      uA: U.BLUE,
      uB: U.PURP,
      uC: U.CYAN
    }
  });
  glow = new THREE.Mesh(new THREE.PlaneGeometry(VIS * 1.30, VIS * 1.08), glowMat);
  glow.position.z = -0.15;
  glow.renderOrder = -2;
  scene.add(glow);
}

function createOrbitSpores() {

  for (let i = 0; i < ORBIT_COUNT; i++) {
    size[i] = 0.018 + Math.random() * 0.038;
    ptData.push({
      a: Math.random() * 6.283,
      r: 1.44 + Math.random() * 0.72,
      sp: (0.10 + Math.random() * 0.20) * (Math.random() < 0.5 ? -1 : 1),
      ph: Math.random() * 6.283,
      tilt: (Math.random() - 0.5) * 1.25,
      y: (Math.random() - 0.5) * 1.12,

    });

  const g = new THREE.BufferGeometry();

  g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
  g.setAttribute("aAlpha", new THREE.BufferAttribute(alpha, 1));
  g.setAttribute("aColor", new THREE.BufferAttribute(color, 3));

  orbitPts = new THREE.Points(

    new THREE.ShaderMaterial({
      vertexShader: "attribute float aSize, aAlpha; attribute vec3 aColor; uniform float uPx; uniform vec3 DEEP; varying float vA; varying vec3 vC; varying vec3 vDeep; varying float vGlow; void main(){ vA = aAlpha; vC = aColor; vDeep = DEEP; vGlow = 0.6; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = max(aSize * uPx / (-mv.z), 1.5); gl_Position = projectionMatrix * mv; }",
      fragmentShader: dotF,
      transparent: true,

let targetAmoebaFactor = 0.02;
let targetIsText = 1.0;
let targetHeartBeat = 0.0;

function morphToShapeData(shapeObj, labelText, shapeKey) {
  const posAttr = pointsMesh.geometry.attributes.position;
  const tgtAttr = pointsMesh.geometry.attributes.aTarget;
  const normAttr = pointsMesh.geometry.attributes.aNormal;
  const tgtNormAttr = pointsMesh.geometry.attributes.aTargetNormal;
  const curM = U.uMorph.value;

  if (curM > 0.001) {
    /* Quintic smootherstep bake for seamless mid-flight transitions */
    const u = curM;
    const smoothM = u * u * u * (u * (u * 6 - 15) + 10);
    const pArr = posAttr.array, tArr = tgtAttr.array;
    const nArr = normAttr.array, tnArr = tgtNormAttr.array;
    for (let i = 0; i < pArr.length; i++) {
      pArr[i] = pArr[i] + (tArr[i] - pArr[i]) * smoothM;
      nArr[i] = nArr[i] + (tnArr[i] - nArr[i]) * smoothM;
    }
    posAttr.needsUpdate = true;
    normAttr.needsUpdate = true;
  }

  tgtAttr.array.set(shapeObj.pos);
  tgtAttr.needsUpdate = true;
  tgtNormAttr.array.set(shapeObj.norm);
  tgtNormAttr.needsUpdate = true;

  U.uMorph.value = 0;
  morphProgress = 0;
  morphActive = true;

  const isTextShape = (shapeKey === "welcome" || shapeKey === "done" || shapeKey === "custom_text");
  targetIsText = isTextShape ? 1.0 : 0.0;
  targetAmoebaFactor = shapeKey === "amoeba" ? 1.0 : isTextShape ? 0.02 : 0.12;
  targetHeartBeat = shapeKey === "infinity" ? 1.0 : 0.0;

  const lbl = $("#shapeLabel");
  if (lbl && labelText) lbl.textContent = labelText;
}

function triggerAmoebaSplit(worldHitPoint, lobeCount) {
  if (currentShape === "welcome" || currentShape === "done" || currentShape === "custom_text") {
    messageHoldTimer = 0;
    setOrbShape("amoeba");
  }
  activeLobes = lobeCount || 5;
  splitTimer = 3.0;
  splitAmount = Math.max(splitAmount, 0.38);
  wasSplit = true;

  const hit = worldHitPoint || new THREE.Vector3(0, 0, 0);
  shockOrigin.copy(hit);
  shockWave = 0.0;

  const baseAngle = Math.random() * Math.PI * 2;
  for (let i = 0; i < MAX_BLOBS; i++) {
    const b = blobs[i];
    const ang = baseAngle + (i * Math.PI * 2) / MAX_BLOBS;
    b.orbitAngle = ang;
    const dist = 1.02 + (i % 2) * 0.22;
    const rx = Math.cos(ang) * dist * 1.28;
    const ry = Math.sin(ang) * dist * 0.92;
    const rz = ((i % 3) - 1) * 0.38;

    b.targetOffset.set(rx, ry, rz);
    const pushX = rx - hit.x * 0.55;
    const pushY = ry - hit.y * 0.55;
    b.vel.x += pushX * 3.2;
    b.vel.y += pushY * 3.2;
    b.vel.z += rz * 2.4;
  }
}

/* ---------- Pure Single App-Theme Colour System (No Independent Particle Colours) ---------- */
/* Given a single App Theme hex colour, builds a 100% monochromatic palette in that EXACT hue:
   - DEEP: Darker shade of the exact same App Theme hue for 3D depth
   - BLUE: Exact App Theme colour
   - CYAN: Self-glow highlight of the exact same App Theme hue (zero hue shift)
   - PURP: Mid-tone of the exact same App Theme hue (zero hue shift) */
function buildSingleColorPalette(hexColor) {
  const c = new THREE.Color(hexColor);
  const hsl = { h: 0, s: 0, l: 0 };
  c.getHSL(hsl);
  if (hsl.s < 0.04) {
    /* Neutral / monochrome white-silver app theme */
    const baseL = Math.max(0.45, Math.min(0.75, hsl.l));
    const cDeep = new THREE.Color().setHSL(0, 0, Math.max(0.22, baseL * 0.55));
    const cMain = new THREE.Color().setHSL(0, 0, baseL);
    const cGlow = new THREE.Color().setHSL(0, 0, Math.min(0.92, baseL + 0.20));
    return [
      [cDeep.r, cDeep.g, cDeep.b],
      [cMain.r, cMain.g, cMain.b],
      [cGlow.r, cGlow.g, cGlow.b],
      [cMain.r, cMain.g, cMain.b]
    ];
  }
  const h = hsl.h;
  const s = Math.max(0.75, hsl.s);
  const lMain = Math.max(0.44, Math.min(0.62, hsl.l));
  const cDeep = new THREE.Color().setHSL(h, Math.min(1.0, s * 1.05), Math.max(0.16, lMain * 0.48));
  const cMain = new THREE.Color().setHSL(h, s, lMain);
  const cGlow = new THREE.Color().setHSL(h, Math.min(1.0, s), Math.min(0.80, lMain + 0.18));
  return [
    [cDeep.r, cDeep.g, cDeep.b],
    [cMain.r, cMain.g, cMain.b],
    [cGlow.r, cGlow.g, cGlow.b],
    [cMain.r, cMain.g, cMain.b]
  ];
}

function readHostCssThemeColor() {
  try {
    const roots = [document.documentElement, document.body];
    if (window.parent && window.parent !== window && window.parent.document) {
      roots.unshift(window.parent.document.documentElement, window.parent.document.body);
    }
    const varNames = ["--app-color", "--theme-color", "--primary-color", "--primary", "--accent-color", "--accent", "--orb-color", "--color-primary", "--t1"];
    for (const el of roots) {
      if (!el) continue;
      const cs = window.getComputedStyle(el);
      for (const v of varNames) {
        const val = cs.getPropertyValue(v).trim();
        if (val && val !== "transparent" && val !== "inherit" && val !== "initial") {
          return val;
        }
      }
    }
  } catch (e) {}
  return null;
}

function applyTheme(name, custom, custom2, lightOverride) {
  if (name && THEMES[name.toLowerCase()]) {
    name = name.toLowerCase();
  } else if (name && !custom) {
    /* If name is actually a hex/rgb/css color passed to setTheme('#...'), treat it as custom App Theme colour */
    custom = name;
    name = null;
  }

  let t = (name && THEMES[name]) ? THEMES[name] : THEMES.light;

  if (custom || custom2) {
    const c1 = custom ? new THREE.Color(custom) : null;
    const c2 = custom2 ? new THREE.Color(custom2) : null;
    const hsl1 = { h: 0, s: 0, l: 0 };
    const hsl2 = { h: 0, s: 0, l: 0 };
    if (c1) c1.getHSL(hsl1);
    if (c2) c2.getHSL(hsl2);

    const bgCol = c1 || c2;
    const L = 0.299 * bgCol.r + 0.587 * bgCol.g + 0.114 * bgCol.b;
    const light = typeof lightOverride === "boolean" ? lightOverride : L > 0.55;

    /* Choose the active App Theme Colour:
       1. If custom2 (theme accent) is provided and has saturation, use custom2.
       2. Otherwise if custom has saturation, use custom.
       3. Otherwise if custom2 is provided, use custom2, else fall back to activeAppColorHex. */
    let chosenHex = activeAppColorHex;
    if (c2 && hsl2.s >= 0.04) {
      chosenHex = "#" + c2.getHexString();
    } else if (c1 && hsl1.s >= 0.04) {
      chosenHex = "#" + c1.getHexString();
    } else if (c2) {
      chosenHex = "#" + c2.getHexString();
    } else {
      const cssCol = readHostCssThemeColor();
      if (cssCol) chosenHex = cssCol;
    }

    activeAppColorHex = chosenHex;
    const pal = buildSingleColorPalette(chosenHex);
    const mainHex = "#" + new THREE.Color(pal[1][0], pal[1][1], pal[1][2]).getHexString();

    const baseTheme = light ? THEMES.light : THEMES.dark;
    t = Object.assign({}, baseTheme, {
      bg: custom || "transparent",
      fg: light ? "#0f172a" : "#ffffff",
      sub: light ? "#475569" : "#cbd5e1",
      glass: light ? "rgba(255,255,255,0.68)" : "rgba(15,22,48,0.62)",
      gb: light ? "rgba(255,255,255,0.88)" : "rgba(255,255,255,0.22)",
      chip: light ? "#1e293b" : "#f1f5f9",
      pal: pal,
      add: !light,
      t: [mainHex, mainHex, mainHex]
    });
    name = null;
  } else if (name && THEMES[name]) {
    activeAppColorHex = THEMES[name].t[0];
  }

  themeName = name || themeName;
  const r = document.documentElement.style;
  if (!isEmbedded) {
    r.setProperty("--bg", t.bg);
    document.body.style.background = t.bg;
  } else {
    r.setProperty("--bg", "transparent");
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
  }
  r.setProperty("--fg", t.fg);
  r.setProperty("--sub", t.sub);
  r.setProperty("--glass", t.glass);
  r.setProperty("--gb", t.gb);
  r.setProperty("--chip", t.chip);
  r.setProperty("--t1", t.t[0]);
  r.setProperty("--t2", t.t[0]);
  r.setProperty("--t3", t.t[0]);
  r.setProperty("--sh", t.sh);

  /* Store the single active App Theme Colour on window so 2D touch sparks use the exact same colour */
  window.__jarvisThemeCols = [t.t[0], t.t[0], t.t[0]];
  window.__jarvisThemeColor = t.t[0];

  ["DEEP", "BLUE", "CYAN", "PURP"].forEach((k, i) => U[k].value.setRGB(t.pal[i][0], t.pal[i][1], t.pal[i][2]));
  const oc = orbitPts.geometry.attributes.aColor;
  /* Every orbital spore uses the exact same App Theme Colour — no per-particle colour differences */
  for (let i = 0; i < ORBIT_COUNT; i++) {
    oc.setXYZ(i, t.pal[1][0], t.pal[1][1], t.pal[1][2]);
  }
  oc.needsUpdate = true;
  setBlend(t.add);

  document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", !custom && b.dataset.t === themeName));
}

/* ---------- Voice / AI State & Automatic "DONE" Particle Formation ---------- */
let state = "idle", working = false;
const cur = Object.assign({}, STATES.idle), tgt = Object.assign({}, STATES.idle);

function setOrbState(s, skipDoneTrigger) {
  if (!STATES[s]) return;
  const prevState = state;
  state = s;
  Object.assign(tgt, STATES[s]);
  shockOrigin.set(0, 0, 0);
  shockWave = 0.0;

  if (!skipDoneTrigger && s === "idle" && (prevState === "speaking" || prevState === "thinking" || prevState === "listening")) {
    showDoneMessage(2.8);
  } else if (s === "listening" || s === "speaking" || s === "talking" || s === "thinking" || s === "working") {
    if (currentShape === "welcome" || currentShape === "done") {
      messageHoldTimer = 0;
      setOrbShape("amoeba");
    }
  }

  const lbl = $("#stext");
  if (lbl) lbl.textContent = LABELS[s] || "AMOEBA READY";
  document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === s));
}

/* ---------- Audio (Simulated, Web Mic, or External Native Bridge) ---------- */
const audio = { level: 0, bass: 0, high: 0 };
let actx = null, analyser = null, micStream = null, freq = null, micOn = false;
let externalAudioTime = 0;
const extAudio = { level: 0, bass: 0, high: 0 };

function setExternalAudio(level, bass, high) {
  const l = Math.max(0, Math.min(1, Number(level) || 0));
  extAudio.level = l;
  extAudio.bass = Math.max(0, Math.min(1, bass !== undefined && bass !== null ? Number(bass) : l));
  extAudio.high = Math.max(0, Math.min(1, high !== undefined && high !== null ? Number(high) : l));
  externalAudioTime = performance.now();
}

function toast(m) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("show"), 2600);
}

function updateMicUI() {
  const b = $("#mic");
  if (b) {
    b.classList.toggle("on", micOn);
    b.textContent = micOn ? "MIC ON" : "MIC TEST";
  }
}

async function startAudioReactive() {
  if (micOn) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    actx = new AC();
    if (actx.state === "suspended") await actx.resume();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.84;
    actx.createMediaStreamSource(micStream).connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    micOn = true;
    updateMicUI();
    return true;
  } catch (e) {
    micOn = false;
    updateMicUI();
    toast("Microphone unavailable — using simulated voice harmonics");
    return false;
  }
}

function stopAudioReactive() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (actx && actx.close) actx.close().catch(() => {});
  micStream = null;
  actx = null;
  analyser = null;
  micOn = false;
  updateMicUI();
}

function simulateAudio(t) {
  let l, b, h;
  if (state === "speaking" || state === "talking") {
    const syl = Math.pow(Math.abs(Math.sin(t * 6.2) * Math.sin(t * 2.0 + 1)), 0.8);
    const gate = Math.sin(t * 0.9) > -0.68 ? 1 : 0.16;
    l = (0.30 + 0.46 * syl) * gate;
    b = l * (0.68 + 0.32 * Math.sin(t * 4.2));
    h = l * (0.52 + 0.48 * Math.sin(t * 8.5));
  } else if (state === "listening") {
    l = 0.22 + 0.18 * Math.abs(Math.sin(t * 2.8) * Math.sin(t * 1.2));
    b = l * 0.85;
    h = l * 0.55;
  } else if (state === "thinking" || state === "working") {
    l = 0.16 + 0.09 * Math.sin(t * 2.2);
    b = l * 0.75;
    h = l * 0.70;
  } else {
    l = 0.06 + 0.035 * Math.sin(t * 1.1);
    b = l * 0.9;
    h = l * 0.50;
  }
  return [l, b, h];
}

let wasReceivingVoiceAudio = false;
let silenceAfterVoiceTimer = 0;

function readAudio(t, dt) {
  let l, b, h;
  const hasExternal = (performance.now() - externalAudioTime < 220);
  if (hasExternal) {
    l = extAudio.level;
    b = extAudio.bass;
    h = extAudio.high;
    if (l > 0.22) {
      wasReceivingVoiceAudio = true;
      silenceAfterVoiceTimer = 0;
    } else if (wasReceivingVoiceAudio) {
      silenceAfterVoiceTimer += dt;
      if (silenceAfterVoiceTimer > 0.85) {
        wasReceivingVoiceAudio = false;
        silenceAfterVoiceTimer = 0;
        showDoneMessage(2.8);
      }
    }
  } else if (micOn && analyser) {
    analyser.getByteFrequencyData(freq);
    const avg = (a, z) => {
      let s = 0;
      for (let i = a; i < z; i++) s += freq[i];
      return s / ((z - a) * 255);
    };
    l = Math.min(avg(0, freq.length) * 2.6, 1);
    b = Math.min(avg(0, 6) * 2.2, 1);
    h = Math.min(avg(48, 110) * 2.8, 1);
  } else {
    [l, b, h] = simulateAudio(t);
  }
  /* Ultra-smooth exponential damping on audio levels so particles never jump abruptly */
  const k = 1 - Math.exp(-dt * (l > audio.level ? 14 : 6));
  audio.level += (l - audio.level) * k;
  audio.bass += (b - audio.bass) * k;
  audio.high += (h - audio.high) * k;
}

/* ---------- Touch, Swipe Cleavage & Double-Tap Instant 3D Shape Morph ---------- */
let dragging = false, px = 0, py = 0, velX = 0, velY = 0, lastTapTime = 0;
let pointerNormX = 0, pointerNormY = 0;
let smoothPointerX = 0, smoothPointerY = 0;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hitPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const intersectPt = new THREE.Vector3();
const invOrbMatrix = new THREE.Matrix4();
const prevTouchWorld = new THREE.Vector3();
const targetTouchWorld = new THREE.Vector3();

function screenToOrbLocal(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / Math.max(rect.width, 1)) * 2 - 1;
  ndc.y = -((clientY - rect.top) / Math.max(rect.height, 1)) * 2 + 1;
  pointerNormX = ndc.x;
  pointerNormY = ndc.y;
  raycaster.setFromCamera(ndc, camera);
  raycaster.ray.intersectPlane(hitPlane, intersectPt);
  invOrbMatrix.copy(orb.matrixWorld).invert();
  return intersectPt.clone().applyMatrix4(invOrbMatrix);
}

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  px = e.clientX;
  py = e.clientY;
  canvas.setPointerCapture(e.pointerId);

  const now = performance.now();
  const localHit = screenToOrbLocal(e.clientX, e.clientY);
  prevTouchWorld.copy(localHit);
  targetTouchWorld.copy(localHit);
  touchWorld.copy(localHit);
  touchStrength = 1.40;

  if (now - lastTapTime < 340) {
    splitTimer = 0;
    const cycleList = [...SHAPE_NAMES, "done"];
    const idx = (cycleList.indexOf(currentShape) + 1) % cycleList.length;
    if (cycleList[idx] === "done") showDoneMessage(2.8);
    else setOrbShape(cycleList[idx]);
    autoMorphTimer = 0;
    lastTapTime = 0;
    return;
  }
  lastTapTime = now;

  if (localHit.length() < 2.5) {
    triggerAmoebaSplit(localHit, 5);
  }
});

canvas.addEventListener("pointermove", e => {
  const localHit = screenToOrbLocal(e.clientX, e.clientY);
  targetTouchWorld.copy(localHit);

  const instVel = localHit.clone().sub(prevTouchWorld).multiplyScalar(10.0);
  instVel.clampLength(0, 2.0);
  swipeVelWorld.lerp(instVel, 0.35);
  prevTouchWorld.copy(localHit);

  if (!dragging) {
    if (localHit.length() < 1.9) {
      touchStrength = Math.max(touchStrength, 0.48);
    }
    return;
  }

  const dx = e.clientX - px;
  const dy = e.clientY - py;
  velY += dx * 0.008;
  velX += dy * 0.008;
  px = e.clientX;
  py = e.clientY;

  touchStrength = 1.50;
  if (localHit.length() < 2.75) {
    splitTimer = Math.max(splitTimer, 2.4);
    splitAmount = Math.max(splitAmount, 0.82);
    wasSplit = true;
    blobs[0].targetOffset.set(
      Math.max(-1.55, Math.min(1.55, localHit.x * 0.90)),
      Math.max(-1.25, Math.min(1.25, localHit.y * 0.90)),
      0.18
    );
  }
});

const endDrag = () => {
  dragging = false;
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

window.addEventListener("deviceorientation", e => {
  if (e.gamma !== null && e.beta !== null) {
    pointerNormX = Math.max(-1, Math.min(1, e.gamma / 35));
    pointerNormY = Math.max(-1, Math.min(1, (e.beta - 45) / 35));
  }
}, { passive: true });

/* ---------- Main Animation Loop (With Sub-Frame EMA Delta Smoothing) ---------- */
let time = 0, flow = 0, pxPerUnit = 300;
let glowMul = 0.95;
let smoothDt = 1 / 60;

function updatePlasmaArcs() {
  if (U.uIsText.value > 0.35 && splitAmount < 0.05) {
    arcMesh.visible = false;
    return;
  }
  arcMesh.visible = true;

  const posAttr = arcMesh.geometry.attributes.position;
  const colAttr = arcMesh.geometry.attributes.color;
  const cCyan = U.CYAN.value, cPurp = U.PURP.value, cBlue = U.BLUE.value, cDeep = U.DEEP.value;

  let vIdx = 0;
  for (let s = 0; s < ARC_CHAINS; s++) {
    const meta = arcMeta[s];
    const pA = blobs[meta.bA].pos;
    const pB = (touchStrength > 0.35 && s % 2 === 0) ? touchWorld : blobs[meta.bB].pos;
    const oScale = 0.35 + 0.28 * (1 - splitAmount);

    const ax = pA.x + meta.offA.x * oScale;
    const ay = pA.y + meta.offA.y * oScale;
    const az = pA.z + meta.offA.z * oScale;

    const bx = pB.x + meta.offB.x * oScale;
    const by = pB.y + meta.offB.y * oScale;
    const bz = pB.z + meta.offB.z * oScale;

    /* Smooth laminar Bezier curve control point (no jitter) */
    const mx = (ax + bx) * 0.5 + Math.sin(time * meta.freq + meta.phase) * (0.24 + splitAmount * 0.22);
    const my = (ay + by) * 0.5 + Math.cos(time * meta.freq * 0.9 - meta.phase) * (0.22 + splitAmount * 0.20);
    const mz = (az + bz) * 0.5 + Math.sin(time * meta.freq * 1.1 + meta.phase) * 0.22;

    let prevX = ax, prevY = ay, prevZ = az;
    for (let k = 1; k <= ARC_SEGS; k++) {
      const t = k / ARC_SEGS;
      const inv = 1 - t;
      const curX = inv * inv * ax + 2 * inv * t * mx + t * t * bx;
      const curY = inv * inv * ay + 2 * inv * t * my + t * t * by;
      const curZ = inv * inv * az + 2 * inv * t * mz + t * t * bz;

      posAttr.setXYZ(vIdx, prevX, prevY, prevZ);
      posAttr.setXYZ(vIdx + 1, curX, curY, curZ);

      const waveCol = 0.5 + 0.5 * Math.sin(t * 6.28 - time * 3.2 + meta.phase);
      colAttr.setXYZ(
        vIdx,
        cDeep.r * 0.35 + (cCyan.r * waveCol + cBlue.r * (1 - waveCol)) * 0.65,
        cDeep.g * 0.35 + (cCyan.g * waveCol + cBlue.g * (1 - waveCol)) * 0.65,
        cDeep.b * 0.35 + (cCyan.b * waveCol + cBlue.b * (1 - waveCol)) * 0.65
      );
      colAttr.setXYZ(
        vIdx + 1,
        cDeep.r * 0.35 + (cPurp.r * waveCol + cCyan.r * (1 - waveCol)) * 0.65,
        cDeep.g * 0.35 + (cPurp.g * waveCol + cCyan.g * (1 - waveCol)) * 0.65,
        cDeep.b * 0.35 + (cPurp.b * waveCol + cCyan.b * (1 - waveCol)) * 0.65
      );

      prevX = curX; prevY = curY; prevZ = curZ;
      vIdx += 2;
    }
  }
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
  arcMesh.material.opacity = Math.min(0.68, 0.14 + splitAmount * 0.48 + audio.level * 0.22 + touchStrength * 0.18);
}

function updateOrb(dt) {
  const k = 1 - Math.exp(-dt * 4.0);
  for (const key in cur) cur[key] += (tgt[key] - cur[key]) * k;

  time += dt;
  flow += dt * (cur.speed + audio.level * 0.35);

  smoothPointerX += (pointerNormX - smoothPointerX) * (1 - Math.exp(-dt * 6.0));
  smoothPointerY += (pointerNormY - smoothPointerY) * (1 - Math.exp(-dt * 6.0));
  touchWorld.lerp(targetTouchWorld, 1 - Math.exp(-dt * 18.0));

  readAudio(time, dt);

  if (shockWave < 4.4) {
    shockWave += dt * 2.6;
  }
  U.uShockWave.value = shockWave;
  U.uShockOrigin.value.copy(shockOrigin);

  /* Hold WELCOME (for exact 3.0s on first open) or DONE (after work/speech completes), then glide into Amoeba */
  if (messageHoldTimer > 0) {
    messageHoldTimer -= dt;
    if (messageHoldTimer <= 0) {
      messageHoldTimer = 0;
      setOrbShape("amoeba");
      autoMorphTimer = 0;
    }
  } else if (autoMorph && splitTimer <= 0) {
    autoMorphTimer += dt;
    if (autoMorphTimer > 6.2) {
      autoMorphTimer = 0;
      const idx = (SHAPE_NAMES.indexOf(currentShape) + 1) % SHAPE_NAMES.length;
      setOrbShape(SHAPE_NAMES[idx]);
    }
  }

  /* Smooth Optical-Flow Morph Progression */
  if (morphActive) {
    morphProgress = Math.min(1, morphProgress + dt * 0.68);
    U.uMorph.value = morphProgress;
    if (morphProgress >= 1) {
      const posAttr = pointsMesh.geometry.attributes.position;
      const tgtAttr = pointsMesh.geometry.attributes.aTarget;
      const normAttr = pointsMesh.geometry.attributes.aNormal;
      const tgtNormAttr = pointsMesh.geometry.attributes.aTargetNormal;
      posAttr.array.set(tgtAttr.array);
      posAttr.needsUpdate = true;
      normAttr.array.set(tgtNormAttr.array);
      normAttr.needsUpdate = true;
      U.uMorph.value = 0;
      morphActive = false;
    }
  }

  /* Smooth Fission & Coalescence */
  if (splitTimer > 0) {
    splitTimer -= dt;
    splitAmount += (1.0 - splitAmount) * (1 - Math.exp(-dt * 5.5));
  } else {
    if (wasSplit && splitAmount < 0.35 && splitAmount > 0.08) {
      fusionFlash = 0.85;
      shockOrigin.set(0, 0, 0);
      shockWave = 0.0;
      wasSplit = false;
    }
    splitAmount += (0.0 - splitAmount) * (1 - Math.exp(-dt * 2.4));
  }

  fusionFlash *= Math.exp(-dt * 3.2);
  U.uFusionFlash.value = fusionFlash;

  touchStrength *= Math.exp(-dt * (dragging ? 1.2 : 3.2));
  swipeVelWorld.multiplyScalar(Math.exp(-dt * 6.5));

  for (let i = 0; i < MAX_BLOBS; i++) {
    const b = blobs[i];
    if (splitTimer > 0) {
      if (!(dragging && i === 0)) {
        b.orbitAngle += dt * 0.32 * (i % 2 === 0 ? 1 : -1);
        const dist = 1.02 + (i % 2) * 0.22;
        b.targetOffset.x = Math.cos(b.orbitAngle) * dist * 1.28;
        b.targetOffset.y = Math.sin(b.orbitAngle) * dist * 0.92;
      }
      const wobbleX = Math.cos(time * 1.6 + b.phase) * 0.14;
      const wobbleY = Math.sin(time * 1.9 + b.phase) * 0.12;
      const desiredX = b.targetOffset.x + wobbleX;
      const desiredY = b.targetOffset.y + wobbleY;
      const desiredZ = b.targetOffset.z + Math.sin(time * 1.4 + b.phase) * 0.12;

      b.vel.x += (desiredX - b.pos.x) * 14 * dt;
      b.vel.y += (desiredY - b.pos.y) * 14 * dt;
      b.vel.z += (desiredZ - b.pos.z) * 14 * dt;
    } else {
      const tangX = -b.pos.y * 4.2;
      const tangY = b.pos.x * 4.2;
      b.vel.x += ((0 - b.pos.x) * 20 + tangX) * dt;
      b.vel.y += ((0 - b.pos.y) * 20 + tangY) * dt;
      b.vel.z += (0 - b.pos.z) * 20 * dt;
    }
    const damping = Math.exp(-dt * 4.8);
    b.vel.multiplyScalar(damping);
    b.pos.addScaledVector(b.vel, dt);
    blobCenters[i].copy(b.pos);
  }

  updatePlasmaArcs();

  const idlePulse = Math.pow(Math.max(0, Math.sin(time * 0.55)), 8) * 0.12 * (1 - cur.wob);
  const s = cur.scale * (1 + 0.018 * Math.sin(time * 1.25) + audio.level * 0.085 + audio.bass * 0.045 + cur.wob * 0.02 * Math.sin(time * 3.0));
  orb.scale.setScalar(s);

  const alignFront = (targetIsText > 0.5 || currentShape === "vortex" || currentShape === "infinity");
  if (alignFront && !dragging) {
    const twoPi = Math.PI * 2;
    orb.rotation.y = orb.rotation.y - Math.round(orb.rotation.y / twoPi) * twoPi;
    const targetY = Math.sin(time * 0.75) * (targetIsText > 0.5 ? 0.10 : 0.24) + smoothPointerX * 0.15;
    const targetX = Math.cos(time * 0.6) * 0.05 + smoothPointerY * 0.10;
    orb.rotation.y += (targetY - orb.rotation.y) * (1 - Math.exp(-dt * 4.5));
    orb.rotation.x += (targetX - orb.rotation.x) * (1 - Math.exp(-dt * 4.5));
    orb.rotation.z += (0 - orb.rotation.z) * (1 - Math.exp(-dt * 4.5));
  } else {
    orb.rotation.y += dt * 0.18 * (0.45 + cur.speed) + velY * Math.min(dt * 20, 1) * 0.5;
    orb.rotation.x = Math.max(-1.1, Math.min(1.1, orb.rotation.x + velX * Math.min(dt * 20, 1) * 0.5));
    orb.rotation.z = Math.sin(time * 0.45) * 0.05 + smoothPointerX * 0.04;
    if (!dragging && Math.abs(orb.rotation.x) > 0.001) {
      orb.rotation.x += (smoothPointerY * 0.14 - orb.rotation.x) * Math.min(1, dt * 2.0);
    }
  }
  velX *= Math.exp(-dt * 5.0);
  velY *= Math.exp(-dt * 5.0);

  U.uAmoeba.value += (targetAmoebaFactor * cur.amoebaAmp - U.uAmoeba.value) * k;
  U.uIsText.value += (targetIsText - U.uIsText.value) * k;
  U.uHeartBeat.value += (targetHeartBeat - U.uHeartBeat.value) * k;
  U.uTime.value = flow;
  U.uRawTime.value = time;
  U.uAmp.value = audio.level + cur.wob * 0.20;
  U.uBass.value = audio.bass;
  U.uHigh.value = audio.high;
  U.uCyan.value = cur.cyan;
  U.uPurple.value = cur.purple;
  U.uBright.value = cur.bright + idlePulse + fusionFlash * 0.15;
  U.uSplit.value = splitAmount;
  U.uTouchPos.value.copy(touchWorld);
  U.uSwipeVel.value.copy(swipeVelWorld);
  U.uTouchStrength.value = touchStrength;

  glowMat.uniforms.uTime.value = time;
  glowMat.uniforms.uMix.value = cur.cyan;
  glowMat.uniforms.uStrength.value = (cur.glow + audio.level * 0.55 + idlePulse * 1.5 + splitAmount * 0.22 + fusionFlash * 0.30) * glowMul;

  shadowEl.style.width = Math.round(pxPerUnit * 1.85 * s * (1 + splitAmount * 0.35)) + "px";
}

function updateOrbitSpores(dt) {
  const P = orbitPts.geometry.attributes;
  const boost = 0.58 + cur.speed * 0.75 + ((state === "thinking" || state === "working") ? 0.95 : 0) + splitAmount * 0.75 + audio.high * 0.55;
  for (let i = 0; i < ORBIT_COUNT; i++) {
    const d = ptData[i];
    d.a += d.sp * dt * boost;
    const r = d.r + Math.sin(time * d.fs + d.ph) * 0.14 - ((state === "thinking" || state === "working") ? 0.10 : 0) + audio.level * 0.12 + splitAmount * 0.24;
    let x = Math.cos(d.a) * r * 1.28;
    let z = Math.sin(d.a) * r * 0.68;
    let y = d.y * 0.82 + Math.sin(d.a * 1.2 + d.ph) * 0.16 + x * d.tilt * 0.20;

    if (touchStrength > 0.05) {
      const pull = Math.min(0.48, touchStrength * 0.26);
      x += (touchWorld.x - x) * pull;
      y += (touchWorld.y - y) * pull;
    }

    P.position.setXYZ(i, x, y, z);
    P.aAlpha.setX(i, Math.pow(0.5 + 0.5 * Math.sin(time * d.fs * 1.5 + d.ph), 1.4) * (0.60 + cur.glow * 0.30));
  }
  P.position.needsUpdate = true;
  P.aAlpha.needsUpdate = true;
}

/* ---------- Responsive Resize & Render Loop ---------- */
function handleResize() {
  const deviceMemory = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
  const qualityCap = deviceMemory >= 6 && cores >= 8 ? 3 : 2;
  const w = Math.max(stage.clientWidth, 1), h = Math.max(stage.clientHeight, 1);
  const pr = Math.min(window.devicePixelRatio || 1, qualityCap);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const visH = VIS / Math.min(1, (w / h) * 0.88);
  const tan = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camera.position.z = visH / (2 * tan);
  U.uCamZ.value = camera.position.z;
  camera.updateProjectionMatrix();
  pxPerUnit = h / visH;
  U.uPx.value = h * pr / (2 * tan);
  shadowEl.style.top = Math.round(h / 2 + pxPerUnit * 1.05) + "px";
}

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const rawDt = Math.min((now - last) / 1000, 0.05);
  last = now;
  /* Exponential moving average on frame delta time guarantees ultra-smooth optical flow */
  smoothDt += (rawDt - smoothDt) * 0.25;
  updateOrb(smoothDt);
  updateOrbitSpores(smoothDt);
  renderer.render(scene, camera);
}

/* ---------- UI & Global JarvisOrb Bridge ---------- */
document.querySelectorAll("[data-s]").forEach(b => {
  b.addEventListener("click", () => setOrbState(b.dataset.s));
});
document.querySelectorAll("[data-t]").forEach(b => {
  b.addEventListener("click", () => applyTheme(b.dataset.t));
});
document.querySelectorAll("[data-shape]").forEach(b => {
  b.addEventListener("click", () => setOrbShape(b.dataset.shape));
});

const splitBtn = $("#splitBtn");
if (splitBtn) {
  splitBtn.addEventListener("click", () => {
    triggerAmoebaSplit(new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, 0), 5);
  });
}

const autoMorphBtn = $("#autoMorphBtn");
if (autoMorphBtn) {
  autoMorphBtn.addEventListener("click", () => {
    autoMorph = !autoMorph;
    autoMorphTimer = 0;
    autoMorphBtn.classList.toggle("on", autoMorph);
    autoMorphBtn.textContent = autoMorph ? "AUTO MORPH: ON" : "AUTO MORPH: OFF";
  });
}

const hudToggle = $("#hudToggle");
if (hudToggle) {
  hudToggle.addEventListener("click", () => {
    document.body.classList.toggle("embedded");
    setTimeout(handleResize, 20);
  });
}

const bgcInput = $("#bgc");
if (bgcInput) bgcInput.addEventListener("input", e => applyTheme(null, e.target.value));
const micBtn = $("#mic");
if (micBtn) micBtn.addEventListener("click", () => micOn ? stopAudioReactive() : startAudioReactive());

window.addEventListener("resize", handleResize);
window.addEventListener("orientationchange", () => setTimeout(handleResize, 200));
if (window.ResizeObserver) new ResizeObserver(handleResize).observe(stage);

window.JarvisOrb = {
  setState: setOrbState,
  setStyle: style => {
    if (style === "welcome") showWelcomeMessage(3.0);
    else if (style === "done") showDoneMessage(2.8);
    else if (SHAPE_NAMES.includes(style)) setOrbShape(style);
    else setOrbShape("amoeba");
  },
  setShape: setOrbShape,
  showWelcome: showWelcomeMessage,
  showDone: showDoneMessage,
  completeTask: showDoneMessage,
  showMessage: showCustomTextMessage,
  morphToCustom: morphToCustomShape,
  triggerSplit: (lobes) => triggerAmoebaSplit(new THREE.Vector3(0, 0, 0), lobes || 5),
  setAutoMorph: enabled => {
    autoMorph = !!enabled;
    if (autoMorphBtn) {
      autoMorphBtn.classList.toggle("on", autoMorph);
      autoMorphBtn.textContent = autoMorph ? "AUTO MORPH: ON" : "AUTO MORPH: OFF";
    }
  },
  setEmbedded: embedded => {
    document.body.classList.toggle("embedded", !!embedded);
    applyTheme(themeName);
    handleResize();
  },
  setTheme: n => applyTheme(n),
  // Native host supplies both the exact app accent palette and its light/dark mode.
  setAppTheme: (isLight, primary, secondary) => applyTheme(null, primary, secondary, !!isLight),
  setColor: (hex, hex2) => applyTheme(null, hex, hex2),
  setThemeColor: (hex, hex2) => applyTheme(null, hex, hex2),
  setAppColor: (hex, hex2) => applyTheme(null, hex, hex2),
  setAccentColor: (hex, hex2) => applyTheme(null, hex, hex2),
  setPrimaryColor: (hex, hex2) => applyTheme(null, hex, hex2),
  setBackground: (hex, hex2) => {
    if (!isEmbedded) document.documentElement.style.setProperty("--bg", hex);
    applyTheme(null, hex, hex2);
  },
  setWorking: b => {
    const wasWorking = working;
    working = !!b;
    if (working) {
      if (state !== "listening" && state !== "speaking" && state !== "talking") {
        setOrbState("working", true);
      }
    } else if (wasWorking && state === "working") {
      setOrbState("idle", true);
      showDoneMessage(2.8);
    }
  },
  setGlow: v => { const n = parseFloat(v); if (!isNaN(n)) glowMul = Math.max(0, Math.min(2, n)); },
  setExternalAudio: setExternalAudio,
  startListening: () => setOrbState("listening", true),
  startThinking: () => setOrbState("thinking", true),
  startSpeaking: () => setOrbState("speaking", true),
  startTalking: () => setOrbState("talking", true),
  startWorking: () => { working = true; setOrbState("working", true); },
  stopSpeaking: () => {
    setOrbState("idle", true);
    showDoneMessage(2.8);
  },
  startAudioReactive: startAudioReactive,
  stopAudioReactive: stopAudioReactive
};

handleResize();
/* If URL query passes ?color=#hex or ?theme=name, automatically adapt to that App Colour */
const urlParams = new URLSearchParams(window.location.search);
const paramColor = urlParams.get("color") || urlParams.get("themeColor") || urlParams.get("appColor") || urlParams.get("accent") || urlParams.get("primary") || urlParams.get("bg");
const paramColor2 = urlParams.get("color2") || urlParams.get("accent");
const paramTheme = urlParams.get("theme");
const detectedCssColor = readHostCssThemeColor();
if (paramColor) {
  applyTheme(null, paramColor, paramColor2);
} else if (paramTheme) {
  applyTheme(paramTheme);
} else if (detectedCssColor) {
  applyTheme(null, detectedCssColor);
} else {
  applyTheme("light");
}

/* Listen for host app postMessage or runtime CSS variable updates so particles always match the App Theme Colour */
window.addEventListener("message", e => {
  if (!e || !e.data) return;
  const d = typeof e.data === "string" ? (() => { try { return JSON.parse(e.data); } catch (_) { return null; } })() : e.data;
  if (!d) return;
  const col = d.color || d.themeColor || d.appColor || d.accent || d.primary || d.bg;
  if (col) applyTheme(null, col, d.color2 || d.accentColor);
  else if (d.theme) applyTheme(d.theme);
});

setOrbState("idle", true);
/* First-open experience: Show "WELCOME / JARVIS / by sukant" for exact 3.0 seconds, then change! */
showWelcomeMessage(3.0);
requestAnimationFrame(animate);
})();
</script>
<script>
/* ---------- 2D Touch Overlay (Strictly Adapts to Active App Theme Colour) ---------- */
(() => {
  const c = document.getElementById("touchParticles"), x = c.getContext("2d");
  let w = 0, h = 0, sparks = [], rings = [], trail = [], raf = 0, down = false;

  function getAppThemeColor(idx) {
    const cols = window.__jarvisThemeCols || ["#2f6bff", "#8b5cf6", "#c15de0"];
    return cols[idx % cols.length];
  }

  function size() {
    const memory = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4, cap = memory >= 6 && cores >= 8 ? 3 : 2;
    let d = Math.min(devicePixelRatio || 1, cap);
    w = innerWidth; h = innerHeight;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    c.style.width = w + "px"; c.style.height = h + "px";
    x.setTransform(d, 0, 0, d, 0, 0);
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = "high";
  }
  addEventListener("resize", size, { passive: true });
  size();

  function spawnBurst(cx, cy, count) {
    rings.push({ x: cx, y: cy, r: 8, maxR: 68, l: 1, rot: Math.random() * 6.28, col: getAppThemeColor(0) });
    for (let i = 0; i < count; i++) {
      let a = (2 * Math.PI * i) / count + (Math.random() - 0.5) * 0.22;
      let s = 1.4 + Math.random() * 2.8;
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        l: 1, r: 1.2 + Math.random() * 1.8,
        col: getAppThemeColor(i)
      });
    }
    if (!raf) raf = requestAnimationFrame(draw);
  }

  document.addEventListener("pointerdown", e => {
    down = true;
    trail.push({ x: e.clientX, y: e.clientY, l: 1, col: getAppThemeColor(0) });
    spawnBurst(e.clientX, e.clientY, 16);
  }, { passive: true });

  document.addEventListener("pointermove", e => {
    if (!down) return;
    trail.push({ x: e.clientX, y: e.clientY, l: 1, col: getAppThemeColor(1) });
    if (trail.length > 22) trail.shift();
    for (let i = 0; i < 2; i++) {
      let a = Math.random() * Math.PI * 2, s = 0.7 + Math.random() * 1.5;
      sparks.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        l: 0.85, r: 1.1 + Math.random() * 1.4,
        col: getAppThemeColor(i)
      });
    }
    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive: true });

  const endPtr = () => { down = false; };
  document.addEventListener("pointerup", endPtr, { passive: true });
  document.addEventListener("pointercancel", endPtr, { passive: true });

  function draw() {
    raf = 0;
    x.clearRect(0, 0, w, h);

    if (trail.length > 1) {
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].l -= 0.045;
        if (trail[i].l <= 0) trail.splice(i, 1);
      }
      for (let i = 1; i < trail.length; i++) {
        const p0 = trail[i - 1], p1 = trail[i];
        x.globalAlpha = p1.l * 0.68;
        x.strokeStyle = p1.col;
        x.lineWidth = p1.l * 3.6;
        x.lineCap = "round";
        x.beginPath();
        x.moveTo(p0.x, p0.y);
        x.lineTo(p1.x, p1.y);
        x.stroke();
      }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += (rg.maxR - rg.r) * 0.12;
      rg.l -= 0.038;
      if (rg.l <= 0) { rings.splice(i, 1); continue; }
      x.globalAlpha = rg.l * 0.7;
      x.strokeStyle = rg.col;
      x.lineWidth = 1.5;
      x.beginPath();
      x.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
      x.stroke();
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      let q = sparks[i];
      q.x += q.vx; q.y += q.vy;
      q.vx *= 0.965; q.vy *= 0.965;
      q.l -= 0.034;
      if (q.l <= 0) { sparks.splice(i, 1); continue; }
      x.globalAlpha = q.l;
      x.fillStyle = q.col;
      x.beginPath();
      x.arc(q.x, q.y, q.r * q.l, 0, Math.PI * 2);
      x.fill();
    }

    x.globalAlpha = 1;
    if (sparks.length || rings.length || trail.length) raf = requestAnimationFrame(draw);
  }
})();
</script>
</body>
