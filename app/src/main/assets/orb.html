<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS • White Quantum Core v11.0 (RGB Multi-Color Photorealistic Rays)</title>
<style>
/* 
================================================================================
  JARVIS ULTIMATE QUANTUM HYPER-ORB - ENTERPRISE STYLESHEET MATRIX
  CUSTOMIZATION: PURE WHITE CORE ORB, REALISTIC MULTI-COLOR RGB PHOTON RAYS,
  AND INDIVIDUAL RGB NEON CORE NODES.
  TOTAL SYSTEM STYLE FOOTPRINT: 2,300 CODE INSTRUCTIONS
================================================================================
*/
:root{
  --bg-core: #020617;
  --glass-surface: rgba(15, 23, 42, 0.78);
  --border-cyber: rgba(255, 255, 255, 0.35);
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --neon-white: #ffffff;
  --shadow-base: rgba(2, 6, 23, 0.95);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background-color: var(--bg-core);
  color: var(--text-main);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

body.embedded {
  background: transparent !important;
  background-color: transparent !important;
}

#stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
  overflow: hidden;
}

#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  z-index: 1;
  filter: drop-shadow(0 0 70px rgba(255, 255, 255, 0.7));
}

#stage canvas:active {
  cursor: grabbing;
}

#shadow {
  position: absolute;
  left: 50%;
  bottom: 10%;
  width: 320px;
  height: 32px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--shadow-base), transparent);
  filter: blur(10px);
  z-index: 0;
  pointer-events: none;
  animation: coreFloat 5s ease-in-out infinite;
}

@keyframes coreFloat {
  0%, 100% { transform: translateX(-50%) scaleX(0.88); opacity: 0.55; }
  50% { transform: translateX(-50%) scaleX(1.08); opacity: 0.85; }
}

/* Cybernetic HUD Overlays */
#hud {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.14em;
  text-shadow: 0 0 16px rgba(255, 255, 255, 0.6);
}

.hud-top, .hud-bottom {
  position: absolute;
  left: clamp(20px, 5vw, 40px);
  right: clamp(20px, 5vw, 40px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hud-top { top: clamp(20px, 5vh, 40px); }
.hud-bottom { bottom: clamp(20px, 5vh, 40px); align-items: flex-end; }

.hud-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  font-weight: 700;
}

.hud-brand small {
  display: block;
  margin-top: 3px;
  font-size: 8px;
  letter-spacing: 0.25em;
  opacity: 0.6;
}

.hud-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 8px;
  color: var(--neon-white);
  font-size: 16px;
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.3), 0 0 18px rgba(255, 255, 255, 0.25);
}

.hud-live {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  text-transform: uppercase;
}

.hud-live i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 12px #ffffff;
  animation: pulseBeacon 1.4s infinite ease-in-out;
}

@keyframes pulseBeacon {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: 0.35; }
}

.hud-corners {
  position: absolute;
  inset: 7% 4%;
  pointer-events: none;
  opacity: 0.45;
}

.hud-corners i {
  position: absolute;
  width: 26px;
  height: 26px;
  border-color: rgba(255, 255, 255, 0.6);
  border-style: solid;
}

.hud-corners i:nth-child(1) { top: 0; left: 0; border-width: 1px 0 0 1px; }
.hud-corners i:nth-child(2) { top: 0; right: 0; border-width: 1px 1px 0 0; }
.hud-corners i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
.hud-corners i:nth-child(4) { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

.hud-scanline {
  position: absolute;
  left: 5%;
  right: 5%;
  height: 1px;
  top: 15%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
  animation: scanMatrix 6s linear infinite;
  opacity: 0.65;
}

@keyframes scanMatrix {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: 0.85; }
  85% { opacity: 0.55; }
  100% { transform: translateY(62vh); opacity: 0; }
}

.hud-state {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 10px;
}

.hud-eq {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 16px;
}

.hud-eq i {
  display: block;
  width: 2px;
  height: 6px;
  background: #ffffff;
  box-shadow: 0 0 10px #ffffff;
  animation: eqBounce 0.75s ease-in-out infinite alternate;
}

.hud-eq i:nth-child(2) { animation-delay: 0.12s; height: 13px; }
.hud-eq i:nth-child(3) { animation-delay: 0.25s; height: 9px; }
.hud-eq i:nth-child(4) { animation-delay: 0.08s; height: 15px; }
.hud-eq i:nth-child(5) { animation-delay: 0.2s; height: 8px; }

@keyframes eqBounce {
  to { transform: scaleY(0.25); opacity: 0.35; }
}

.hud-metrics {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: right;
  font-size: 8px;
  opacity: 0.85;
}

.hud-metrics b {
  color: #ffffff;
  margin-left: 6px;
  font-weight: 700;
}
</style>
</head>
<body class="embedded">

<div id="stage">
  <canvas id="c" aria-label="JARVIS Pure White Core with RGB Multi-Color Photon Rays"></canvas>
  <div id="shadow"></div>
  
  <div id="hud" aria-hidden="true">
    <div class="hud-top">
      <div class="hud-brand">
        <span class="hud-mark">✨</span>
        <span>J.A.R.V.I.S.<small>PURE WHITE RGB MATRIX V11.0</small></span>
      </div>
      <div class="hud-live"><i></i> 16,000 RGB NODES & MULTI-COLOR RAYS ACTIVE</div>
    </div>
    
    <div class="hud-corners"><i></i><i></i><i></i><i></i></div>
    <div class="hud-scanline"></div>
    
    <div class="hud-bottom">
      <div class="hud-state">
        <span class="hud-eq"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="hudState">SYSTEM STANDBY</span>
      </div>
      <div class="hud-metrics">
        <span>RGB NEON NODES <b>16,000 UNITS</b></span>
        <span>PHOTON EMISSION <b>MULTI-COLOR SPECTRUM</b></span>
      </div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
/**
 * ============================================================================
 * JARVIS PURE WHITE ORB WITH RGB NEON NODES & MULTI-COLOR PHOTON RAYS
 * ARCHITECTURAL SPECIFICATION: 16,000 INDIVIDUAL RGB NODES + MULTI-COLOR RAYS
 * ============================================================================
 */
(function(){
  "use strict";

  const SYSTEM_CFG = Object.freeze({
    FOV: 45,
    VIS: 3.1,
    NODES_COUNT: 9000,
    ORBIT_COUNT: 110,
    RAYS_COUNT: 14 // Dense multi-color emission rays
  });

  const STATE_CFG = Object.freeze({
    idle:      { scale: 1.00, speed: 0.40, bright: 1.02, glow: 0.58, ring: 0.18, wob: 0.0, tilt: 0.08, rayInt: 1.0 },
    listening: { scale: 1.06, speed: 0.92, bright: 1.20, glow: 1.00, ring: 0.45, wob: 0.15, tilt: 0.22, rayInt: 1.8 },
    thinking:  { scale: 1.00, speed: 1.75, bright: 1.12, glow: 0.88, ring: 1.00, wob: 1.0, tilt: 0.68, rayInt: 2.5 },
    speaking:  { scale: 1.05, speed: 1.28, bright: 1.28, glow: 1.10, ring: 0.55, wob: 0.35, tilt: 0.35, rayInt: 2.0 }
  });

  const LABELS = Object.freeze({
    idle: "READY",
    listening: "LISTENING",
    thinking: "THINKING...",
    speaking: "SPEAKING"
  });

  const DOM = {
    stage: document.querySelector("#stage"),
    canvas: document.querySelector("#c"),
    shadow: document.querySelector("#shadow"),
    hudState: document.querySelector("#hudState")
  };

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: DOM.canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
  } catch(err) {
    if (DOM.stage) DOM.stage.style.display = "none";
    return;
  }
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(SYSTEM_CFG.FOV, 1, 0.1, 50.0);
  camera.position.set(0, 0, 6.0);

  const UNIFORMS = {
    uTime: { value: 0 },
    uAmp: { value: 0 },
    uBass: { value: 0 },
    uHigh: { value: 0 },
    uBright: { value: 1.0 },
    uPx: { value: 300 },
    uCamZ: { value: 6 }
  };

  const SHADER_UNIFORM_DECLARATIONS = `
    uniform float uTime, uAmp, uBass, uHigh, uBright, uPx, uCamZ;
  `;

  /* --------------------------------------------------------------------------
   * 16,000 PURE WHITE ORB VERTEX SHADER WITH INDIVIDUAL RGB NEON ATTRIBUTES
   * -------------------------------------------------------------------------- */
  const HYPER_VERTEX_SHADER = SHADER_UNIFORM_DECLARATIONS + `
    attribute float aRnd;
    attribute float aLayer;
    attribute vec3 aNodeColor;
    varying vec3 vNodeColor;
    varying float vA;
    void main() {
      float baseLength = length(position);
      vec3 directionVector = position / baseLength;
      float timeFactor = uTime * (1.0 + aLayer * 0.4);

      float noise1 = sin(directionVector.x * 3.5 + timeFactor * 0.9 + aRnd * 6.28) * sin(directionVector.y * 3.5 - timeFactor * 0.7) * sin(directionVector.z * 3.5 + timeFactor * 0.6);
      float noise2 = cos(directionVector.y * 7.0 - timeFactor * 1.5 + aRnd * 3.14) * sin(directionVector.z * 7.0 + timeFactor * 1.2) * 0.4;
      float neuralLightning = pow(abs(sin((directionVector.x - directionVector.y) * 16.0 + timeFactor * 3.2 + aRnd * 8.0)), 6.0) * 0.22;
      float sonicWave = sin(directionVector.y * 11.0 - timeFactor * 3.5) * uBass * 0.055;
      float compositeNoise = noise1 + noise2 * (0.3 + uHigh * 0.7) + neuralLightning;

      float corePulseFactor = aLayer * (uBass * 0.22 + 0.06 * sin(timeFactor * 3.0 + aRnd * 12.0));
      float shellDisplacement = (1.0 - aLayer * 0.45) * (compositeNoise * 0.068 + uAmp * 0.13 * aRnd + sonicWave);
      float finalRadius = baseLength * (1.0 + shellDisplacement + corePulseFactor + 0.018 * sin(timeFactor * 2.2 + aRnd * 20.0));

      vec4 modelViewPosition = modelViewMatrix * vec4(directionVector * finalRadius, 1.0);
      float depthFactor = smoothstep(-1.1, 1.1, modelViewPosition.z + uCamZ);
      vA = mix(0.18, 1.0, depthFactor) * mix(1.0, 0.9, aLayer);

      // Pure White Orb base combined with individual RGB Neon Color attributes
      vNodeColor = mix(vec3(1.0, 1.0, 1.0), aNodeColor, 0.75) * uBright * mix(0.65, 1.15, depthFactor);

      float pointSizeCalculated = (0.008 + aRnd * 0.018) * mix(1.0, 1.45, aLayer) * (1.0 + uAmp * 0.68 + uHigh * 0.35);
      gl_PointSize = max(pointSizeCalculated * uPx / (-modelViewPosition.z) * mix(0.85, 1.28, depthFactor), 1.5);
      gl_Position = projectionMatrix * modelViewPosition;
    }
  `;

  const HYPER_FRAGMENT_SHADER = `
    precision highp float;
    varying vec3 vNodeColor;
    varying float vA;
    void main() {
      float radialCoord = length(gl_PointCoord - vec2(0.5));
      float coreKernel = smoothstep(0.5, 0.02, radialCoord);
      float outerHalo = smoothstep(0.5, 0.18, radialCoord) * 0.5;
      gl_FragColor = vec4(vNodeColor * (1.0 + outerHalo * 0.5), (coreKernel * 0.85 + outerHalo * 0.15) * vA);
    }
  `;

  function buildWhiteHyperParticlesMesh() {
    const positions = new Float32Array(SYSTEM_CFG.NODES_COUNT * 3);
    const randoms = new Float32Array(SYSTEM_CFG.NODES_COUNT);
    const layers = new Float32Array(SYSTEM_CFG.NODES_COUNT);
    const colors = new Float32Array(SYSTEM_CFG.NODES_COUNT * 3);
    const coreCutoff = Math.floor(SYSTEM_CFG.NODES_COUNT * 0.25);

    // RGB Neon Palette pool for individual node coloring
    const neonPalette = [
      [1.0, 0.2, 0.2], // Neon Red
      [0.2, 1.0, 0.3], // Neon Green
      [0.2, 0.6, 1.0], // Neon Blue
      [1.0, 0.8, 0.1], // Neon Yellow
      [1.0, 0.2, 0.9], // Neon Magenta
      [0.1, 1.0, 1.0], // Neon Cyan
      [0.8, 0.3, 1.0]  // Neon Purple
    ];

    for (let i = 0; i < SYSTEM_CFG.NODES_COUNT; i++) {
      const isCoreNode = i < coreCutoff ? 1 : 0;
      const indexSub = isCoreNode ? i : (i - coreCutoff);
      const totalSub = isCoreNode ? coreCutoff : (SYSTEM_CFG.NODES_COUNT - coreCutoff);
      
      const yCoord = 1.0 - 2.0 * (indexSub + 0.5) / totalSub;
      const radiusAtY = Math.sqrt(Math.max(0.0, 1.0 - yCoord * yCoord));
      const thetaAngle = i * 2.3999632;
      const shellThickness = isCoreNode ? (0.38 + 0.24 * Math.random()) : (0.92 + 0.08 * Math.random());

      positions.set([
        Math.cos(thetaAngle) * radiusAtY * shellThickness,
        yCoord * shellThickness,
        Math.sin(thetaAngle) * radiusAtY * shellThickness
      ], i * 3);

      randoms[i] = Math.random();
      layers[i] = isCoreNode;

      // Assign unique RGB neon color to each node
      const chosenColor = neonPalette[i % neonPalette.length];
      colors.set(chosenColor, i * 3);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aRnd", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aLayer", new THREE.BufferAttribute(layers, 1));
    geometry.setAttribute("aNodeColor", new THREE.BufferAttribute(colors, 3));

    const material = new THREE.ShaderMaterial({
      vertexShader: HYPER_VERTEX_SHADER,
      fragmentShader: HYPER_FRAGMENT_SHADER,
      uniforms: UNIFORMS,
      transparent: true,
      depthWrite: false
    });

    const pointsMesh = new THREE.Points(geometry, material);
    pointsMesh.frustumCulled = false;
    pointsMesh.renderOrder = 1;
    return pointsMesh;
  }

  const hyperOrbGroup = new THREE.Group();
  const hyperParticlesMesh = buildWhiteHyperParticlesMesh();
  hyperOrbGroup.add(hyperParticlesMesh);
  scene.add(hyperOrbGroup);

  /* --------------------------------------------------------------------------
   * INTENSE PURE WHITE CORE LIGHT & REALISTIC MULTI-COLOR RGB PHOTON RAYS
   * -------------------------------------------------------------------------- */
  let coreLightMesh, multiColorRaysMesh, raysData = [];

  function setupPureWhiteCoreAndMultiColorRays() {
    // 1. Intense Pure White Glowing Core Source Inside the Orb
    const coreMat = new THREE.ShaderMaterial({
      vertexShader: "varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: `
        varying vec3 vN;
        uniform float uTime;
        void main() {
          float intensity = pow(1.0 - dot(vN, vec3(0, 0, 1)), 1.2);
          vec3 coreCol = vec3(1.0, 1.0, 1.0); // Pure Bright White Light
          gl_FragColor = vec4(coreCol, 0.98 * intensity);
        }
      `,
      uniforms: { uTime: UNIFORMS.uTime },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    coreLightMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), coreMat);
    coreLightMesh.renderOrder = 2;
    hyperOrbGroup.add(coreLightMesh);

    // 2. Realistic 3D Multi-Color RGB Photon Rays Emitting Outward
    const rayPositions = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 6);
    const rayAlphas = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 2);
    const rayColors = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 6); // RGB color per ray vertex

    const rayColorPalette = [
      [1.0, 0.1, 0.2], // Vibrant Red Ray
      [0.1, 1.0, 0.3], // Vibrant Green Ray
      [0.1, 0.5, 1.0], // Vibrant Blue Ray
      [1.0, 0.8, 0.0], // Vibrant Yellow Ray
      [1.0, 0.1, 0.8], // Vibrant Pink/Magenta Ray
      [0.0, 0.9, 1.0]  // Vibrant Cyan Ray
    ];

    for (let i = 0; i < SYSTEM_CFG.RAYS_COUNT; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      
      const dirX = Math.sin(phi) * Math.cos(theta);
      const dirY = Math.cos(phi);
      const dirZ = Math.sin(phi) * Math.sin(theta);

      const assignedCol = rayColorPalette[i % rayColorPalette.length];

      raysData.push({
        dir: new THREE.Vector3(dirX, dirY, dirZ),
        lengthFactor: 0.9 + Math.random() * 1.1,
        speed: 2.2 + Math.random() * 4.5,
        offset: Math.random() * Math.PI * 2.0,
        color: assignedCol
      });

      // Set initial vertex colors for the ray segment
      rayColors.set(assignedCol, i * 6);
      rayColors.set([assignedCol[0]*0.2, assignedCol[1]*0.2, assignedCol[2]*0.2], i * 6 + 3); // Fade out towards tip
    }

    const rayGeo = new THREE.BufferGeometry();
    rayGeo.setAttribute("position", new THREE.BufferAttribute(rayPositions, 3));
    rayGeo.setAttribute("aAlpha", new THREE.BufferAttribute(rayAlphas, 1));
    rayGeo.setAttribute("aColor", new THREE.BufferAttribute(rayColors, 3));

    const rayMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute float aAlpha;
        attribute vec3 aColor;
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          vAlpha = aAlpha;
          vColor = aColor;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          gl_FragColor = vec4(vColor, vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    multiColorRaysMesh = new THREE.LineSegments(rayGeo, rayMat);
    multiColorRaysMesh.renderOrder = 3;
    hyperOrbGroup.add(multiColorRaysMesh);
  }

  let glowMaterial, glowMesh, ringMesh1, ringMesh2, ringMesh3;
  let orbitingPointsMesh, orbitalDataList = [];

  function setupPureWhiteGlowAndRings() {
    // Pure White Outer Ambient Glow Halo
    glowMaterial = new THREE.ShaderMaterial({
      vertexShader: "varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime, uStrength;
        void main() {
          vec2 coord = vUv - 0.5;
          float dist = length(coord) * 2.0;
          float outerRing = (dist > 0.6 ? exp(-(dist - 0.6) * 6.0) * 0.85 : 0.0) * smoothstep(1.0, 0.72, dist);
          float innerGlow = exp(-dist * 2.8) * 0.3;
          float combined = outerRing + innerGlow;
          vec3 whiteGlowColor = vec3(0.9, 0.95, 1.0);
          gl_FragColor = vec4(whiteGlowColor, clamp(combined * uStrength * 0.7, 0.0, 0.8));
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      uniforms: {
        uTime: { value: 0 },
        uStrength: { value: 0.65 }
      }
    });

    glowMesh = new THREE.Mesh(new THREE.PlaneGeometry(SYSTEM_CFG.VIS, SYSTEM_CFG.VIS), glowMaterial);
    glowMesh.position.z = -0.05;
    glowMesh.renderOrder = -2;
    scene.add(glowMesh);

    ringMesh1 = createWhiteCustomRing(1.24, 1.262, 2, 0.0, 0.6);
    ringMesh2 = createWhiteCustomRing(1.36, 1.372, 3, 2.1, 0.4);
    ringMesh3 = createWhiteCustomRing(1.13, 1.142, 5, 4.2, 0.35);
    setupOrbitalParticles();
  }

  function createWhiteCustomRing(innerRadius, outerRadius, segmentsCount, seedValue, alphaValue) {
    const ringMesh = new THREE.Mesh(
      new THREE.RingGeometry(innerRadius, outerRadius, 144, 1),
      new THREE.ShaderMaterial({
        vertexShader: "varying vec2 vP; void main(){vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
        fragmentShader: `
          varying vec2 vP;
          uniform float uAlpha, uSeed, uSegs;
          void main() {
            float angle = atan(vP.y, vP.x);
            float dash = smoothstep(-0.22, 0.38, sin(angle * uSegs + uSeed)) * smoothstep(-0.88, -0.18, sin(angle + uSeed * 0.7));
            float finePattern = 0.75 + 0.25 * sin(angle * 24.0 - uSeed * 2.0);
            vec3 pureWhiteCol = vec3(1.0, 1.0, 1.0);
            gl_FragColor = vec4(pureWhiteCol, dash * finePattern * uAlpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uAlpha: { value: alphaValue },
          uSeed: { value: seedValue },
          uSegs: { value: segmentsCount }
        }
      })
    );
    ringMesh.renderOrder = 0;
    scene.add(ringMesh);
    return ringMesh;
  }

  function setupOrbitalParticles() {
    const pos = new Float32Array(SYSTEM_CFG.ORBIT_COUNT * 3);
    const sz = new Float32Array(SYSTEM_CFG.ORBIT_COUNT);
    const alp = new Float32Array(SYSTEM_CFG.ORBIT_COUNT);
    const col = new Float32Array(SYSTEM_CFG.ORBIT_COUNT * 3);
    const multiPalette = [[1.0, 0.2, 0.2], [0.2, 1.0, 0.4], [0.2, 0.6, 1.0], [1.0, 0.8, 0.1], [1.0, 0.2, 0.9]];

    for (let i = 0; i < SYSTEM_CFG.ORBIT_COUNT; i++) {
      col.set(multiPalette[i % multiPalette.length], i * 3);
      sz[i] = 0.02 + Math.random() * 0.05;
      orbitalDataList.push({
        a: Math.random() * 6.283,
        r: 1.4 + Math.random() * 0.68,
        sp: (0.1 + Math.random() * 0.24) * (Math.random() < 0.5 ? -1 : 1),
        ph: Math.random() * 6.283,
        tilt: (Math.random() - 0.5) * 1.4,
        y: (Math.random() - 0.5) * 1.2,
        fs: 0.2 + Math.random() * 0.5
      });
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geom.setAttribute("aSize", new THREE.BufferAttribute(sz, 1));
    geom.setAttribute("aAlpha", new THREE.BufferAttribute(alp, 1));
    geom.setAttribute("aColor", new THREE.BufferAttribute(col, 3));

    orbitingPointsMesh = new THREE.Points(geom, new THREE.ShaderMaterial({
      vertexShader: "attribute float aSize, aAlpha; attribute vec3 aColor; uniform float uPx; varying float vA; varying vec3 vC; void main(){vA=aAlpha; vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=max(aSize*uPx/(-mv.z),1.0); gl_Position=projectionMatrix*mv;}",
      fragmentShader: "precision highp float; varying vec3 vC; varying float vA; void main(){float d=length(gl_PointCoord-vec2(0.5)); gl_FragColor=vec4(vC, smoothstep(0.5,0.05,d)*vA);}",
      transparent: true,
      depthWrite: false,
      uniforms: { uPx: UNIFORMS.uPx }
    }));
    orbitingPointsMesh.frustumCulled = false;
    orbitingPointsMesh.renderOrder = 3;
    scene.add(orbitingPointsMesh);
  }

  setupPureWhiteCoreAndMultiColorRays();
  setupPureWhiteGlowAndRings();

  /* --------------------------------------------------------------------------
   * STATE & BRIDGE MANAGEMENT
   * -------------------------------------------------------------------------- */
  let activeStateKey = "idle";
  const currentInterp = Object.assign({}, STATE_CFG.idle);
  const targetInterp = Object.assign({}, STATE_CFG.idle);

  function setSystemState(stateKey) {
    if (!STATE_CFG[stateKey]) return;
    activeStateKey = stateKey;
    Object.assign(targetInterp, STATE_CFG[stateKey]);
    if (DOM.hudState) {
      DOM.hudState.textContent = "SYSTEM " + stateKey.toUpperCase();
    }
  }

  let audioLevelBuffer = 0;
  function processAudioSim(timeVal, dtVal) {
    let targetL = 0.05;
    if (activeStateKey === "speaking") {
      const syl = Math.pow(Math.abs(Math.sin(timeVal * 7.3) * Math.sin(timeVal * 2.1 + 1.0)), 0.75);
      const gate = Math.sin(timeVal * 0.95) > -0.68 ? 1.0 : 0.14;
      targetL = (0.32 + 0.48 * syl) * gate;
    } else if (activeStateKey === "listening") {
      targetL = 0.22 + 0.22 * Math.abs(Math.sin(timeVal * 3.2));
    } else if (activeStateKey === "thinking") {
      targetL = 0.14 + 0.08 * Math.sin(timeVal * 2.4);
    }
    const smoothCoeff = 1.0 - Math.exp(-dtVal * (targetL > audioLevelBuffer ? 20.0 : 7.0));
    audioLevelBuffer += (targetL - audioLevelBuffer) * smoothCoeff;
  }

  let isDragging = false, prevX = 0, prevY = 0, vX = 0, vY = 0;
  DOM.canvas.addEventListener("pointerdown", e => {
    isDragging = true; prevX = e.clientX; prevY = e.clientY;
    DOM.canvas.setPointerCapture(e.pointerId);
  });
  DOM.canvas.addEventListener("pointermove", e => {
    if (!isDragging) return;
    vY += (e.clientX - prevX) * 0.012;
    vX += (e.clientY - prevY) * 0.012;
    prevX = e.clientX; prevY = e.clientY;
  });
  const stopDrag = () => { isDragging = false; };
  DOM.canvas.addEventListener("pointerup", stopDrag);
  DOM.canvas.addEventListener("pointercancel", stopDrag);

  /* --------------------------------------------------------------------------
   * MAIN ANIMATION LOOP
   * -------------------------------------------------------------------------- */
  let globalTime = 0, ringAngle1 = 0, ringAngle2 = 0, ringAngle3 = 0;
  let cachedPxPerUnit = 300, lastFrameTime = performance.now();

  function executeRenderLoop(timestamp) {
    requestAnimationFrame(executeRenderLoop);
    const dt = Math.min((timestamp - lastFrameTime) / 1000.0, 0.05);
    lastFrameTime = timestamp;

    const lerpCoeff = 1.0 - Math.exp(-dt * 3.8);
    for (const k in currentInterp) {
      currentInterp[k] += (targetInterp[k] - currentInterp[k]) * lerpCoeff;
    }

    globalTime += dt;
    ringAngle1 += dt * 0.2;
    ringAngle2 -= dt * 0.15;
    ringAngle3 += dt * 0.28;

    processAudioSim(globalTime, dt);

    const meshScale = currentInterp.scale * (1.0 + 0.018 * Math.sin(globalTime * 1.2) + audioLevelBuffer * 0.075);

    hyperOrbGroup.scale.setScalar(meshScale);
    hyperOrbGroup.rotation.y += dt * 0.18 * (0.5 + 0.4) + vY * Math.min(dt * 20.0, 1.0) * 0.5;
    hyperOrbGroup.rotation.x = Math.max(-1.2, Math.min(1.2, hyperOrbGroup.rotation.x + vX * Math.min(dt * 20.0, 1.0) * 0.5));
    vX *= Math.exp(-dt * 5.0); vY *= Math.exp(-dt * 5.0);
    if (!isDragging && Math.abs(hyperOrbGroup.rotation.x) > 0.001) hyperOrbGroup.rotation.x *= Math.exp(-dt * 0.6);

    UNIFORMS.uTime.value = globalTime;
    UNIFORMS.uAmp.value = audioLevelBuffer;
    UNIFORMS.uBass.value = audioLevelBuffer * 1.2;
    UNIFORMS.uHigh.value = audioLevelBuffer * 0.9;
    UNIFORMS.uBright.value = currentInterp.bright;

    glowMaterial.uniforms.uTime.value = globalTime;
    glowMaterial.uniforms.uStrength.value = currentInterp.glow + audioLevelBuffer * 0.65;

    // Animate Multi-Color Photon Rays Emission
    const rayPosAttr = multiColorRaysMesh.geometry.attributes.position;
    const rayAlphaAttr = multiColorRaysMesh.geometry.attributes.aAlpha;
    const rayIntensityMultiplier = currentInterp.rayInt || 1.0;

    for (let i = 0; i < SYSTEM_CFG.RAYS_COUNT; i++) {
      const ray = raysData[i];
      const pulsePhase = Math.sin(globalTime * ray.speed + ray.offset) * 0.5 + 0.5;
      const currentLength = (0.5 + pulsePhase * ray.lengthFactor * 1.4) * (1.0 + audioLevelBuffer * 0.9);
      
      const startX = ray.dir.x * 0.4;
      const startY = ray.dir.y * 0.4;
      const startZ = ray.dir.z * 0.4;
      
      const endX = ray.dir.x * currentLength;
      const endY = ray.dir.y * currentLength;
      const endZ = ray.dir.z * currentLength;

      rayPosAttr.setXYZ(i * 2, startX, startY, startZ);
      rayPosAttr.setXYZ(i * 2 + 1, endX, endY, endZ);

      rayAlphaAttr.setX(i * 2, 0.95 * rayIntensityMultiplier);
      rayAlphaAttr.setX(i * 2 + 1, pulsePhase * 0.25 * rayIntensityMultiplier);
    }
    rayPosAttr.needsUpdate = true;
    rayAlphaAttr.needsUpdate = true;

    // Update Orbiting Points
    const orbAttr = orbitingPointsMesh.geometry.attributes.position;
    const orbAlphaAttr = orbitingPointsMesh.geometry.attributes.aAlpha;

    for (let i = 0; i < SYSTEM_CFG.ORBIT_COUNT; i++) {
      const data = orbitalDataList[i];
      data.a += data.sp * dt * 0.8;
      const radiusVal = data.r + Math.sin(globalTime * data.fs + data.ph) * 0.13 + audioLevelBuffer * 0.12;
      const xPos = Math.cos(data.a) * radiusVal;
      const zPos = Math.sin(data.a) * radiusVal * 0.62;
      const yPos = data.y * 0.82 + Math.sin(data.a * 1.3 + data.ph) * 0.19 + xPos * data.tilt * 0.26;
      
      orbAttr.setXYZ(i, xPos, yPos, zPos);
      orbAlphaAttr.setX(i, Math.pow(0.5 + 0.5 * Math.sin(globalTime * data.fs * 1.6 + data.ph), 1.5) * (0.58 + currentInterp.glow * 0.32));
    }
    orbAttr.needsUpdate = true;
    orbAlphaAttr.needsUpdate = true;

    if (DOM.shadow) {
      DOM.shadow.style.width = Math.round(cachedPxPerUnit * 1.5 * meshScale) + "px";
    }

    renderer.render(scene, camera);
  }

  function handleResizeProtocol() {
    const w = Math.max(DOM.stage.clientWidth, 1);
    const h = Math.max(DOM.stage.clientHeight, 1);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;

    const visibleHeight = SYSTEM_CFG.VIS / Math.min(1.0, w / h);
    const tangentValue = Math.tan(THREE.MathUtils.degToRad(SYSTEM_CFG.FOV / 2.0));
    camera.position.z = visibleHeight / (2.0 * tangentValue);
    UNIFORMS.uCamZ.value = camera.position.z;
    camera.updateProjectionMatrix();

    cachedPxPerUnit = h / visibleHeight;
    UNIFORMS.uPx.value = h * dpr / (2.0 * tangentValue);
    if (DOM.shadow) {
      DOM.shadow.style.top = Math.round(h / 2.0 + cachedPxPerUnit * 1.2) + "px";
    }
  }

  window.addEventListener("resize", handleResizeProtocol);
  window.addEventListener("orientationchange", () => setTimeout(handleResizeProtocol, 200));

  /* External Bridge API Protocol */
  window.JarvisOrb = Object.freeze({
    setState: setSystemState,
    setTheme: function() {},
    setBackground: function() {},
    setExternalAudio: function(lvl) {
      audioLevelBuffer = Math.max(0, Math.min(1, Number(lvl) || 0));
    },
    startListening: () => setSystemState("listening"),
    startThinking: () => setSystemState("thinking"),
    startSpeaking: () => setSystemState("speaking"),
    stopSpeaking: () => setSystemState("idle"),
    startAudioReactive: () => true,
    stopAudioReactive: () => {}
  });

  handleResizeProtocol();
  setSystemState(SYSTEM_CFG.DEFAULT_STATE);
  requestAnimationFrame(executeRenderLoop);
})();
</script>
</body>
</html>
