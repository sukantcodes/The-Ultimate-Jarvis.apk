<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS • Ultimate High-Vibrance Quantum Core v12.1</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: transparent !important;
  background-color: transparent !important;
}

#stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
  overflow: hidden;
  background: transparent !important;
}

#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  z-index: 1;
  background: transparent !important;
  filter: drop-shadow(0 0 110px rgba(79, 227, 255, 0.9));
}

#stage canvas:active {
  cursor: grabbing;
}

#shadow {
  position: absolute;
  left: 50%;
  bottom: 12%;
  width: 260px;
  height: 24px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.4), transparent);
  filter: blur(8px);
  z-index: 0;
  pointer-events: none;
  animation: coreFloat 5s ease-in-out infinite;
}

@keyframes coreFloat {
  0%, 100% { transform: translateX(-50%) scaleX(0.88); opacity: 0.4; }
  50% { transform: translateX(-50%) scaleX(1.08); opacity: 0.7; }
}

#hud { display: none !important; }
</style>
</head>
<body class="embedded">

<div id="stage">
  <canvas id="c" aria-label="JARVIS Neural Quantum Orb with Boosted High-Vibrance Node Colors"></canvas>
  <div id="shadow"></div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
  "use strict";

  const SYSTEM_CFG = Object.freeze({
    FOV: 45,
    VIS: 3.1,
    NODES_COUNT: 16000,
    ORBIT_COUNT: 110,
    RAYS_COUNT: 64,
    STARDUST_COUNT: 300
  });

  const STATE_CFG = Object.freeze({
    idle:      { scale: 1.00, speed: 0.40, bright: 1.15, glow: 0.75, ring: 0.18, wob: 0.0, tilt: 0.08, rayInt: 1.3, shieldOp: 0.0 },
    listening: { scale: 1.06, speed: 0.92, bright: 1.35, glow: 1.20, ring: 0.45, wob: 0.15, tilt: 0.22, rayInt: 2.2, shieldOp: 0.35 },
    thinking:  { scale: 0.92, speed: 1.85, bright: 1.50, glow: 1.40, ring: 1.00, wob: 1.0, tilt: 0.68, rayInt: 3.2, shieldOp: 0.15 },
    speaking:  { scale: 1.05, speed: 1.28, bright: 1.40, glow: 1.30, ring: 0.55, wob: 0.35, tilt: 0.35, rayInt: 2.5, shieldOp: 0.1 }
  });

  const DOM = {
    stage: document.querySelector("#stage"),
    canvas: document.querySelector("#c"),
    shadow: document.querySelector("#shadow")
  };

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: DOM.canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
  } catch(err) {
    if (DOM.stage) DOM.stage.style.display = "none";
    return;
  }
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(SYSTEM_CFG.FOV, 1, 0.1, 50.0);
  camera.position.set(0, 0, 6.0);

  const UNIFORMS = {
    uTime: { value: 0 },
    uAmp: { value: 0 },
    uBass: { value: 0 },
    uHigh: { value: 0 },
    uBright: { value: 1.15 },
    uPx: { value: 300 },
    uCamZ: { value: 6 },
    uBaseColor: { value: new THREE.Color(0x4fe3ff) },
    uSlideColorShift: { value: 0.0 },
    uShockwaveTime: { value: -10.0 },
    uHeartbeatPulse: { value: 0.0 },
    uGravitationalDistortion: { value: 0.0 },
    uTouchPull: { value: new THREE.Vector3(0, 0, 0) },
    uTouchWeight: { value: 0.0 }
  };

  const SHADER_UNIFORM_DECLARATIONS = `
    uniform float uTime, uAmp, uBass, uHigh, uBright, uPx, uCamZ, uSlideColorShift, uShockwaveTime, uHeartbeatPulse, uGravitationalDistortion, uTouchWeight;
    uniform vec3 uBaseColor, uTouchPull;
  `;

  const HYPER_VERTEX_SHADER = SHADER_UNIFORM_DECLARATIONS + `
    attribute float aRnd;
    attribute float aLayer;
    attribute vec3 aNodeColor;
    varying vec3 vNodeColor;
    varying float vA;

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    void main() {
      float baseLength = length(position);
      vec3 directionVector = position / baseLength;
      float timeFactor = uTime * (1.0 + aLayer * 0.4);

      float timeSinceShockwave = uTime - uShockwaveTime;
      float shockwaveEffect = 0.0;
      if (timeSinceShockwave >= 0.0 && timeSinceShockwave < 2.0) {
        float waveRadius = timeSinceShockwave * 3.5;
        float distFromWave = abs(baseLength - waveRadius);
        shockwaveEffect = smoothstep(0.6, 0.0, distFromWave) * (2.0 - timeSinceShockwave);
      }

      float heartbeatEffect = uHeartbeatPulse * (1.0 - baseLength);
      float neuralFlash = step(0.95, fract(sin(aRnd * 951.13 + uTime * 3.0) * 43758.5453));
      float dispersion = uAmp * aRnd * 0.15 * step(0.7, aRnd);

      vec3 targetPos = directionVector;
      if (uTouchWeight > 0.01) {
        vec3 pullDir = uTouchPull - directionVector;
        targetPos += pullDir * uTouchWeight * max(0.0, (1.0 - length(pullDir)));
      }

      if (uGravitationalDistortion > 0.1) {
        float bend = sin(baseLength * 9.0 - uTime * 7.0) * uGravitationalDistortion * 0.18;
        targetPos += bend * cross(directionVector, vec3(0.0, 1.0, 0.0));
      }

      float noise1 = sin(targetPos.x * 3.5 + timeFactor * 0.9 + aRnd * 6.28) * sin(targetPos.y * 3.5 - timeFactor * 0.7) * sin(targetPos.z * 3.5 + timeFactor * 0.6);
      float noise2 = cos(targetPos.y * 7.0 - timeFactor * 1.5 + aRnd * 3.14) * sin(targetPos.z * 7.0 + timeFactor * 1.2) * 0.4;
      float neuralLightning = pow(abs(sin((targetPos.x - targetPos.y) * 18.0 + timeFactor * 4.0 + aRnd * 8.0)), 6.0) * (0.25 + uGravitationalDistortion * 0.4);
      float sonicWave = sin(targetPos.y * 11.0 - timeFactor * 3.5) * uBass * 0.055;
      float compositeNoise = noise1 + noise2 * (0.3 + uHigh * 0.7) + neuralLightning;

      float corePulseFactor = aLayer * (uBass * 0.22 + 0.06 * sin(timeFactor * 3.0 + aRnd * 12.0));
      float shellDisplacement = (1.0 - aLayer * 0.45) * (compositeNoise * 0.068 + uAmp * 0.13 * aRnd + sonicWave) + (shockwaveEffect * 0.35) + heartbeatEffect + dispersion;
      float finalRadius = baseLength * (1.0 + shellDisplacement + corePulseFactor + 0.018 * sin(timeFactor * 2.2 + aRnd * 20.0));

      vec4 modelViewPosition = modelViewMatrix * vec4(targetPos * finalRadius, 1.0);
      float depthFactor = smoothstep(-1.1, 1.1, modelViewPosition.z + uCamZ);
      vA = mix(0.25, 1.0, depthFactor) * mix(1.0, 0.95, aLayer);

      // Boosted high-vibrance node color intensity multiplier (1.45x)
      vec3 slidingColorSpectrum = hsv2rgb(vec3(fract(aRnd + uSlideColorShift), 1.0, 1.3));
      vNodeColor = mix(aNodeColor * 1.4, slidingColorSpectrum, min(1.0, uSlideColorShift * 1.5)) * uBright * mix(0.8, 1.3, depthFactor) + vec3(shockwaveEffect * 1.0 + heartbeatEffect * 0.7 + neuralLightning * uGravitationalDistortion + neuralFlash * 1.2);

      float pointSizeCalculated = (0.011 + aRnd * 0.02) * mix(1.0, 1.5, aLayer) * (1.0 + uAmp * 0.75 + uHigh * 0.4 + shockwaveEffect * 0.6 + neuralFlash * 1.5);
      gl_PointSize = max(pointSizeCalculated * uPx / (-modelViewPosition.z) * mix(0.9, 1.3, depthFactor), 2.0);
      gl_Position = projectionMatrix * modelViewPosition;
    }
  `;

  const HYPER_FRAGMENT_SHADER = `
    precision highp float;
    varying vec3 vNodeColor;
    varying float vA;
    void main() {
      float radialCoord = length(gl_PointCoord - vec2(0.5));
      float coreKernel = smoothstep(0.5, 0.01, radialCoord);
      float outerHalo = smoothstep(0.5, 0.15, radialCoord) * 0.7;
      gl_FragColor = vec4(vNodeColor * (1.2 + outerHalo * 0.8), (coreKernel * 0.9 + outerHalo * 0.25) * vA);
    }
  `;

  function buildHyperParticlesMesh() {
    const positions = new Float32Array(SYSTEM_CFG.NODES_COUNT * 3);
    const randoms = new Float32Array(SYSTEM_CFG.NODES_COUNT);
    const layers = new Float32Array(SYSTEM_CFG.NODES_COUNT);
    const colors = new Float32Array(SYSTEM_CFG.NODES_COUNT * 3);
    const coreCutoff = Math.floor(SYSTEM_CFG.NODES_COUNT * 0.25);

    // Ultra-vibrant hyper-saturated neon palette
    const neonPalette = [
      [1.3, 0.2, 0.2], [0.2, 1.4, 0.4], [0.2, 0.7, 1.4],
      [1.4, 1.0, 0.1], [1.4, 0.2, 1.2], [0.1, 1.3, 1.4], [1.0, 0.4, 1.4]
    ];

    for (let i = 0; i < SYSTEM_CFG.NODES_COUNT; i++) {
      const isCoreNode = i < coreCutoff ? 1 : 0;
      const indexSub = isCoreNode ? i : (i - coreCutoff);
      const totalSub = isCoreNode ? coreCutoff : (SYSTEM_CFG.NODES_COUNT - coreCutoff);
      
      const yCoord = 1.0 - 2.0 * (indexSub + 0.5) / totalSub;
      const radiusAtY = Math.sqrt(Math.max(0.0, 1.0 - yCoord * yCoord));
      const thetaAngle = i * 2.3999632;
      const shellThickness = isCoreNode ? (0.38 + 0.24 * Math.random()) : (0.92 + 0.08 * Math.random());

      positions.set([
        Math.cos(thetaAngle) * radiusAtY * shellThickness,
        yCoord * shellThickness,
        Math.sin(thetaAngle) * radiusAtY * shellThickness
      ], i * 3);

      randoms[i] = Math.random();
      layers[i] = isCoreNode;
      colors.set(neonPalette[i % neonPalette.length], i * 3);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aRnd", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aLayer", new THREE.BufferAttribute(layers, 1));
    geometry.setAttribute("aNodeColor", new THREE.BufferAttribute(colors, 3));

    const material = new THREE.ShaderMaterial({
      vertexShader: HYPER_VERTEX_SHADER,
      fragmentShader: HYPER_FRAGMENT_SHADER,
      uniforms: UNIFORMS,
      transparent: true,
      depthWrite: false
    });

    const pointsMesh = new THREE.Points(geometry, material);
    pointsMesh.frustumCulled = false;
    pointsMesh.renderOrder = 1;
    return pointsMesh;
  }

  const hyperOrbGroup = new THREE.Group();
  const hyperParticlesMesh = buildHyperParticlesMesh();
  hyperOrbGroup.add(hyperParticlesMesh);
  scene.add(hyperOrbGroup);

  let coreLightMesh, multiColorRaysMesh, spectrumAudioRing, telemetryStreamRings, liquidGlassSphere, stardustField, raysData = [];

  function setupCoreAndFeatures() {
    const liquidGlassMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        uniform vec3 uBaseColor;
        uniform float uSlideColorShift;
        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = dot(viewDir, normal);
          fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
          fresnel = pow(fresnel, 2.0);

          vec3 slidingTint = mix(uBaseColor * 1.3, vec3(sin(uSlideColorShift*3.0)*0.6+0.5, cos(uSlideColorShift*2.0)*0.6+0.5, 1.0), min(1.0, uSlideColorShift));
          vec3 glassTint = mix(vec3(0.95, 0.98, 1.0), slidingTint, 0.6);
          float alpha = mix(0.2, 0.65, fresnel);

          gl_FragColor = vec4(glassTint * 1.3 + (fresnel * 0.7), alpha);
        }
      `,
      uniforms: { uBaseColor: UNIFORMS.uBaseColor, uSlideColorShift: UNIFORMS.uSlideColorShift },
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    liquidGlassSphere = new THREE.Mesh(new THREE.SphereGeometry(1.22, 64, 64), liquidGlassMat);
    liquidGlassSphere.renderOrder = 2;
    hyperOrbGroup.add(liquidGlassSphere);

    const coreMat = new THREE.ShaderMaterial({
      vertexShader: "varying vec3 vN; void main(){vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: `
        varying vec3 vN;
        uniform vec3 uBaseColor;
        uniform float uTime;
        void main() {
          float intensity = pow(1.0 - dot(vN, vec3(0, 0, 1)), 1.1);
          vec3 singularityBlack = vec3(0.01, 0.01, 0.02);
          vec3 blendedCore = mix(singularityBlack, uBaseColor * 1.5, 0.5 + 0.5 * sin(uTime * 4.0));
          gl_FragColor = vec4(blendedCore * 1.4, 1.0 * intensity);
        }
      `,
      uniforms: { uBaseColor: UNIFORMS.uBaseColor, uTime: UNIFORMS.uTime },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    coreLightMesh = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), coreMat);
    coreLightMesh.renderOrder = 1;
    hyperOrbGroup.add(coreLightMesh);

    const rayPositions = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 6);
    const rayAlphas = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 2);
    const rayColors = new Float32Array(SYSTEM_CFG.RAYS_COUNT * 6);
    const rayColorPalette = [[1.4, 0.2, 0.3], [0.2, 1.4, 0.5], [0.2, 0.7, 1.4], [1.4, 1.1, 0.1], [1.4, 0.2, 1.3], [0.1, 1.3, 1.4]];

    for (let i = 0; i < SYSTEM_CFG.RAYS_COUNT; i++) {
      const u = Math.random(), v = Math.random();
      const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
      const dirX = Math.sin(phi) * Math.cos(theta);
      const dirY = Math.cos(phi);
      const dirZ = Math.sin(phi) * Math.sin(theta);
      const assignedCol = rayColorPalette[i % rayColorPalette.length];

      raysData.push({
        dir: new THREE.Vector3(dirX, dirY, dirZ),
        lengthFactor: 0.9 + Math.random() * 1.1,
        speed: 2.2 + Math.random() * 4.5,
        offset: Math.random() * Math.PI * 2.0
      });

      rayColors.set(assignedCol, i * 6);
      rayColors.set([assignedCol[0]*0.3, assignedCol[1]*0.3, assignedCol[2]*0.3], i * 6 + 3);
    }

    const rayGeo = new THREE.BufferGeometry();
    rayGeo.setAttribute("position", new THREE.BufferAttribute(rayPositions, 3));
    rayGeo.setAttribute("aAlpha", new THREE.BufferAttribute(rayAlphas, 1));
    rayGeo.setAttribute("aColor", new THREE.BufferAttribute(rayColors, 3));

    const rayMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute float aAlpha;
        attribute vec3 aColor;
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          vAlpha = aAlpha;
          vColor = aColor;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          gl_FragColor = vec4(vColor * 1.4, vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    multiColorRaysMesh = new THREE.LineSegments(rayGeo, rayMat);
    multiColorRaysMesh.renderOrder = 3;
    hyperOrbGroup.add(multiColorRaysMesh);

    const specGeo = new THREE.BufferGeometry();
    const specCount = 64;
    const specPos = new Float32Array(specCount * 6);
    specGeo.setAttribute("position", new THREE.BufferAttribute(specPos, 3));
    
    spectrumAudioRing = new THREE.LineSegments(specGeo, new THREE.LineBasicMaterial({
      color: 0x4fe3ff,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    }));
    hyperOrbGroup.add(spectrumAudioRing);

    const teleGeo = new THREE.BufferGeometry();
    const teleCount = 36;
    const telePos = new Float32Array(teleCount * 6);
    teleGeo.setAttribute("position", new THREE.BufferAttribute(telePos, 3));
    
    telemetryStreamRings = new THREE.LineSegments(teleGeo, new THREE.LineBasicMaterial({
      color: 0xb48eff,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending
    }));
    hyperOrbGroup.add(telemetryStreamRings);

    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(SYSTEM_CFG.STARDUST_COUNT * 3);
    for(let i=0; i<SYSTEM_CFG.STARDUST_COUNT*3; i+=3) {
      dustPos[i] = (Math.random() - 0.5) * 8.0;
      dustPos[i+1] = (Math.random() - 0.5) * 8.0;
      dustPos[i+2] = (Math.random() - 0.5) * 4.0;
    }
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    stardustField = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.03,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    }));
    scene.add(stardustField);
  }

  let glowMaterial, glowMesh, ringMesh1, ringMesh2, ringMesh3, dataGridRings, lockRingX, lockRingZ;
  let orbitingPointsMesh, orbitalDataList = [];

  function setupGlowAndRings() {
    glowMaterial = new THREE.ShaderMaterial({
      vertexShader: "varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: `
        varying vec2 vUv;
        uniform float uStrength;
        uniform vec3 uBaseColor;
        void main() {
          vec2 coord = vUv - 0.5;
          float dist = length(coord) * 2.0;
          float outerRing = (dist > 0.6 ? exp(-(dist - 0.6) * 6.0) * 0.95 : 0.0) * smoothstep(1.0, 0.72, dist);
          float innerGlow = exp(-dist * 2.8) * 0.45;
          float combined = outerRing + innerGlow;
          gl_FragColor = vec4(uBaseColor * 1.4, clamp(combined * uStrength * 0.9, 0.0, 0.95));
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      uniforms: {
        uStrength: { value: 0.85 },
        uBaseColor: UNIFORMS.uBaseColor
      }
    });

    glowMesh = new THREE.Mesh(new THREE.PlaneGeometry(SYSTEM_CFG.VIS, SYSTEM_CFG.VIS), glowMaterial);
    glowMesh.position.z = -0.05;
    glowMesh.renderOrder = -2;
    scene.add(glowMesh);

    ringMesh1 = createCustomRing(1.3, 1.32, 2, 0.0, 0.75);
    ringMesh2 = createCustomRing(1.42, 1.432, 3, 2.1, 0.55);
    ringMesh3 = createCustomRing(1.18, 1.192, 5, 4.2, 0.45);

    lockRingX = createCustomRing(1.48, 1.5, 4, 1.0, 0.65);
    lockRingZ = createCustomRing(1.56, 1.58, 6, 3.0, 0.65);
    lockRingX.rotation.x = Math.PI / 2;
    lockRingZ.rotation.z = Math.PI / 3;
    scene.add(lockRingX);
    scene.add(lockRingZ);

    const gridGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(1.6, 16, 12));
    dataGridRings = new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({
      color: 0x4fe3ff,
      transparent: true,
      opacity: 0.28,
      blending: THREE.AdditiveBlending
    }));
    hyperOrbGroup.add(dataGridRings);

    setupOrbitalParticles();
  }

  function createCustomRing(innerRadius, outerRadius, segmentsCount, seedValue, alphaValue) {
    const ringMesh = new THREE.Mesh(
      new THREE.RingGeometry(innerRadius, outerRadius, 144, 1),
      new THREE.ShaderMaterial({
        vertexShader: "varying vec2 vP; void main(){vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
        fragmentShader: `
          varying vec2 vP;
          uniform float uAlpha;
          uniform vec3 uBaseColor;
          void main() {
            float angle = atan(vP.y, vP.x);
            float dash = smoothstep(-0.22, 0.38, sin(angle * 3.0)) * 0.9;
            gl_FragColor = vec4(uBaseColor * 1.3, dash * uAlpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uAlpha: { value: alphaValue },
          uBaseColor: UNIFORMS.uBaseColor
        }
      })
    );
    ringMesh.renderOrder = 0;
    scene.add(ringMesh);
    return ringMesh;
  }

  function setupOrbitalParticles() {
    const pos = new Float32Array(SYSTEM_CFG.ORBIT_COUNT * 3);
    const sz = new Float32Array(SYSTEM_CFG.ORBIT_COUNT);
    const alp = new Float32Array(SYSTEM_CFG.ORBIT_COUNT);
    const col = new Float32Array(SYSTEM_CFG.ORBIT_COUNT * 3);
    const multiPalette = [[1.4, 0.2, 0.2], [0.2, 1.4, 0.5], [0.2, 0.7, 1.4], [1.4, 1.1, 0.1], [1.4, 0.2, 1.3]];

    for (let i = 0; i < SYSTEM_CFG.ORBIT_COUNT; i++) {
      col.set(multiPalette[i % multiPalette.length], i * 3);
      sz[i] = 0.025 + Math.random() * 0.06;
      orbitalDataList.push({
        a: Math.random() * 6.283,
        r: 1.5 + Math.random() * 0.68,
        sp: (0.1 + Math.random() * 0.24) * (Math.random() < 0.5 ? -1 : 1),
        ph: Math.random() * 6.283,
        tilt: (Math.random() - 0.5) * 1.4,
        y: (Math.random() - 0.5) * 1.2,
        fs: 0.2 + Math.random() * 0.5
      });
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geom.setAttribute("aSize", new THREE.BufferAttribute(sz, 1));
    geom.setAttribute("aAlpha", new THREE.BufferAttribute(alp, 1));
    geom.setAttribute("aColor", new THREE.BufferAttribute(col, 3));

    orbitingPointsMesh = new THREE.Points(geom, new THREE.ShaderMaterial({
      vertexShader: "attribute float aSize, aAlpha; attribute vec3 aColor; uniform float uPx; varying float vA; varying vec3 vC; void main(){vA=aAlpha; vC=aColor * 1.3; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=max(aSize*uPx/(-mv.z),1.2); gl_Position=projectionMatrix*mv;}",
      fragmentShader: "precision highp float; varying vec3 vC; varying float vA; void main(){float d=length(gl_PointCoord-vec2(0.5)); gl_FragColor=vec4(vC, smoothstep(0.5,0.02,d)*vA);}",
      transparent: true,
      depthWrite: false,
      uniforms: { uPx: UNIFORMS.uPx }
    }));
    orbitingPointsMesh.frustumCulled = false;
    orbitingPointsMesh.renderOrder = 3;
    scene.add(orbitingPointsMesh);
  }

  setupCoreAndFeatures();
  setupGlowAndRings();

  function applyColorTheme(hexColor) {
    const colorObj = new THREE.Color(hexColor);
    UNIFORMS.uBaseColor.value.copy(colorObj);
    if(spectrumAudioRing) spectrumAudioRing.material.color.copy(colorObj);
    if(liquidGlassSphere) liquidGlassSphere.material.uniforms.uBaseColor.value.copy(colorObj);
    if(lockRingX) lockRingX.material.uniforms.uBaseColor.value.copy(colorObj);
    if(lockRingZ) lockRingZ.material.uniforms.uBaseColor.value.copy(colorObj);
  }

  let activeStateKey = "idle";
  const currentInterp = Object.assign({}, STATE_CFG.idle);
  const targetInterp = Object.assign({}, STATE_CFG.idle);

  function setSystemState(stateKey) {
    if (!STATE_CFG[stateKey]) return;
    activeStateKey = stateKey;
    Object.assign(targetInterp, STATE_CFG[stateKey]);
  }

  let audioLevelBuffer = 0;
  function processAudioSim(timeVal, dtVal) {
    let targetL = 0.05;
    if (activeStateKey === "speaking") {
      const syl = Math.pow(Math.abs(Math.sin(timeVal * 7.3) * Math.sin(timeVal * 2.1 + 1.0)), 0.75);
      const gate = Math.sin(timeVal * 0.95) > -0.68 ? 1.0 : 0.14;
      targetL = (0.32 + 0.48 * syl) * gate;
    } else if (activeStateKey === "listening") {
      targetL = 0.22 + 0.22 * Math.abs(Math.sin(timeVal * 3.2));
    } else if (activeStateKey === "thinking") {
      targetL = 0.14 + 0.08 * Math.sin(timeVal * 2.4);
    }
    const smoothCoeff = 1.0 - Math.exp(-dtVal * (targetL > audioLevelBuffer ? 20.0 : 7.0));
    audioLevelBuffer += (targetL - audioLevelBuffer) * smoothCoeff;
  }

  let isDragging = false, prevX = 0, prevY = 0, vX = 0, vY = 0;
  DOM.canvas.addEventListener("pointerdown", e => {
    isDragging = true; prevX = e.clientX; prevY = e.clientY;
    UNIFORMS.uShockwaveTime.value = globalTime;
    UNIFORMS.uTouchWeight.value = 0.8;
    DOM.canvas.setPointerCapture(e.pointerId);
  });
  DOM.canvas.addEventListener("pointermove", e => {
    if (!isDragging) return;
    const deltaX = e.clientX - prevX;
    const deltaY = e.clientY - prevY;
    
    vY += deltaX * 0.012;
    vX += deltaY * 0.012;

    const slideIntensity = Math.sqrt(deltaX * deltaX + deltaY * deltaY) * 0.015;
    UNIFORMS.uSlideColorShift.value = (UNIFORMS.uSlideColorShift.value + slideIntensity) % 10.0;
    
    const rect = DOM.canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    UNIFORMS.uTouchPull.value.set(x * 1.5, y * 1.5, 0.5);

    prevX = e.clientX; prevY = e.clientY;
  });
  const stopDrag = () => { 
    isDragging = false; 
    UNIFORMS.uTouchWeight.value = 0.0; 
  };
  DOM.canvas.addEventListener("pointerup", stopDrag);
  DOM.canvas.addEventListener("pointercancel", stopDrag);

  let globalTime = 0, lastFrameTime = performance.now();

  function executeRenderLoop(timestamp) {
    requestAnimationFrame(executeRenderLoop);
    const dt = Math.min((timestamp - lastFrameTime) / 1000.0, 0.05);
    lastFrameTime = timestamp;

    const lerpCoeff = 1.0 - Math.exp(-dt * 3.8);
    for (const k in currentInterp) {
      currentInterp[k] += (targetInterp[k] - currentInterp[k]) * lerpCoeff;
    }

    globalTime += dt;
    processAudioSim(globalTime, dt);

    UNIFORMS.uSlideColorShift.value *= Math.exp(-dt * 2.0);

    const heartbeatTrigger = activeStateKey === "idle" ? Math.max(0, Math.sin(globalTime * 2.1)) * 0.12 : 0;
    UNIFORMS.uHeartbeatPulse.value = heartbeatTrigger;

    const targetDistortion = activeStateKey === "thinking" ? 1.0 : 0.0;
    UNIFORMS.uGravitationalDistortion.value += (targetDistortion - UNIFORMS.uGravitationalDistortion.value) * lerpCoeff;

    const meshScale = currentInterp.scale * (1.0 + 0.018 * Math.sin(globalTime * 1.2) + audioLevelBuffer * 0.075);

    hyperOrbGroup.scale.setScalar(meshScale);
    hyperOrbGroup.rotation.y += dt * 0.18 * 0.9 + vY * Math.min(dt * 20.0, 1.0) * 0.5;
    hyperOrbGroup.rotation.x = Math.max(-1.2, Math.min(1.2, hyperOrbGroup.rotation.x + vX * Math.min(dt * 20.0, 1.0) * 0.5));
    vX *= Math.exp(-dt * 5.0); vY *= Math.exp(-dt * 5.0);
    if (!isDragging && Math.abs(hyperOrbGroup.rotation.x) > 0.001) hyperOrbGroup.rotation.x *= Math.exp(-dt * 0.6);

    const ringSpeedMultiplier = activeStateKey === "thinking" ? 4.0 : 1.0;
    if(lockRingX) lockRingX.rotation.y += dt * 1.2 * ringSpeedMultiplier;
    if(lockRingZ) lockRingZ.rotation.z -= dt * 1.5 * ringSpeedMultiplier;

    if(dataGridRings) {
      dataGridRings.rotation.y -= dt * 0.15;
      dataGridRings.rotation.x += dt * 0.1;
    }

    UNIFORMS.uTime.value = globalTime;
    UNIFORMS.uAmp.value = audioLevelBuffer;
    UNIFORMS.uBass.value = audioLevelBuffer * 1.2;
    UNIFORMS.uHigh.value = audioLevelBuffer * 0.9;
    UNIFORMS.uBright.value = currentInterp.bright;

    glowMaterial.uniforms.uStrength.value = currentInterp.glow + audioLevelBuffer * 0.65;

    if (spectrumAudioRing) {
      const specPosAttr = spectrumAudioRing.geometry.attributes.position;
      const specCount = 64;
      for (let i = 0; i < specCount; i++) {
        const angle = (i / specCount) * Math.PI * 2;
        const nextAngle = ((i + 1) / specCount) * Math.PI * 2;
        const waveSpike = Math.sin(angle * 4.0 + globalTime * 5.0) * audioLevelBuffer * 0.4;
        const r1 = 1.25 + waveSpike;
        const r2 = 1.25 + Math.sin(nextAngle * 4.0 + globalTime * 5.0) * audioLevelBuffer * 0.4;
        
        specPosAttr.setXYZ(i * 2, Math.cos(angle) * r1, Math.sin(angle * 2.0) * 0.2, Math.sin(angle) * r1);
        specPosAttr.setXYZ(i * 2 + 1, Math.cos(nextAngle) * r2, Math.sin(nextAngle * 2.0) * 0.2, Math.sin(nextAngle) * r2);
      }
      specPosAttr.needsUpdate = true;
    }

    if (telemetryStreamRings) {
      const telePosAttr = telemetryStreamRings.geometry.attributes.position;
      const teleCount = 36;
      for (let i = 0; i < teleCount; i++) {
        const angle = (i / teleCount) * Math.PI * 2 + globalTime * 0.5;
        const nextAngle = ((i + 0.7) / teleCount) * Math.PI * 2 + globalTime * 0.5;
        const r = 1.55;
        telePosAttr.setXYZ(i * 2, Math.cos(angle) * r, Math.sin(globalTime + i) * 0.3, Math.sin(angle) * r);
        telePosAttr.setXYZ(i * 2 + 1, Math.cos(nextAngle) * r, Math.sin(globalTime + i) * 0.3, Math.sin(nextAngle) * r);
      }
      telePosAttr.needsUpdate = true;
    }

    const rayPosAttr = multiColorRaysMesh.geometry.attributes.position;
    const rayAlphaAttr = multiColorRaysMesh.geometry.attributes.aAlpha;
    const rayIntensityMultiplier = currentInterp.rayInt || 1.3;

    for (let i = 0; i < SYSTEM_CFG.RAYS_COUNT; i++) {
      const ray = raysData[i];
      const pulsePhase = Math.sin(globalTime * ray.speed + ray.offset) * 0.5 + 0.5;
      const currentLength = (0.5 + pulsePhase * ray.lengthFactor * 1.4) * (1.0 + audioLevelBuffer * 0.9);
      
      const startX = ray.dir.x * 0.4, startY = ray.dir.y * 0.4, startZ = ray.dir.z * 0.4;
      const endX = ray.dir.x * currentLength, endY = ray.dir.y * currentLength, endZ = ray.dir.z * currentLength;

      rayPosAttr.setXYZ(i * 2, startX, startY, startZ);
      rayPosAttr.setXYZ(i * 2 + 1, endX, endY, endZ);

      rayAlphaAttr.setX(i * 2, 1.0 * rayIntensityMultiplier);
      rayAlphaAttr.setX(i * 2 + 1, pulsePhase * 0.35 * rayIntensityMultiplier);
    }
    rayPosAttr.needsUpdate = true;
    rayAlphaAttr.needsUpdate = true;

    const orbAttr = orbitingPointsMesh.geometry.attributes.position;
    const orbAlphaAttr = orbitingPointsMesh.geometry.attributes.aAlpha;

    for (let i = 0; i < SYSTEM_CFG.ORBIT_COUNT; i++) {
      const data = orbitalDataList[i];
      data.a += data.sp * dt * 0.8;
      const radiusVal = data.r + Math.sin(globalTime * data.fs + data.ph) * 0.13 + audioLevelBuffer * 0.12;
      const xPos = Math.cos(data.a) * radiusVal;
      const zPos = Math.sin(data.a) * radiusVal * 0.62;
      const yPos = data.y * 0.82 + Math.sin(data.a * 1.3 + data.ph) * 0.19 + xPos * data.tilt * 0.26;
      
      orbAttr.setXYZ(i, xPos, yPos, zPos);
      orbAlphaAttr.setX(i, Math.pow(0.5 + 0.5 * Math.sin(globalTime * data.fs * 1.6 + data.ph), 1.5) * (0.7 + currentInterp.glow * 0.3));
    }
    orbAttr.needsUpdate = true;
    orbAlphaAttr.needsUpdate = true;

    renderer.render(scene, camera);
  }

  function handleResizeProtocol() {
    const w = Math.max(DOM.stage.clientWidth, 1);
    const h = Math.max(DOM.stage.clientHeight, 1);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;

    const visibleHeight = SYSTEM_CFG.VIS / Math.min(1.0, w / h);
    const tangentValue = Math.tan(THREE.MathUtils.degToRad(SYSTEM_CFG.FOV / 2.0));
    camera.position.z = visibleHeight / (2.0 * tangentValue);
    UNIFORMS.uCamZ.value = camera.position.z;
    camera.updateProjectionMatrix();
  }

  window.addEventListener("resize", handleResizeProtocol);
  window.addEventListener("orientationchange", () => setTimeout(handleResizeProtocol, 200));

  window.JarvisOrb = Object.freeze({
    setState: setSystemState,
    setTheme: function(themeName) {
      const themeMap = { light: "#2f6bff", dark: "#5b8cff", red: "#ff4d5e", emerald: "#10b981", gold: "#f59e0b" };
      if(themeMap[themeName]) applyColorTheme(themeMap[themeName]);
    },
    setBackground: function(hexColor) {
      applyColorTheme(hexColor);
    },
    setExternalAudio: function(lvl) {
      audioLevelBuffer = Math.max(0, Math.min(1, Number(lvl) || 0));
    },
    startListening: () => setSystemState("listening"),
    startThinking: () => setSystemState("thinking"),
    startSpeaking: () => setSystemState("speaking"),
    stopSpeaking: () => setSystemState("idle"),
    startAudioReactive: () => true,
    stopAudioReactive: () => {}
  });

  handleResizeProtocol();
  setSystemState(SYSTEM_CFG.DEFAULT_STATE);
  requestAnimationFrame(executeRenderLoop);
})();
</script>
</body>
</html>
