<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Particle Orb</title>
<style>
:root{--bg:#fff;--fg:#1d2340;--sub:#6b7390;--glass:rgba(255,255,255,.72);--gb:rgba(255,255,255,.9);--chip:#4a527a;--t1:#2f6bff;--t2:#8b5cf6;--t3:#c15de0;--sh:rgba(70,80,170,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#touchParticles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{text-align:center;padding-top:clamp(12px,3.5vh,36px);flex:none}
h1{font-size:clamp(22px,4.2vh,34px);font-weight:700;letter-spacing:.3em;padding-left:.3em;background:linear-gradient(90deg,var(--t1),var(--t2) 60%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin-top:6px;font-size:clamp(12px,1.8vh,15px);color:var(--sub);letter-spacing:.04em}
#stage{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:900px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#shadow{position:absolute;left:50%;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--sh),transparent);filter:blur(4px);animation:float 5s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{opacity:.6;transform:translateX(-50%) scaleX(.9)}}
#status{flex:none;display:flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(0,0,0,.12),inset 0 0 0 1px var(--gb);font-size:13px;font-weight:600;letter-spacing:.22em;color:var(--fg)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--t1);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.panel{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:10px;padding:6px;border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 0 0 1px var(--gb);max-width:100%}
#panel{margin-bottom:clamp(12px,2.5vh,24px)}
button{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.1em;border:0;border-radius:13px;padding:10px 13px;color:var(--chip);background:transparent;cursor:pointer;transition:all .2s}
button.on{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 4px 14px rgba(0,0,0,.25)}
#bgc{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
#bgc::-webkit-color-swatch-wrapper{padding:0}#bgc::-webkit-color-swatch{border:2px solid var(--gb);border-radius:50%}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:#1d2340;color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Hide all HTML panels immediately so they never flash */
#themes,
#panel,
#status,
#toast,
#err,
header {
  display: none !important;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: transparent !important;
  background-color: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  display: flex;
  justify-content: center;
  align-items: center;
}

#stage {
  position: relative;
  width: 100%;
  height: 100%;
  margin: 0 !important;
  padding: 0 !important;
}
</style>
</head>
<body class="embedded">
<canvas id="touchParticles" aria-hidden="true"></canvas>
<div id="stage"><canvas id="c"></canvas><div id="shadow"></div></div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
const isEmbedded = true;
if (isEmbedded) {
  document.body.classList.add("embedded");
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
}

const FOV=45, VIS=3.1, ORBIT=36, COUNT=6000;
const STATES={
  idle:     {scale:1.00,speed:.35,cyan:.35,purple:.45,bright:1.00,glow:.50,ring:.15,wob:0},
  listening:{scale:1.05,speed:.85,cyan:1.00,purple:.25,bright:1.12,glow:.95,ring:.35,wob:0},
  thinking: {scale:1.00,speed:1.55,cyan:.30,purple:1.00,bright:1.05,glow:.75,ring:1.00,wob:1},
  speaking: {scale:1.04,speed:1.15,cyan:.90,purple:.90,bright:1.20,glow:1.00,ring:.45,wob:0}
};
const LABELS={idle:"READY",listening:"LISTENING",thinking:"THINKING...",speaking:"SPEAKING"};
const $=s=>document.querySelector(s);
const stage=$("#stage"),canvas=$("#c"),shadowEl=$("#shadow");

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:"high-performance"});}
catch(e){$("#err").style.display="block";stage.style.display="none";return;}
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,1,.1,50);
camera.position.set(0,0,6);

/* Shared uniforms */
const U={uTime:{value:0},uAmp:{value:0},uBass:{value:0},uHigh:{value:0},uCyan:{value:.35},uPurple:{value:.45},uBright:{value:1},uPx:{value:300},uCamZ:{value:6},DEEP:{value:new THREE.Color()},BLUE:{value:new THREE.Color()},CYAN:{value:new THREE.Color()},PURP:{value:new THREE.Color()}};
const UNI="uniform float uTime,uAmp,uBass,uHigh,uCyan,uPurple,uBright,uPx,uCamZ;uniform vec3 DEEP,BLUE,CYAN,PURP;";
const PAL="";

/* ---------- 3D particle volume ---------- */
const partV=UNI+PAL+`attribute float aRnd;varying vec3 vC;varying float vA;
void main(){
 float base=length(position);vec3 d=position/base;float t=uTime;
 float n=sin(d.x*3.+t*.8+aRnd*6.)*sin(d.y*3.-t*.6)*sin(d.z*3.+t*.5);
 float r=base*(1.+n*.05+uAmp*.1*aRnd+.015*sin(t*2.+aRnd*20.));
 vec4 mv=modelViewMatrix*vec4(d*r,1.);
 float depth=smoothstep(-1.,1.,mv.z+uCamZ);          /* 0 = back, 1 = front */
 vA=mix(.22,1.,depth);
 vec3 c=mix(BLUE,CYAN,smoothstep(-.5,.9,d.y+n)*uCyan);
 c=mix(c,PURP,smoothstep(.1,.9,d.x*.6-d.y*.3+aRnd*.4)*uPurple);
 c=mix(DEEP,c,.5+.5*aRnd);
 vC=c*uBright*mix(.6,1.,depth);
 gl_PointSize=max((.009+aRnd*.017)*(1.+uAmp*.5)*uPx/(-mv.z)*mix(.85,1.2,depth),1.7);
 gl_Position=projectionMatrix*mv;}`;
const dotF="precision highp float;varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC,smoothstep(.5,.05,d)*vA);}";
function buildParticles(){
  const pos=new Float32Array(COUNT*3),rnd=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const y=1-2*(i+.5)/COUNT,r=Math.sqrt(1-y*y),th=i*2.39996;
    const shell=.93+.07*Math.random();   /* outer skin + filled interior */
    pos.set([Math.cos(th)*r*shell,y*shell,Math.sin(th)*r*shell],i*3);rnd[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aRnd",new THREE.BufferAttribute(rnd,1));
  const p=new THREE.Points(g,new THREE.ShaderMaterial({vertexShader:partV,fragmentShader:dotF,uniforms:U,transparent:true,depthWrite:false}));
  p.frustumCulled=false;p.renderOrder=1;return p;
}

const orb=new THREE.Group();
const pointsMesh=buildParticles();
orb.add(pointsMesh);scene.add(orb);

/* ---------- Alternate orb skins and a procedural 3D Iron Man-inspired helmet ---------- */
let orbStyle = "default";
// Extra fine orbital bands give the selectable variants distinct silhouettes.
function makeStyleRing(radius, tube, color, opacity, tiltX, tiltY) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 10, 180),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false})
  );
  mesh.rotation.set(tiltX, tiltY, 0);
  return mesh;
}

/* Siri-style transparent glass Aurora orb adapted from the supplied standalone HTML.
   Runs inside JARVIS's existing Three.js canvas and uses the app's voice-state animation. */
const siriGlassAurora = new THREE.Group();
scene.add(siriGlassAurora);
const glassUniforms = {
  uTime:{value:0}, uEnergy:{value:0}, uState:{value:0},
  uCyan:{value:new THREE.Color(0x00f2fe)}, uBlue:{value:new THREE.Color(0x2962ff)},
  uPurple:{value:new THREE.Color(0xa855f7)}, uMint:{value:new THREE.Color(0x00ffaa)}
};
const glassMaterial = new THREE.ShaderMaterial({
  uniforms:glassUniforms, transparent:true, depthWrite:false, side:THREE.FrontSide,
  vertexShader:`varying vec3 vNormalW; varying vec3 vPos; varying vec2 vUv;
    void main(){ vUv=uv; vPos=position; vNormalW=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform float uTime,uEnergy,uState; uniform vec3 uCyan,uBlue,uPurple,uMint;
    varying vec3 vNormalW; varying vec3 vPos; varying vec2 vUv;
    void main(){
      vec3 n=normalize(vNormalW); float fres=pow(1.0-abs(n.z),3.0);
      float r=length(vPos.xy); float a=atan(vPos.y,vPos.x);
      float warp=0.035*sin(a*3.0+uTime*1.4)+0.018*cos(a*5.0-uTime*1.9);
      float phase=(r+warp)*31.0-uTime*(1.8+uState*.5);
      float bands=pow(.5+.5*cos(phase),11.0);
      float silk=exp(-abs(sin(a*2.4+vPos.z*5.0+uTime*1.1))*13.0);
      vec3 aurora=mix(uCyan,uBlue,.5+.5*sin(a*2.0-uTime));
      aurora=mix(aurora,uPurple,.5+.5*sin(a*1.7+uTime*.7));
      aurora=mix(aurora,uMint,.5+.5*cos(vPos.y*5.0-uTime*1.4));
      vec3 col=vec3(.008,.02,.055)+aurora*(bands*.48+silk*.22+fres*.8);
      float highlight=pow(max(0.0,dot(n,normalize(vec3(-.45,.6,.8)))),42.0);
      col+=vec3(.82,.96,1.0)*highlight*.95;
      col+=aurora*fres*(.7+uEnergy*.65);
      float alpha=clamp(.34+fres*.56+bands*.18+highlight*.3,0.0,.96);
      gl_FragColor=vec4(col,alpha);
    }`
});
const glassSphere = new THREE.Mesh(new THREE.SphereGeometry(.99,96,64),glassMaterial);
siriGlassAurora.add(glassSphere);
const glassRings=[];
[
  [1.025,.010,0x00f2fe,.70,.52,.20],
  [1.075,.008,0x4facfe,.62,-.66,.54],
  [1.125,.007,0x00ffaa,.52,.22,-.78],
  [1.175,.006,0xa855f7,.44,-.34,-.45],
  [0.91,.005,0xffffff,.28,.95,.12]
].forEach(([r,t,c,o,x,y])=>{
  const ring=makeStyleRing(r,t,c,o,x,y);
  ring.material.blending=THREE.AdditiveBlending;
  ring.material.depthWrite=false;
  glassRings.push(ring); siriGlassAurora.add(ring);
});
siriGlassAurora.visible=false;

const helmet = new THREE.Group();
scene.add(helmet);
// The original helmet looked black because MeshStandardMaterial had no scene lights.
// Add soft studio lighting and subtle emissive colour so its red/gold structure reads clearly.
const helmetHemi=new THREE.HemisphereLight(0xd9f5ff,0x321018,2.15); scene.add(helmetHemi);
const helmetKey = new THREE.DirectionalLight(0xffffff,3.1); helmetKey.position.set(-3,4,6); scene.add(helmetKey);
const helmetFill = new THREE.DirectionalLight(0xffb84d,2.0); helmetFill.position.set(4,1,4); scene.add(helmetFill);
const helmetRim = new THREE.PointLight(0x35dcff,2.2,12); helmetRim.position.set(0,1,-3); scene.add(helmetRim);
function setStudioLight(mult){helmetHemi.intensity=2.15*mult;helmetKey.intensity=3.1*mult;helmetFill.intensity=2.0*mult;helmetRim.intensity=2.2*mult;}
const redMetal = new THREE.MeshStandardMaterial({color:0xe5222d,metalness:.48,roughness:.28,emissive:0x4a0508,emissiveIntensity:.42});
const goldMetal = new THREE.MeshStandardMaterial({color:0xffc94f,metalness:.38,roughness:.27,emissive:0x4b2600,emissiveIntensity:.28});
const darkMetal = new THREE.MeshStandardMaterial({color:0x252b35,metalness:.55,roughness:.31,emissive:0x080c14,emissiveIntensity:.35});
const trimMetal = new THREE.MeshStandardMaterial({color:0xf5e4b1,metalness:.5,roughness:.25,emissive:0x352000,emissiveIntensity:.2});
const eyeGlowMat = new THREE.MeshBasicMaterial({color:0x9cfaff,transparent:true,opacity:1});
function helmetPart(geometry, material, position, scale, rotation) {
  const m = new THREE.Mesh(geometry,material);
  m.position.set(position[0],position[1],position[2]);
  m.scale.set(scale[0],scale[1],scale[2]);
  if(rotation) m.rotation.set(rotation[0],rotation[1],rotation[2]);
  helmet.add(m); return m;
}
function helmetPlate(points,material,z,depth=.055) {
  const shape=new THREE.Shape();
  shape.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++) shape.lineTo(points[i][0],points[i][1]);
  shape.closePath();
  const mesh=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSegments:1,steps:1,bevelSize:.018,bevelThickness:.012}),material);
  mesh.position.z=z; helmet.add(mesh); return mesh;
}
// Sculpted red crown and side shell, with a distinct angular gold faceplate.
helmetPart(new THREE.SphereGeometry(.78,48,36),redMetal,[0,.12,0],[1,1.17,.76]);
helmetPart(new THREE.SphereGeometry(.59,32,24),redMetal,[0,.38,.18],[.96,.76,.77]);
helmetPlate([[-.43,.35],[-.32,.57],[0,.65],[.32,.57],[.43,.35],[.34,.12],[.25,-.20],[.13,-.43],[0,-.49],[-.13,-.43],[-.25,-.20],[-.34,.12]],goldMetal,.60,.07);
// Raised red brow and centre ridge define the helmet silhouette.
helmetPlate([[-.45,.43],[-.30,.61],[0,.69],[.30,.61],[.45,.43],[.31,.39],[0,.48],[-.31,.39]],redMetal,.69,.065);
helmetPart(new THREE.BoxGeometry(.075,.54,.10),trimMetal,[0,.08,.705],[1,1,1]);
// Angular red cheek guards and lower jaw panels.
helmetPlate([[-.50,.16],[-.38,.12],[-.31,-.20],[-.18,-.39],[-.32,-.48],[-.48,-.29]],redMetal,.66,.06);
helmetPlate([[.50,.16],[.38,.12],[.31,-.20],[.18,-.39],[.32,-.48],[.48,-.29]],redMetal,.66,.06);
helmetPlate([[-.30,-.27],[-.17,-.43],[0,-.47],[.17,-.43],[.30,-.27],[.20,-.52],[0,-.59],[-.20,-.52]],goldMetal,.70,.065);
// Dark mouth grille with visible horizontal vent slats.
helmetPlate([[-.19,-.39],[.19,-.39],[.16,-.51],[0,-.55],[-.16,-.51]],darkMetal,.775,.035);
for(let i=0;i<3;i++) helmetPart(new THREE.BoxGeometry(.22,.018,.018),trimMetal,[0,-.425-i*.035,.817],[1,1,1]);
// Eye sockets and cyan luminous lenses, angled inward like a superhero faceplate.
helmetPlate([[-.40,.19],[-.13,.22],[-.19,.10],[-.35,.08]],darkMetal,.735,.035);
helmetPlate([[.40,.19],[.13,.22],[.19,.10],[.35,.08]],darkMetal,.735,.035);
const eyeL=helmetPart(new THREE.BoxGeometry(.235,.065,.035),eyeGlowMat,[-.275,.145,.79],[1,1,1],[0,0,.22]);
const eyeR=helmetPart(new THREE.BoxGeometry(.235,.065,.035),eyeGlowMat,[.275,.145,.79],[1,1,1],[0,0,-.22]);
// Ear discs, segmented side armour, and gold panel seams.
helmetPart(new THREE.CylinderGeometry(.13,.13,.10,12),goldMetal,[-.76,.03,.02],[1,1,1],[Math.PI/2,0,0]);
helmetPart(new THREE.CylinderGeometry(.13,.13,.10,12),goldMetal,[.76,.03,.02],[1,1,1],[Math.PI/2,0,0]);
helmetPart(new THREE.BoxGeometry(.12,.32,.10),redMetal,[-.69,-.12,.28],[1,1,1],[0,0,-.12]);
helmetPart(new THREE.BoxGeometry(.12,.32,.10),redMetal,[.69,-.12,.28],[1,1,1],[0,0,.12]);
helmet.scale.setScalar(1.08);
helmet.visible=false; siriGlassAurora.visible=false;

/* ---------- Full 3D human assistant: head with face, torso, arms with real hands and fingers, legs ---------- */
const fullHuman = new THREE.Group();
scene.add(fullHuman);
const human = (function buildHuman(){
  const M = (c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.62,metalness:.04},o||{}));
  const skin   = M(0xc08a64,{roughness:.58});
  const skinDk = M(0x8e5a3c,{roughness:.7});
  const lipMat = M(0x9a4a44,{roughness:.5});
  const hairM  = M(0x120f12,{roughness:.55,metalness:.1});
  const jacket = M(0x151e30,{roughness:.5,metalness:.25});
  const jacketDk = M(0x0d1424,{roughness:.55,metalness:.2});
  const shirt  = M(0x2a3a52,{roughness:.7});
  const pants  = M(0x1b2437,{roughness:.62});
  const shoe   = M(0xeef3f8,{roughness:.45});
  const sole   = new THREE.MeshStandardMaterial({color:0x21d9ff,emissive:0x21d9ff,emissiveIntensity:1.1,roughness:.4});
  const trim   = new THREE.MeshStandardMaterial({color:0x21d9ff,emissive:0x21d9ff,emissiveIntensity:1.3,roughness:.35,metalness:.3});
  const white  = new THREE.MeshStandardMaterial({color:0xf6f6f2,roughness:.3});
  const iris   = new THREE.MeshStandardMaterial({color:0x3b2a1e,roughness:.25});
  const pupil  = new THREE.MeshBasicMaterial({color:0x030303});
  const mouthIn= new THREE.MeshBasicMaterial({color:0x2a0a0c});
  const accentMats=[sole,trim];

  const add=(parent,geo,mat,x,y,z,sx,sy,sz)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(sx!==undefined)m.scale.set(sx,sy,sz);parent.add(m);return m;};
  const sph=(r,w,h)=>new THREE.SphereGeometry(r,w||24,h||18);
  // Tapered limb segment hanging down from the origin: top radius r1, bottom radius r2.
  const seg=(parent,len,r1,r2,mat)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,20,1),mat);m.position.y=-len/2;parent.add(m);return m;};

  const root=new THREE.Group(); root.position.y=1.18; fullHuman.add(root);

  /* ---- pelvis and torso ---- */
  add(root,sph(.19,24,16),pants,0,-.02,0,1.25,.66,.72);
  const spine=new THREE.Group(); root.add(spine);
  // Torso: a smooth lathe (jacket), squashed front-to-back so it reads as a chest rather than a barrel.
  const prof=[[.0,0],[.175,0],[.19,.06],[.168,.22],[.19,.40],[.215,.55],[.225,.66],[.2,.74],[.12,.79],[.0,.80]]
    .map(p=>new THREE.Vector2(p[0],p[1]));
  const torso=new THREE.Mesh(new THREE.LatheGeometry(prof,36),jacket); torso.scale.set(1.22,1,.68); spine.add(torso);
  add(spine,new THREE.CylinderGeometry(.062,.07,.09,16),skin,0,.83,0);           // neck base
  add(spine,new THREE.BoxGeometry(.13,.34,.012),shirt,0,.58,.138);                 // shirt under open jacket
  add(spine,new THREE.TorusGeometry(.052,.009,10,32),trim,0,.52,.146);             // chest light
  add(spine,sph(.02,12,10),trim,0,.52,.15);
  add(spine,new THREE.BoxGeometry(.008,.5,.012),trim,-.074,.45,.134);              // jacket seams
  add(spine,new THREE.BoxGeometry(.008,.5,.012),trim,.074,.45,.134);
  add(spine,new THREE.TorusGeometry(.215,.007,8,48),trim,0,.02,0).rotation.x=Math.PI/2; // belt line glow
  spine.children[spine.children.length-1].scale.set(1,.62,1);

  /* ---- neck and head ---- */
  const neck=new THREE.Group(); neck.position.set(0,.84,0); spine.add(neck);
  add(neck,new THREE.CylinderGeometry(.055,.062,.12,16),skin,0,.05,0);
  const head=new THREE.Group(); head.position.set(0,.085,0); head.scale.setScalar(1.22); neck.add(head);
  const HC=.17; // head centre above the head pivot
  add(head,sph(1,40,30),skin,0,HC,0,.118,.150,.135);                              // cranium
  add(head,sph(1,30,22),skin,0,HC-.085,.028,.093,.092,.098);                      // jaw / chin mass
  add(head,sph(1,16,12),skin,0,HC-.105,.092,.04,.026,.03);                        // chin
  for(const s of [-1,1]){
    add(head,sph(1,14,10),skin,s*.123,HC-.01,-.005,.014,.032,.022);               // ears
    add(head,sph(1,16,12),skinDk,s*.118,HC-.01,.0,.004,.02,.014);
    add(head,sph(1,16,12),skin,s*.07,HC-.07,.104,.03,.026,.02);                  // cheeks
  }
  // hair: cap, fringe and sideburns
  const hairCap=add(head,new THREE.SphereGeometry(1,36,24,0,Math.PI*2,0,Math.PI*.58),hairM,0,HC+.006,-.008,.126,.158,.146);
  add(head,sph(1,20,14),hairM,0,HC+.105,.085,.1,.036,.06);
  add(head,sph(1,14,10),hairM,-.055,HC+.095,.1,.05,.03,.04);
  add(head,sph(1,14,10),hairM,.06,HC+.098,.095,.045,.028,.04);
  for(const s of [-1,1]) add(head,sph(1,10,8),hairM,s*.112,HC-.02,.03,.013,.05,.022);
  // nose
  add(head,sph(1,14,10),skin,0,HC-.02,.136,.017,.04,.02).rotation.x=-.25;
  add(head,sph(1,14,10),skin,0,HC-.052,.146,.022,.017,.02);
  for(const s of [-1,1]) add(head,sph(1,10,8),skin,s*.017,HC-.056,.138,.011,.011,.012);
  // eyes (eyeball group looks around; lids blink)
  const eyes=[];
  for(const s of [-1,1]){

/* Two-bone IK: put the wrist at arm.T, bend the elbow towards arm.pole, then orient the hand so its fingers
   point along arm.fd and its palm faces arm.pn (all in the torso's coordinate space). */
function solveArm(arm){
  _d.copy(arm.T).sub(arm.shoulder);
  let l=Math.min(Math.max(_d.length(),.14),ARM_L1+ARM_L2-.004);
  _dir.copy(_d).normalize();
  const a=(ARM_L1*ARM_L1-ARM_L2*ARM_L2+l*l)/(2*l), h=Math.sqrt(Math.max(ARM_L1*ARM_L1-a*a,0));
  _po.copy(arm.pole).addScaledVector(_dir,-arm.pole.dot(_dir));
  if(_po.lengthSq()<1e-6) _po.set(0,0,-1);
  _po.normalize();
  _E.copy(arm.shoulder).addScaledVector(_dir,a).addScaledVector(_po,h);
  _e1.copy(_E).sub(arm.shoulder).normalize();
  _q1.setFromUnitVectors(DOWN,_e1); arm.upper.quaternion.copy(_q1);
  _e2.copy(arm.shoulder).addScaledVector(_dir,l).sub(_E).normalize().applyQuaternion(_qp.copy(_q1).invert());
  _q2.setFromUnitVectors(DOWN,_e2); arm.fore.quaternion.copy(_q2);
  // hand orientation from desired finger direction and palm normal
  _y.copy(arm.fd).negate().normalize();
  _x.crossVectors(_y,_v.copy(arm.pn)).normalize();
  _z.crossVectors(_x,_y).normalize();
  _m.makeBasis(_x,_y,_z); _qd.setFromRotationMatrix(_m);
  _qp.copy(_q1).multiply(_q2).invert();

}

const audio={level:0,bass:0,high:0};

let externalAudioTime=0;
const extAudio={level:0,bass:0,high:0};

function setExternalAudio(level, bass, high){
  const l = Math.max(0, Math.min(1, Number(level) || 0));
  extAudio.level = l;
  extAudio.bass = Math.max(0, Math.min(1, bass !== undefined && bass !== null ? Number(bass) : l));
  extAudio.high = Math.max(0, Math.min(1, high !== undefined && high !== null ? Number(high) : l));

}

async function startAudioReactive(){
  if(micOn) return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    actx=new AC();if(actx.state==="suspended") await actx.resume();
    analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;
    actx.createMediaStreamSource(micStream).connect(analyser);
    freq=new Uint8Array(analyser.frequencyBinCount);micOn=true;updateMicUI();return true;
  }catch(e){micOn=false;updateMicUI();toast("Microphone unavailable — using simulated audio");return false;}
}
function stopAudioReactive(){
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(actx&&actx.close) actx.close().catch(()=>{});
  micStream=null;actx=null;analyser=null;micOn=false;updateMicUI();
}
function simulateAudio(t){
  let l,b,h;
  if(state==="speaking"){const syl=Math.pow(Math.abs(Math.sin(t*7.3)*Math.sin(t*2.1+1)),.8),gate=Math.sin(t*.9)>-.7?1:.15;l=(.3+.45*syl)*gate;b=l*(.6+.4*Math.sin(t*5));h=l*(.5+.5*Math.sin(t*11));}
  else if(state==="listening"){l=.2+.2*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.3));b=l*.8;h=l*.5;}
  else if(state==="thinking"){l=.12+.07*Math.sin(t*2.2);b=l*.7;h=l*.6;}
  else{l=.05+.03*Math.sin(t*1.1);b=l;h=l*.5;}
  return [l,b,h];
}
function readAudio(t,dt){
  let l,b,h;
  if(performance.now() - externalAudioTime < 220){
    l = extAudio.level;
    b = extAudio.bass;
    h = extAudio.high;
  } else if(micOn&&analyser){
    analyser.getByteFrequencyData(freq);
    const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=freq[i];return s/((z-a)*255);};
    l=Math.min(avg(0,freq.length)*2.6,1);b=Math.min(avg(0,6)*2.2,1);h=Math.min(avg(48,110)*3,1);
  } else {
    [l,b,h]=simulateAudio(t);
  }
  const k=1-Math.exp(-dt*(l>audio.level?18:6));
  audio.level+=(l-audio.level)*k;audio.bass+=(b-audio.bass)*k;audio.high+=(h-audio.high)*k;

setOrbState("idle");
requestAnimationFrame(animate);
})();
</script>
<script>
(()=>{const c=document.getElementById('touchParticles'),x=c.getContext('2d');let w=0,h=0,p=[],raf=0;
function size(){let d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size,{passive:true});size();
document.addEventListener('pointerdown',e=>{for(let i=0;i<14;i++){let a=2*Math.PI*i/14+(Math.random()-.5)*.3,s=1.2+Math.random()*2.4;p.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,r:1+Math.random()*2,h:180+Math.random()*90})}if(!raf)raf=requestAnimationFrame(draw)},{passive:true});
function draw(){raf=0;x.clearRect(0,0,w,h);for(let i=p.length-1;i>=0;i--){let q=p[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.975;q.vy=q.vy*.975+.01;q.l-=.035;if(q.l<=0){p.splice(i,1);continue}x.globalAlpha=q.l;x.fillStyle='hsl('+q.h+' 100% 68%)';x.shadowBlur=8;x.shadowColor=x.fillStyle;x.beginPath();x.arc(q.x,q.y,q.r*q.l,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.shadowBlur=0;if(p.length)raf=requestAnimationFrame(draw)}
})();
</script>
