name: Build Android APK

on:
  push:
    branches:
      - Google
      - Chatbox
      - Termux
      - Antigravity
      - Vercel
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Migrate Eleptical Orb to the original plain HTML asset
      shell: bash
      run: |
        set -euo pipefail
        source="app/src/main/assets/eleptical_orb.html.gz"
        target="app/src/main/assets/eleptical_orb.html"
        if [ -f "$source" ] && [ ! -f "$target" ]; then
          gzip -dc "$source" > "$target"
          actual="$(sha256sum "$target" | cut -d' ' -f1)"
          expected="5c3e3b16e3aeb059af7475207b9466e4a3a7c14ac46f1668b1859a24408945b1"
          test "$actual" = "$expected"
          rm "$source"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" "$source"
          git commit -m "Store original Eleptical Orb as plain HTML asset"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
    - name: Run unit tests
      env:
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: |
        set -o pipefail
        ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/gradle-test.log
    - name: Report failing unit tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        n = 0
        for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
            for tc in ET.parse(f).getroot().iter('testcase'):
                for k in ('failure', 'error'):
                    e = tc.find(k)
                    if e is not None and n < 10:
                        n += 1
                        msg = ((e.get('message') or '') + ' ' + (e.text or '')[:300]).replace('\n', ' ').replace('\r', ' ')
                        print('::error title=Test failed %s.%s::%s' % (tc.get('classname'), tc.get('name'), msg))
        if n == 0:
            print('::warning::No failing test cases found in the XML reports; the failure is a compile or setup error.')
        import re
        try:
            lines = open('/tmp/gradle-test.log', errors='replace').read().splitlines()
        except Exception:
            lines = []
        shown = 0
        for i, l in enumerate(lines):
            if shown < 12 and (l.startswith('e: ') or 'What went wrong' in l or l.startswith('> ') and 'rror' in l):
                shown += 1
                ctx = ' / '.join(x.strip() for x in lines[i:i+3])
                print('::error title=Gradle::' + ctx[:600].replace('%', ' '))
        PY
    - name: Build debug APK
      env:
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: ./gradlew assembleDebug
    - name: Print SHA1
      run: ./gradlew signingReport
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-App-Debug-Termux
        path: app/build/outputs/apk/debug/*.apk

# Rebuild trigger: restored Termux branch
