name: Build Chatbox APK

on:
  push:
    branches: [Chatbox]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-chatbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-chatbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chatbox branch
        uses: actions/checkout@v4
        with:
          ref: Chatbox

      - name: Confirm source branch and revision
        run: |
          echo "Building branch: $(git branch --show-current)"
          echo "Building commit: $(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "Chatbox"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.31.6'

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run unit tests
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK (retry transient download failures)
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if ./gradlew assembleDebug --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 25 seconds before retry"
              sleep 25
            fi
          done
          exit 1

      - name: Upload Chatbox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-App-Debug-Chatbox
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
