name: Chatbox Quality Check

on:
  push:
    branches:
      - Chatbox
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/chatbox-quality-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-chatbox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/Chatbox'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Chatbox only
        uses: actions/checkout@v4
        with:
          ref: Chatbox
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.31.6"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
